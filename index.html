/* ==========================================================================
 *  依頼登録 / 発注登録（新規）  仕様書 p6 の 1〜12
 *   ・ラベルは置かず、欄内の説明（placeholder / 先頭ラベル）で分かるようにして縦を詰める
 *   ・品名は「品名を選択」「産地を選択」の2コンボ（どちらも重複なし）＋手入力欄
 *   ・入力途中に全カードを作り直さない（＝#1に戻る現象を防ぐ）
 * ========================================================================== */

var UNIT_LIST = ['kg', '箱', 'パック', '束', '本', '個', '-'];
var CONTACTS = ['FAX', '電話', '口頭', 'メール', 'LINE', 'その他'];
var CAT_ORDER = { '青果': ['野菜', '果物'], '水産': ['大物', '鮮魚', '活魚', '冷凍', '塩干加工'] };

function openOrderForm(type, init) {
  navTo('orderForm', { type: type, init: init || {}, draft: null });
}

/* ---- 品名マスタのヘルパ ---- */
function masterOf(kind) { return (kind === '水産') ? S.suisan : S.seika; }
function catList(kind) {
  var m = masterOf(kind);
  var cats = Object.keys((m && m.byCat) || {});
  var order = CAT_ORDER[kind] || [];
  cats.sort(function (a, b) {
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return cats;
}
function catRows(kind, cat) {
  var m = masterOf(kind);
  return (m && m.byCat && m.byCat[cat]) || [];
}
/** 分類を選んでいないときは、その区分（青果／水産）の全品名を五十音順で返す */
function allRows(kind) {
  var m = masterOf(kind);
  if (!m || !m.byCat) return [];
  var out = [];
  Object.keys(m.byCat).forEach(function (c) { out = out.concat(m.byCat[c]); });
  out.sort(function (a, b) {
    var ka = kana(a.name), kb = kana(b.name);
    return ka < kb ? -1 : (ka > kb ? 1 : 0);
  });
  return out;
}
/** 品名の重複を除いたリスト（元データが五十音順なので順序はそのまま） */
function uniqNames(rows) {
  var seen = {}, out = [];
  rows.forEach(function (r) { if (!seen[r.name]) { seen[r.name] = 1; out.push(r.name); } });
  return out;
}
/** 産地の重複を除いたリスト。品名を指定するとその品名の産地だけ */
function uniqOrigins(rows, name) {
  var seen = {}, out = [];
  rows.forEach(function (r) {
    if (name && r.name !== name) return;
    var o = r.origin || '';
    if (!o || seen[o]) return;
    seen[o] = 1; out.push(o);
  });
  return out.sort(function (a, b) { return kana(a) < kana(b) ? -1 : 1; });
}
function findMasterId(rows, name, origin) {
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].name === name && (!origin || rows[i].origin === origin)) return rows[i].id;
  }
  return '';
}

function renderOrderForm(P) {
  var type = P.type;
  var isReq = (type === '依頼');
  var kind = isReq ? 'req' : 'ord';
  var d = P.draft || Object.assign({
    日付: todayYmd(), 連絡形態: 'FAX', 取引先ID: '', 取引先名: '', 概要: '',
    希望納品日: '', 使用日: '', 市場開場日: isReq ? '' : todayYmd(), 補足事項: '',
    担当ID: (S.me ? S.me.担当ID : ''), 依頼ID: '', copied: false, items: [newItem()]
  }, P.init || {});
  if (!d.items || !d.items.length) d.items = [newItem()];
  P.draft = d;

  setHeader(isReq ? '顧客依頼' : '仲卸発注', {
    back: true, kind: kind, tanto: d.担当ID,
    onTanto: function (v) { d.担当ID = v; }
  });

  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  /* ---- 日付 / 連絡形態 ---- */
  var dateBtn = el('button.btn.gh.fldbtn', {
    text: fieldText('日付', dateLabel(d.日付)),
    onclick: function () {
      pickDate('日付', d.日付).then(function (v) {
        if (v === null) return;
        d.日付 = v; dateBtn.textContent = fieldText('日付', dateLabel(v));
      });
    }
  });
  var contactSel = sel(CONTACTS, d.連絡形態, function (v) { d.連絡形態 = v; });
  contactSel.setAttribute('data-t', 'contact');

  /* ---- 取引先 ---- */
  var pSel = el('select', { 'data-t': 'partner' });
  function fillPartner() {
    clear(pSel);
    pSel.appendChild(el('option', { value: '', text: (isReq ? '顧客' : '仲卸') + 'を選択…' }));
    var list = isReq ? S.customers : S.brokers;
    var idc = isReq ? '顧客ID' : '仲卸ID', nc = isReq ? '顧客名' : '仲卸名';
    list.forEach(function (r) {
      pSel.appendChild(el('option', {
        value: String(r[idc]),
        text: r[nc] + (r.mine ? ' ★' : '')
      }));
    });
    pSel.appendChild(el('option', { value: '__new__', text: '＋ 新規登録…' }));
    pSel.value = String(d.取引先ID || '');
  }
  fillPartner();
  pSel.onchange = function () {
    if (pSel.value === '__new__') {
      pSel.value = String(d.取引先ID || '');
      P.draft = collect();
      navTo('partnerEdit', {
        kind: isReq ? '顧客' : '仲卸', data: null,
        after: function (id, name) { P.draft.取引先ID = String(id); P.draft.取引先名 = name; }
      });
      return;
    }
    d.取引先ID = pSel.value;
  };

  var sum = el('textarea', { placeholder: isReq ? '依頼概要（例: さくらさくみらい勝どき 8/7使用分）' : '発注概要（顧客分を合算した内容）' });
  sum.value = d.概要 || '';
  sum.oninput = function () { d.概要 = sum.value; };

  /* ---- 日程 ---- */
  function dateFld(label, key) {
    var b = el('button.btn.gh.fldbtn', {
      text: fieldText(label, d[key] ? dateLabel(d[key]) : ''),
      onclick: function () {
        pickDate(label, d[key] || d.日付).then(function (v) {
          if (v === null) return;
          d[key] = v;
          b.textContent = fieldText(label, v ? dateLabel(v) : '');
          if (key === '市場開場日' && v && !S.market[v]) {
            toast('この日は市場が休市の可能性があります', 'warn', 4000);
          }
        });
      }
    });
    return el('div.fld', null, [b]);
  }
  var note = el('textarea', { placeholder: '補足事項（例: 大小込みで／小口分け希望）' });
  note.value = d.補足事項 || '';
  note.oninput = function () { d.補足事項 = note.value; };

  var head = el('div.in', null, [
    el('div.row', null, [
      el('div.fld', { style: 'flex:1' }, [dateBtn]),
      el('div.fld.w110', null, [contactSel])
    ]),
    el('div.fld', null, [pSel]),
    el('div.fld', null, [sum]),
    isReq
      ? el('div.row', null, [dateFld('希望納品日', '希望納品日'), dateFld('使用日', '使用日')])
      : dateFld('市場開場日', '市場開場日'),
    el('div.fld', null, [note])
  ]);
  sc.appendChild(el('div.sec', null, [autoScrollAll(head)]));

  /* ---- 品名情報 ---- */
  var itemsHost = el('div.in');
  var addBtn = el('button.btn.n', {
    style: 'width:100%', text: '＋ 品名項目を追加', 'data-t': 'itemAdd',
    onclick: function () {
      d.items.push(newItem());
      var card = itemCard(d.items[d.items.length - 1]);
      itemsHost.insertBefore(card, addBtn);
      renumber();
      setTimeout(function () {
        try { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { }
      }, 60);
    }
  });
  sc.appendChild(el('div.sec', null, [el('h3', { text: '品名情報' }), itemsHost]));

  function drawItems() {
    clear(itemsHost);
    d.items.forEach(function (it) { itemsHost.appendChild(itemCard(it)); });
    itemsHost.appendChild(addBtn);
    renumber();
  }
  /** カードの #番号 を振り直す（追加・削除のあと） */
  function renumber() {
    $$('.item', itemsHost).forEach(function (c, i) {
      var no = $('.no', c);
      if (no) no.textContent = '#' + (i + 1);
    });
  }
  function cardIndex(card) { return $$('.item', itemsHost).indexOf(card); }
  /** そのカードだけ差し替える（全部作り直すとスクロール位置が飛ぶため） */
  function redraw(card) {
    var i = cardIndex(card);
    if (i < 0) return;
    itemsHost.replaceChild(itemCard(d.items[i]), card);
    renumber();
  }

  drawItems();
  if (!S.seika || !S.suisan) ensureItems().then(drawItems);

  /* ---- 品名カード ---- */
  function itemCard(it) {
    var card = el('div.item');
    card.appendChild(el('div.ih', null, [
      el('span.no', { text: '#' }),
      el('div.sp'),
      el('button.btn.s.d', {
        text: '取消し', 'data-t': 'itemDel', onclick: function () {
          var i = cardIndex(card);
          if (i < 0) return;
          d.items.splice(i, 1);
          itemsHost.removeChild(card);
          if (!d.items.length) {
            d.items.push(newItem());
            itemsHost.insertBefore(itemCard(d.items[0]), addBtn);
          }
          renumber();
        }
      })
    ]));

    // 青果 / 水産
    var tabs = el('div.tabs');
    ['青果', '水産'].forEach(function (k) {
      tabs.appendChild(el('button' + (it.マスタ区分 === k ? '.on' : ''), {
        text: k, onclick: function () {
          if (it.マスタ区分 === k) return;
          it.マスタ区分 = k; it.分類 = '';
          redraw(card);
        }
      }));
    });
    card.appendChild(tabs);

    // 分類（未選択＝その区分の全品名から選べる）
    var cats = catList(it.マスタ区分);
    if (cats.length) {
      var cbox = el('div.cats');
      cats.forEach(function (c) {
        cbox.appendChild(el('button' + (it.分類 === c ? '.on' : ''), {
          text: c, onclick: function () {
            it.分類 = (it.分類 === c ? '' : c);      // もう一度押すと全件に戻る
            redraw(card);
          }
        }));
      });
      card.appendChild(cbox);
    }

    var nameIn = el('input', { type: 'text', placeholder: '品名（必須）', value: it.品名 || '', 'data-t': 'itemName' });
    var originIn = el('input', { type: 'text', placeholder: '産地', value: it.産地 || '' });

    /* --- 品名を選択 / 産地を選択（★常に表示。分類を選ぶと絞り込まれる） --- */
    var rows = it.分類 ? catRows(it.マスタ区分, it.分類) : allRows(it.マスタ区分);
    var nSel = el('select', { 'data-t': 'itemMaster' });
    var oSel = el('select', { 'data-t': 'itemOrigin' });

    function fillName() {
      var names = uniqNames(rows);
      clear(nSel);
      nSel.appendChild(el('option', {
        value: '',
        text: rows.length
          ? '品名を選択…（' + names.length + '件' + (it.分類 ? '／' + it.分類 : '／全' + it.マスタ区分) + '）'
          : '品名マスタを読込中…'
      }));
      names.forEach(function (n) { nSel.appendChild(el('option', { value: n, text: n })); });
      nSel.value = names.indexOf(it.品名) >= 0 ? it.品名 : '';
      return names;
    }
    function fillOrigin() {
      var ol = uniqOrigins(rows, nSel.value || '');
      clear(oSel);
      oSel.appendChild(el('option', {
        value: '',
        text: ol.length ? '産地を選択…（' + ol.length + '件）' : '産地を選択…'
      }));
      ol.forEach(function (o) { oSel.appendChild(el('option', { value: o, text: o })); });
      oSel.value = ol.indexOf(it.産地) >= 0 ? it.産地 : '';
      return ol;
    }
    fillName();
    fillOrigin();
    nSel.onchange = function () {
      it.品名 = nSel.value;
      nameIn.value = it.品名;
      var ol = fillOrigin();
      if (ol.length === 1) { it.産地 = ol[0]; oSel.value = ol[0]; originIn.value = ol[0]; }
      it.マスタID = findMasterId(rows, it.品名, it.産地);
    };
    oSel.onchange = function () {
      it.産地 = oSel.value;
      originIn.value = it.産地;
      it.マスタID = findMasterId(rows, it.品名, it.産地);
    };
    card.appendChild(el('div.row', null, [
      el('div.fld', null, [nSel]), el('div.fld', null, [oSel])
    ]));

    // マスタ未読込なら取り込んでからこのカードだけ作り直す
    if (!rows.length) {
      ensureItems().then(function () {
        if (card.parentNode === itemsHost) redraw(card);
      });
    }

    /* --- 品名 / 産地（手入力。コンボと同じサイズで並べる） --- */
    nameIn.oninput = function () { it.品名 = nameIn.value; };
    originIn.oninput = function () { it.産地 = originIn.value; };
    card.appendChild(el('div.row', null, [
      el('div.fld', null, [nameIn]), el('div.fld', null, [originIn])
    ]));

    // 数量 / 単位
    var qIn = el('input', {
      type: 'number', step: '0.01', inputmode: 'decimal', placeholder: '数量',
      value: it.数量 === '' ? '' : it.数量, 'data-t': 'itemQty'
    });
    qIn.oninput = function () { it.数量 = qIn.value; };
    var uSel = sel(UNIT_LIST, it.単位 || 'kg', function (v) { it.単位 = v; });
    card.appendChild(el('div.row', null, [
      el('div.fld', { style: 'flex:1' }, [qIn]),
      el('div.fld.w90', null, [uSel])
    ]));

    // メモ（1行）
    var mIn = el('input', { type: 'text', placeholder: 'メモ', value: it.メモ || '' });
    mIn.oninput = function () { it.メモ = mIn.value; };
    card.appendChild(el('div.fld', null, [mIn]));

    return autoScrollAll(card);
  }

  /* ---- FAB（キャンセルは🗑のみ。画面内にボタンは置かない） ---- */
  main.appendChild(el('div.fabrow', null, [
    el('button.fab.gray', { text: '←', onclick: back }),
    el('button.fab.r', { text: '🗑', title: 'キャンセル（記録を残して取消）', onclick: doCancel }),
    el('button.fab.g', { text: '💾', title: '確定登録', onclick: doSave })
  ]));

  function collect() {
    return {
      日付: d.日付, 連絡形態: d.連絡形態, 取引先ID: d.取引先ID, 取引先名: d.取引先名,
      概要: sum.value, 希望納品日: d.希望納品日, 使用日: d.使用日,
      市場開場日: d.市場開場日, 補足事項: note.value,
      担当ID: $('#hTanto').value || d.担当ID, 依頼ID: d.依頼ID,
      copied: d.copied, items: d.items
    };
  }
  function validItems(o) {
    return (o.items || []).filter(function (i) { return has(i.品名); });
  }

  /* ---- 確定登録（仕様書 p6-12） ---- */
  function doSave() {
    var o = collect();
    if (!has(o.取引先ID)) { toast((isReq ? '顧客' : '仲卸') + 'を選択してください', 'err'); return; }
    var items = validItems(o);
    if (!items.length) { toast('品名を1件以上入力してください', 'err'); return; }

    confirmModal('確定登録',
      (isReq ? '顧客依頼' : '仲卸発注') + 'を確定登録しますか？\n\n' +
      '　' + dateLabel(o.日付) + '\n' +
      '　' + (partnerOf(type, o.取引先ID).name || o.取引先名) + '\n' +
      '　品名 ' + items.length + '件',
      '確定登録', 'p'
    ).then(function (ok) {
      if (!ok) return;
      // 依頼からコピーした発注は必ずコピー元と重複するので、重複チェックはしない
      submit(o, items, !!o.copied);
    });
  }

  function submit(o, items, force) {
    api('order.create', {
      type: type, force: force,
      data: {
        日付: o.日付, 連絡形態: o.連絡形態, 取引先ID: o.取引先ID, 概要: o.概要,
        希望納品日: o.希望納品日, 使用日: o.使用日,
        市場開場日: o.市場開場日, 補足事項: o.補足事項,
        担当ID: o.担当ID, 依頼ID: o.依頼ID
      },
      items: items
    }).then(function (r) {
      if (r.needConfirm) { showDupWarning(r, function () { submit(o, items, true); }); return; }
      toast((isReq ? '依頼' : '発注') + 'を登録しました');
      afterCreate(r.id, o, items);
    });
  }

  /** 登録後のモーダル連鎖 */
  function afterCreate(id, o, items) {
    reloadOrders().catch(function () { });
    if (isReq) {
      confirmModal('仲卸発注へコピー', 'この情報を仲卸発注にコピー編集しますか？', 'コピーする', 'n')
        .then(function (ok) {
          if (!ok) { back(); return; }
          navReplace('orderForm', {
            type: '発注',
            init: {
              日付: todayYmd(), 連絡形態: o.連絡形態, 概要: o.概要,
              市場開場日: o.希望納品日 || todayYmd(), 補足事項: o.補足事項,
              担当ID: o.担当ID, 依頼ID: id, copied: true,
              items: items.map(function (i) {
                return {
                  品名: i.品名, 産地: i.産地, メモ: i.メモ, 数量: i.数量, 単位: i.単位,
                  マスタ区分: i.マスタ区分 || '青果', マスタID: i.マスタID, 分類: i.分類 || ''
                };
              })
            }
          });
          toast('依頼内容をコピーしました。仲卸を選択して登録してください', 'info', 4200);
        });
    } else {
      confirmModal('発注書PDF', '発注書PDFを発行しますか？\n（金額の入っていない仲卸業者向けPDFです）', '発行する', 'n')
        .then(function (ok) {
          if (ok) issuePdf('発注書', { id: id });
          back();
        });
    }
  }

  /** キャンセル（記録を残す：ステータス X で登録） */
  function doCancel() {
    var o = collect();
    var items = validItems(o);
    var dInp = autoScroll(el('input', { type: 'date', value: todayYmd(), style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px' }));
    var rInp = autoScroll(el('textarea', { placeholder: 'キャンセル理由', style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:70px' }));
    rInp.value = o.概要 || '';
    modal({
      title: 'キャンセル', closable: false,
      body: el('div', null, [
        el('div.hint', { text: 'キャンセル日' }), dInp,
        el('div.hint', { style: 'margin-top:8px', text: 'キャンセル理由' }), rInp,
        el('div.hint', { style: 'margin-top:6px', text: '※ステータス「X」で記録し、論理削除します（履歴は残ります）。' })
      ]),
      buttons: [
        { label: '戻る' },
        {
          label: 'キャンセル確定', cls: 'd', fn: function () {
            if (!has(o.取引先ID) || !items.length) {
              toast('入力を破棄しました', 'info');
              back();
              return;
            }
            api('order.create', {
              type: type, force: true,
              data: {
                日付: o.日付, 連絡形態: o.連絡形態, 取引先ID: o.取引先ID, 概要: o.概要,
                希望納品日: o.希望納品日, 使用日: o.使用日,
                市場開場日: o.市場開場日, 補足事項: o.補足事項,
                担当ID: o.担当ID, 依頼ID: o.依頼ID
              },
              items: items
            }).then(function (r) {
              return api('order.cancel', {
                type: type, id: r.id,
                'キャンセル日': dInp.value, 'キャンセル理由': rInp.value
              });
            }).then(function () {
              toast('キャンセルとして記録しました', 'warn');
              return reloadOrders();
            }).then(back);
          }
        }
      ]
    });
  }
}

function newItem() {
  return { マスタ区分: '青果', 分類: '', 品名: '', 産地: '', メモ: '', 数量: '', 単位: 'kg', マスタID: '' };
}
function sel(list, cur, onChange) {
  var s = el('select');
  list.forEach(function (v) { s.appendChild(el('option', { value: v, text: v })); });
  s.value = cur;
  s.onchange = function () { onChange(s.value); };
  return s;
}

/* ==========================================================================
 *  重複注文の警告（濵貞スタッフ間の二重注文防止）
 * ========================================================================== */
function showDupWarning(r, onForce) {
  var body = el('div');
  var others = r.warnings.filter(function (w) { return w.level === 'other'; });
  var selfs = r.warnings.filter(function (w) { return w.level !== 'other'; });
  body.appendChild(el('div', {
    style: 'font-size:14px;font-weight:700;margin-bottom:8px',
    text: '同じ品名の注文が既に登録されています。二重注文でないか確認してください。'
  }));
  function box(title, list, cls) {
    if (!list.length) return null;
    var b = el('div.wbox' + (cls ? '.' + cls : ''));
    b.appendChild(el('div.wt', { text: title }));
    var t = el('table.tbl');
    t.appendChild(el('tr', null, [
      el('th', { text: '種別' }), el('th', { text: '品名' }), el('th', { text: '数量' }),
      el('th', { text: '取引先' }), el('th', { text: '担当' }), el('th', { text: '日付' })
    ]));
    list.forEach(function (w) {
      t.appendChild(el('tr', null, [
        el('td', null, [el('span.badge.' + (w.種別 === '依頼' ? 'req' : 'ord'), { text: w.種別 })]),
        el('td', { text: w.品名 }),
        el('td.n', { text: qty(w.数量) + (w.単位 || '') }),
        el('td', { text: w.取引先名 }),
        el('td', { text: w.担当名 }),
        el('td', { text: md(w.使用日 || w.日付) })
      ]));
    });
    b.appendChild(t);
    return b;
  }
  var o1 = box('⚠ 他の担当が既に手配しています', others, 'other');
  if (o1) body.appendChild(o1);
  var o2 = box('ℹ 自分が過去に登録した同一品名', selfs);
  if (o2) body.appendChild(o2);

  modal({
    title: '重複注文の確認', body: body, closable: false,
    buttons: [
      { label: '戻って修正' },
      { label: 'それでも登録する', cls: 'w', fn: onForce }
    ]
  });
}

/* ==========================================================================
 *  編集更新画面（納品確定 / 入荷確定）  仕様書 p7 の 1〜10
 * ========================================================================== */

/** 確定日ラベル（サーバの order.get を待たずに決められる） */
function confirmLabelOf(type) { return (type === '依頼') ? '納品確定日' : '入荷確定日'; }

/** 閲覧のみ（請求／支払確認まで終わった案件・キャンセル） */
function isLockedStatus(st) {
  var s = String(st);
  return (s === 'X' || s === '5' || s === '6');
}

/** 手元のデータ（カレンダー取得済み／未完了リスト）から1件を探す */
function findLocalOrder(type, id) {
  var pools = [(type === '依頼') ? S.requests : S.orders, S.pendingList || []];
  for (var p = 0; p < pools.length; p++) {
    var list = pools[p] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].type === type && String(list[i].id) === String(id)) return list[i];
    }
  }
  return null;
}

/**
 * 案件をタップ → 編集画面へ。
 *
 * ★体感速度の要:
 *   以前は order.get の応答（2〜3秒）を待ってから確定日ウィンドウを出していた。
 *   いまは
 *     ①order.get は即座に走らせる（待たない）
 *     ②手元のカレンダーデータで確定日ウィンドウを"その場で"開く
 *     ③ユーザーが日付を決め終わる頃には応答が届いているので、そのまま編集画面へ
 *   という順にしてある。人が入力している時間を通信時間に充てる形。
 */
function openOrderEdit(type, id) {
  // ①通信を先に開始（結果は後で使う）。未処理のrejectを起こさないよう受け止めておく
  var pending = api('order.get', { type: type, id: id })
    .then(function (g) { return { ok: true, got: g }; })
    .catch(function (e) { return { ok: false, err: e }; });

  var local = findLocalOrder(type, id);

  // ②手元にデータがあり、閲覧のみでなければ通信を待たずにウィンドウを開く
  if (local && !isLockedStatus(local.ステータス)) {
    askConfirmDate({
      type: local.type,
      確定日: local.確定日 || '',
      確定日ラベル: confirmLabelOf(local.type),
      取引先名: local.取引先名,
      日付: local.日付,
      担当名: local.担当名,
      明細要約: local.明細要約,
      希望納品日: local.希望納品日,
      使用日: local.使用日,
      市場開場日: local.市場開場日
    }).then(function (v) {
      if (v === false) return;                       // 戻る
      openEditWhenReady(pending, v);
    });
    return;
  }

  // ③手元に無い／閲覧のみのときだけ、読み込みを待つ
  openEditWhenReady(pending, undefined);
}

/** order.get の結果が届き次第、編集画面へ遷移する（届いていなければ短いスピナー） */
function openEditWhenReady(pending, confirmDate) {
  var m = null;
  var t = setTimeout(function () {
    m = modal({
      title: '読み込み中', closable: false,
      body: el('div', { style: 'text-align:center;padding:14px' }, [el('span.spin.dk'), ' 案件を読み込んでいます…'])
    });
  }, 250);                                            // 250ms以内に届けばスピナーは出さない

  pending.then(function (r) {
    clearTimeout(t);
    if (m) m.close();
    if (!r.ok) return;                                // エラー表示は api() 側で済んでいる
    var got = r.got, h = got.head;
    var locked = isLockedStatus(h.ステータス);
    if (locked) { navTo('orderEdit', { got: got, locked: true }); return; }
    if (confirmDate === undefined) {
      // 手元にデータが無かった場合はここで確定日を聞く
      askConfirmDate(h).then(function (v) {
        if (v === false) return;
        if (v !== null) h.確定日 = v;
        navTo('orderEdit', { got: got, locked: false });
      });
      return;
    }
    if (confirmDate !== null) h.確定日 = confirmDate;  // null＝「あとで入力」＝サーバの値のまま
    navTo('orderEdit', { got: got, locked: false });
  });
}

/**
 * 確定日の入力ウィンドウ。
 *  ★以前は「タップ → 別のカレンダーウィンドウ」の2段階だったが、
 *    日付欄・今日/明日/明後日/クリアをこのウィンドウに直接載せて1画面で終わるようにした。
 *  戻り値: false=戻る / null=あとで入力（変更しない） / 'yyyy-MM-dd' or ''=確定
 */
function askConfirmDate(h) {
  return new Promise(function (res) {
    var label = h.確定日ラベル || confirmLabelOf(h.type);
    // 依頼＝顧客の希望納品日、発注＝市場開場日 が確定日の目安になるので、
    // それを表示したうえで既定値として入れておく（そのまま「日付確定」で済むことが多い）
    var refLabel = (h.type === '依頼') ? '希望納品日' : '市場開場日';
    var refDate = (h.type === '依頼') ? (h.希望納品日 || '') : (h.市場開場日 || '');
    var inp = el('input', {
      type: 'date', value: h.確定日 || refDate || '',
      style: 'width:100%;padding:13px;border:1px solid var(--navy);border-radius:8px;font-size:17px;font-weight:700'
    });
    var info = el('div.hint', { style: 'margin-top:7px;min-height:19px' });
    function upd() {
      if (!inp.value) { info.textContent = '空欄のままでも先に進めます（「あとで入力」）'; return; }
      var k = KOYOMI.info(inp.value);
      info.textContent = wareki(inp.value) + '（' + DOW[parseYmd(inp.value).getDay()] + '）' +
        (k.holiday ? '　' + k.holiday : '') +
        (S.market[inp.value] ? '　市場:' + S.market[inp.value].label : '　市場:休市');
    }
    inp.addEventListener('change', upd);
    inp.addEventListener('input', upd);
    upd();

    function setD(n) { return function () { inp.value = ymd(addDays(new Date(), n)); upd(); }; }
    var quick = el('div.btnrow', { style: 'margin-top:9px' }, [
      el('button.btn.s', { text: '今日', onclick: setD(0) }),
      el('button.btn.s', { text: '明日', onclick: setD(1) }),
      el('button.btn.s', { text: '明後日', onclick: setD(2) }),
      el('button.btn.s', { text: 'クリア', onclick: function () { inp.value = ''; upd(); } })
    ]);

    modal({
      title: label + 'の入力', closable: false,
      body: el('div', null, [
        el('div.hint', {
          style: 'margin-bottom:9px',
          text: (h.type === '依頼' ? '顧客' : '仲卸') + '：' + (h.取引先名 || '—') +
            '　/　' + h.type + '日：' + mdw(h.日付) +
            (h.担当名 ? '　/　担当：' + h.担当名 : '')
        }),
        h.明細要約 ? el('div', { style: 'font-size:13px;margin-bottom:6px;color:#42506a', text: h.明細要約 }) : null,
        el('div', {
          style: 'font-size:13.5px;font-weight:700;margin-bottom:9px;color:'
            + (refDate ? 'var(--navy)' : '#8b95a6'),
          text: refLabel + '：' + (refDate ? ymdSlash(refDate) : '（未設定）')
        }),
        inp, quick, info
      ]),
      buttons: [
        { label: '戻る', fn: function () { res(false); } },
        { label: 'あとで入力', fn: function () { res(null); } },
        { label: '日付確定', cls: 'p', fn: function () { res(inp.value || ''); } }
      ]
    });
    setTimeout(function () { try { inp.focus(); } catch (e) { } }, 80);
  });
}

function renderOrderEdit(P) {
  var got = P.got, h = got.head;
  var isReq = (h.type === '依頼');
  var kind = isReq ? 'req' : 'ord';
  var locked = !!P.locked;

  var items = got.items.filter(function (i) { return i.区分 !== '値引き'; });
  var discounts = got.items.filter(function (i) { return i.区分 === '値引き'; })
    .map(function (i) { return { 金額: Math.abs(num(i.金額)), メモ: i.メモ }; });
  var manual = !!h.合計手入力;

  setHeader(isReq ? '顧客納品' : '仲卸入荷', {
    back: true, kind: kind, tanto: h.担当ID,
    onTanto: function (v) { h.担当ID = v; }
  });

  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  /* ---- 概要だけ編集可。他はラベル表示（テキスト欄をやめて縦を詰める） ---- */
  var sumTa = autoScroll(el('textarea', {
    placeholder: (isReq ? '依頼概要' : '発注概要') + '（編集可）'
  }));
  sumTa.value = h.概要 || '';
  if (locked) sumTa.disabled = true;

  sc.appendChild(el('div.sec', null, [
    el('h3', {
      text: (isReq ? '顧客納品' : '仲卸入荷') + '　' + mdw(h.日付) + '　' + (h.取引先名 || '') +
        (locked ? '【' + statusLabel({ type: h.type, ステータス: h.ステータス }) + '／閲覧のみ】' : '')
    }),
    el('div.in.tight', null, [
      kvRow([kv(h.type + '日', mdw(h.日付)), kv('連絡形態', h.連絡形態)]),
      kv(isReq ? '顧客' : '仲卸', h.取引先名, true),
      isReq
        ? kvRow([kv('希望納品日', mdw(h.希望納品日)), kv('使用日', mdw(h.使用日))])
        : kvRow([kv('市場開場日', mdw(h.市場開場日)), kv('補足事項', h.補足事項)]),
      h.ステータス === 'X'
        ? kvRow([kv('キャンセル日', mdw(h.キャンセル日)), kv('理由', h.キャンセル理由)]) : null,
      h.請求日 ? kv('請求日', mdw(h.請求日)) : null,
      h.支払確認日 ? kv('支払確認日', mdw(h.支払確認日)) : null,
      el('div.fld', { style: 'margin-top:8px' }, [sumTa]),
      confirmDateFld()
    ])
  ]));

  var cdBtn;
  function confirmDateFld() {
    cdBtn = el('button.btn.gh.fldbtn', {
      text: fieldText(h.確定日ラベル, h.確定日 ? dateLabel(h.確定日) : ''),
      onclick: function () {
        if (locked) return;
        pickDate(h.確定日ラベル, h.確定日 || todayYmd()).then(function (v) {
          if (v === null) return;
          h.確定日 = v;
          cdBtn.textContent = fieldText(h.確定日ラベル, v ? dateLabel(v) : '');
        });
      }
    });
    return el('div.fld', null, [cdBtn]);
  }

  /* ---- 品名情報＋金額 ---- */
  var itemsHost = el('div.in');
  sc.appendChild(el('div.sec', null, [el('h3', { text: '品名情報・金額' }), itemsHost]));
  var totalIn, totalNote;

  function drawItems() {
    clear(itemsHost);
    var t = el('table.tbl');
    t.appendChild(el('tr', null, [
      el('th', { text: '品名' }), el('th', { style: 'width:64px', text: '数量' }),
      el('th', { style: 'width:46px', text: '単位' }), el('th', { style: 'width:104px', text: '金額' })
    ]));
    items.forEach(function (it, i) {
      var amtIn = el('input', {
        type: 'number', inputmode: 'numeric', step: '1', 'data-t': 'itemAmt',
        style: 'width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;text-align:right',
        value: (it.金額 === '' || it.金額 === null) ? '' : it.金額
      });
      if (locked || manual) amtIn.disabled = true;
      amtIn.oninput = function () { it.金額 = amtIn.value === '' ? '' : num(amtIn.value); recalc(); };
      it.__in = autoScroll(amtIn);
      t.appendChild(el('tr', null, [
        el('td', null, [
          el('div', { style: 'font-weight:700', text: it.品名 }),
          (has(it.産地) || has(it.メモ)) ? el('div', { style: 'font-size:11px;color:#6b7787', text: [it.産地, it.メモ].filter(has).join(' / ') }) : null
        ]),
        el('td.n', { text: qty(it.数量) }),
        el('td', { text: it.単位 }),
        el('td', null, [amtIn])
      ]));
      void i;
    });
    // 値引き行
    discounts.forEach(function (dc, i) {
      var dIn = el('input', {
        type: 'number', inputmode: 'numeric', 'data-t': 'discAmt',
        style: 'width:100%;padding:5px 6px;border:1px solid var(--err);border-radius:5px;text-align:right;color:var(--err)',
        value: dc.金額 || ''
      });
      if (locked) dIn.disabled = true;
      dIn.oninput = function () { dc.金額 = Math.abs(num(dIn.value)); recalc(); };
      var memoIn = el('input', {
        type: 'text', placeholder: '値引き理由',
        style: 'width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px',
        value: dc.メモ || ''
      });
      if (locked) memoIn.disabled = true;
      memoIn.oninput = function () { dc.メモ = memoIn.value; };
      t.appendChild(el('tr', null, [
        el('td', null, [el('div', { style: 'font-weight:700;color:var(--err)', text: '値引き' }), memoIn]),
        el('td', { text: '' }), el('td', { text: '' }),
        el('td', null, [
          el('div', { style: 'display:flex;gap:3px;align-items:center' }, [
            el('span', { style: 'color:var(--err);font-weight:700', text: '▲' }), dIn
          ]),
          locked ? null : el('button.btn.s.d', {
            style: 'margin-top:3px;width:100%;padding:2px', text: '削除',
            onclick: function () { discounts.splice(i, 1); drawItems(); }
          })
        ])
      ]));
    });
    itemsHost.appendChild(t);

    // 合計欄（値引きボタンは合計の左に小さく配置：仕様書 p7-7）
    totalIn = el('input', {
      type: 'number', inputmode: 'numeric', 'data-t': 'total',
      style: 'width:130px;padding:7px 8px;border:1px solid var(--navy);border-radius:6px;text-align:right;font-weight:700;font-size:16px',
      value: (h.合計金額 === '' || h.合計金額 === null) ? '' : h.合計金額
    });
    if (locked) totalIn.disabled = true;
    autoScroll(totalIn);
    totalIn.oninput = function () {
      // 合計に直接入力 → 各品名の金額は空欄になる（仕様書 p7-6）
      manual = true;
      h.合計金額 = num(totalIn.value);
      items.forEach(function (it) { it.金額 = ''; if (it.__in) { it.__in.value = ''; it.__in.disabled = true; } });
      updNote();
    };
    totalNote = el('div.hint');
    itemsHost.appendChild(el('div.dsum', null, [
      el('div', { style: 'display:flex;gap:6px;align-items:center' }, [
        locked ? null : el('button.btn.s.d', {
          text: '値引き', 'data-t': 'addDisc', onclick: function () { discounts.push({ 金額: '', メモ: '' }); drawItems(); }
        }),
        locked || !manual ? null : el('button.btn.s', {
          text: '明細から再計算', onclick: function () { manual = false; recalc(); drawItems(); }
        }),
        el('span', { text: '合計' })
      ]),
      totalIn
    ]));
    itemsHost.appendChild(totalNote);
    updNote();
    if (!manual) recalc();
  }

  function recalc() {
    if (manual) { updNote(); return; }
    var s = 0;
    items.forEach(function (it) { s += num(it.金額); });
    discounts.forEach(function (dc) { s -= Math.abs(num(dc.金額)); });
    h.合計金額 = s;
    if (totalIn) totalIn.value = s ? s : '';
    updNote();
  }
  function updNote() {
    if (!totalNote) return;
    var s = 0;
    items.forEach(function (it) { s += num(it.金額); });
    var dsum = discounts.reduce(function (a, x) { return a + Math.abs(num(x.金額)); }, 0);
    totalNote.textContent = manual
      ? '合計を手入力中（各品名の金額は空欄になります）　表示: ' + yen(h.合計金額)
      : '明細計 ' + yen(s) + (dsum ? '　値引き ▲' + yen(dsum).replace('¥', '¥') : '') + '　→　合計 ' + yen(h.合計金額);
  }
  drawItems();

  /* ---- 発行済み伝票 ---- */
  if (got.slips && got.slips.length) {
    var sl = el('div.in');
    got.slips.forEach(function (s) {
      sl.appendChild(el('div', { style: 'font-size:12.5px;margin-bottom:4px' }, [
        el('span.badge.x', { text: s.伝票区分 }), ' ' + mdw(s.伝票発行日) + ' ',
        s.PDF_URL ? el('a', { href: s.PDF_URL, target: '_blank', rel: 'noopener', text: 'PDFを開く' }) : null
      ]));
    });
    sc.appendChild(el('div.sec', null, [el('h3', { text: '発行済み帳票' }), sl]));
  }

  /* ---- FAB（PDF / キャンセル / 保存） ---- */
  var fabs = el('div.fabrow');
  fabs.appendChild(el('button.fab.gray', { text: '←', onclick: back }));
  fabs.appendChild(el('button.fab.n', {
    title: 'PDF発行', 'data-t': 'fabPdf', html: '<img src="img/pdf.png" alt="PDF">',
    onclick: function () {
      if (isReq) {
        choiceModal('納品書PDF', '納品書PDFを発行しますか？', [
          { label: 'キャンセル', value: null },
          { label: '金額無し', cls: 'n', value: '納品書(金額無)' },
          { label: '金額有り', cls: 'p', value: '納品書(金額有)' }
        ]).then(function (v) { if (v) issuePdf(v, { id: h.id }); });
      } else {
        confirmModal('発注書PDF', '発注書PDFを発行しますか？\n（入荷確定日・仕入金額が入力済みでも金額は載りません）', '発行する', 'n')
          .then(function (ok) { if (ok) issuePdf('発注書', { id: h.id }); });
      }
    }
  }));
  if (!locked) {
    fabs.appendChild(el('button.fab.r', { text: '🗑', title: 'キャンセル', onclick: doCancel }));
    fabs.appendChild(el('button.fab.g', { text: '💾', title: '確定登録', onclick: doSave }));
  }
  main.appendChild(fabs);

  /* ---- 保存（納品確定／入荷確定） ---- */
  function doSave() {
    if (!h.確定日) {
      toast(h.確定日ラベル + 'を入力してください', 'err');
      return;
    }
    confirmModal('確定登録',
      (isReq ? '顧客納品' : '仲卸入荷') + 'を確定登録しますか？\n\n' +
      '　' + h.確定日ラベル + '：' + mdw(h.確定日) + '\n' +
      '　合計：' + yen(h.合計金額),
      '確定登録', 'p'
    ).then(function (ok) {
      if (!ok) return;
      api('order.confirm', {
        type: h.type, id: h.id,
        data: { 概要: sumTa.value, 担当ID: $('#hTanto').value || h.担当ID, 確定日: h.確定日 },
        items: items.map(function (it) {
          return {
            品名: it.品名, 産地: it.産地, メモ: it.メモ, 数量: it.数量, 単位: it.単位,
            金額: it.金額, マスタ区分: it.マスタ区分, マスタID: it.マスタID
          };
        }),
        discounts: discounts.filter(function (d) { return num(d.金額) !== 0; }),
        '合計金額': h.合計金額,
        '合計手入力': manual
      }).then(function () {
        toast((isReq ? '納品' : '入荷') + 'を確定しました');
        return reloadOrders();
      }).then(function () {
        if (isReq) {
          choiceModal('納品書PDF', '納品書PDFを発行しますか？', [
            { label: 'キャンセル', value: null },
            { label: '金額無し', cls: 'n', value: '納品書(金額無)' },
            { label: '金額有り', cls: 'p', value: '納品書(金額有)' }
          ]).then(function (v) {
            if (v) issuePdf(v, { id: h.id }, back); else back();
          });
        } else {
          back();
        }
      });
    });

  function doCancel() {

/* ==========================================================================
 *  PDF 発行（GASでDocs→PDF化 → Base64をダウンロード）
 * ========================================================================== */
/**
 * PDFを発行して、そのまま新しいタブで開く。
 *
 * ★ポイント:
 *   PDFの生成に10〜20秒かかるため、出来上がってから window.open すると
 *   「ユーザー操作から離れた」と判断されてブラウザに塞がれてしまう。
 *   そこで発行ボタンを押したこの瞬間に空のタブだけ先に確保し、
 *   出来上がったらそのタブをPDFに差し替える。
 *   （タブを確保できなかったときは、タップで開けるボタンを出す）
 */
function issuePdf(docType, params, done) {
  var win = reservePdfTab(docType);

  var m = modal({
    title: 'PDF発行', closable: false,
    body: el('div', { style: 'text-align:center;padding:16px' }, [
      el('span.spin.dk'), ' ', docType + ' を作成しています…'
    ])
  });

  api('pdf.issue', Object.assign({ docType: docType }, params)).then(function (d) {
    m.close();
    var url = blobUrlOf(d.base64, d.mimeType || 'application/pdf');
    var opened = false;
    if (win && !win.closed) {
      try { win.location.replace(url); opened = true; } catch (e) { opened = false; }
    }
    // Blob URL はタブが読み終わるまで生かしておく
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { } }, 180000);

    if (opened) {
      toast(docType + ' を発行しました（別のタブで開いています）');
      watchPdfTab(win, url, d.fileName);
      if (done) done();
      return;
    }
    if (win && !win.closed) { try { win.close(); } catch (e) { } }
    showPdfOpenModal(url, d, docType, done);
  }).catch(function () {
    m.close();
    if (win && !win.closed) { try { win.close(); } catch (e) { } }
    if (done) done();
  });
}

/** 「作成中…」と表示した空タブを先に確保する */
function reservePdfTab(docType) {
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (!w) return null;
  try {
    w.document.write(
      '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + esc(docType) + ' を作成しています…</title></head>' +
      '<body style="margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef2f7;color:#1f3864;' +
      'display:flex;align-items:center;justify-content:center;height:100vh"><div style="text-align:center;padding:20px">' +
      '<div style="font-size:18px;font-weight:700">' + esc(docType) + ' を作成しています…</div>' +
      '<div style="margin-top:10px;font-size:13px;color:#66748c;line-height:1.7">' +
      '10〜20秒ほどかかります。<br>このタブを閉じずにお待ちください。</div></div></body></html>'
    );
    w.document.close();
  } catch (e) { /* about:blank のままでも動作に支障はない */ }
  return w;
}

/**
 * PDFを表示せずにダウンロードしてしまう端末では、確保したタブが白紙のまま残る。
 * 3秒後に見て白紙のままなら、その場で開き直せるページを書き込む。
 */
function watchPdfTab(win, url, name) {
  setTimeout(function () {
    var href = '';
    try {
      if (!win || win.closed) return;
      href = String(win.location.href || '');
    } catch (e) { return; }                 // 読めない＝別ページに移れている
    if (href.indexOf('blob:') === 0) return;         // ちゃんと表示できている
    try {
      win.document.open();
      win.document.write(
        '<!doctype html><html lang="ja"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<title>' + esc(name) + '</title></head>' +
        '<body style="margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef2f7;color:#1f3864;' +
        'display:flex;align-items:center;justify-content:center;height:100vh">' +
        '<div style="text-align:center;padding:24px;max-width:420px;width:100%">' +
        '<div style="font-size:17px;font-weight:700;word-break:break-all">' + esc(name) + '</div>' +
        '<div style="margin-top:8px;font-size:13px;color:#66748c;line-height:1.8">' +
        'この端末ではPDFをそのまま表示できないため、ダウンロードしました。<br>下のボタンからも開けます。</div>' +
        '<a href="' + url + '" style="display:block;margin-top:18px;padding:15px;border-radius:10px;' +
        'background:#1f3864;color:#fff;text-decoration:none;font-weight:700">📄 PDFを開く</a>' +
        '<a href="' + url + '" download="' + esc(name) + '" style="display:block;margin-top:10px;padding:13px;' +
        'border-radius:10px;background:#fff;color:#1f3864;text-decoration:none;border:1px solid #c9d3e2">⬇ もう一度保存</a>' +
        '</div></body></html>'
      );
      win.document.close();
    } catch (e) { /* 書き込めない環境では諦める（ファイルは保存済み） */ }
  }, 3000);
}

/** タブを確保できなかったとき（ポップアップブロック）の受け皿 */
function showPdfOpenModal(url, d, docType, done) {
  modal({
    title: docType + ' が出来ました', closable: false,
    body: el('div', null, [
      el('div', { style: 'font-size:14px;margin-bottom:10px', text: d.fileName }),
      el('a.btn.p', {
        href: url, target: '_blank', rel: 'noopener',
        style: 'display:block;text-align:center;padding:14px;font-size:16px;text-decoration:none', text: '📄 PDFを開く'
      }),
      el('a.btn', {
        href: url, download: d.fileName,
        style: 'display:block;text-align:center;padding:12px;margin-top:8px;text-decoration:none', text: '⬇ 端末に保存'
      }),
      el('div.hint', {
        style: 'margin-top:10px',
        text: '別のタブで開けなかったため、ここから開いてください（ブラウザのポップアップがブロックされています）。'
          + (d.driveUrl ? ' PDFはGoogleドライブにも保存されています。' : '')
      })
    ]),
    buttons: [{ label: '閉じる', cls: 'p', fn: function () { if (done) done(); } }]
  });
}

/** Base64 → Blob URL */
function blobUrlOf(b64, mime) {
  var bin = atob(b64);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([buf], { type: mime || 'application/octet-stream' }));
}

function downloadBase64(b64, name, mime) {
  try {
    var url = blobUrlOf(b64, mime);
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
  } catch (e) {
    toast('ダウンロードに失敗しました: ' + e.message, 'err');
  }
}

/* ==========================================================================
 *  PWA（ホーム画面に追加）＋ 通知
 * --------------------------------------------------------------------------
 *  ・Service Worker を登録して、電波が悪くても画面が開くようにする
 *  ・「ホーム画面に追加」できるときは、画面下に案内バーを出す
 *  ・通知の許可 → この端末をプッシュ通知の宛先として登録する
 *  ・新しいバージョンが出たら「更新しますか？」を出す
 * ========================================================================== */
var PWA = {
  reg: null,
  prompt: null,          // beforeinstallprompt のイベント
  updating: false,
  swReady: false,

  /* ---------- 判定 ---------- */
  standalone: function () {
    try {
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
    } catch (e) { }
    return window.navigator.standalone === true;
  },
  isIOS: function () {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  canNotify: function () { return ('Notification' in window) && ('serviceWorker' in navigator); },
  canPush: function () { return PWA.canNotify() && ('PushManager' in window); },
  permission: function () { return ('Notification' in window) ? Notification.permission : 'unsupported'; },

  /* ---------- 起動時 ---------- */
  init: function () {
    if (PWA.standalone()) document.body.classList.add('standalone');

    if ('serviceWorker' in navigator) PWA.registerSW();

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      PWA.prompt = e;
      PWA.showBar();
    });
    window.addEventListener('appinstalled', function () {
      PWA.prompt = null;
      PWA.hideBar();
      LS.set('installed', 1);
      toast('ホーム画面に「濵貞アプリ」を追加しました', 'info', 4000);
      try { gtag('event', 'pwa_install'); } catch (e) { }
    });

    $('#ibGo').addEventListener('click', function () { PWA.install(); });
    $('#ibNo').addEventListener('click', function () {
      LS.set('instHide', Date.now());
      PWA.hideBar();
    });

    // iOS は beforeinstallprompt が来ないので、こちらから案内する
    if (PWA.isIOS() && !PWA.standalone()) setTimeout(PWA.showBar, 2500);

    try { gtag('event', 'app_open', { display_mode: PWA.standalone() ? 'standalone' : 'browser' }); } catch (e) { }
  },

  registerSW: function () {
    navigator.serviceWorker.register('sw.js').then(function (r) {
      PWA.reg = r;
      PWA.swReady = true;
      if (r.waiting && navigator.serviceWorker.controller) PWA.askUpdate(r);
      r.addEventListener('updatefound', function () {
        var nw = r.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) PWA.askUpdate(r);
        });
      });
    }).catch(function () { /* 対応していない環境では何もしない */ });

    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!PWA.updating) return;              // 初回登録では再読込しない
      location.reload();
    });
    navigator.serviceWorker.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'NOTIFICATION_CLICK') {
        // 通知から戻ってきたとき
        if (/a=pending/.test(d.url || '')) { navRoot(); setTimeout(showPending, 400); }
        else navRoot();
      }
    });
  },

  askUpdate: function (r) {
    modal({
      title: 'アプリの更新', closable: false,
      body: el('div', { style: 'font-size:14.5px;line-height:1.8' },
        '新しいバージョンがあります。\nいま更新しますか？（数秒で切り替わります）'),
      buttons: [
        { label: 'あとで' },
        {
          label: '更新する', cls: 'p', fn: function () {
            PWA.updating = true;
            if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
            setTimeout(function () { location.reload(); }, 1500);
          }
        }
      ]
    });
  },

  /* ---------- インストール案内バー ---------- */
  showBar: function () {
    if (PWA.standalone() || LS.get('installed')) return;
    var hid = LS.get('instHide');
    if (hid && Date.now() - hid < 7 * 86400000) return;      // 「×」から1週間は出さない
    if (!PWA.prompt && !PWA.isIOS()) return;
    $('#ibTx').textContent = PWA.isIOS() && !PWA.prompt
      ? '共有ボタン →「ホーム画面に追加」でアプリになります'
      : 'アプリとして開けて、起動も速くなります';
    $('#ibGo').textContent = (PWA.isIOS() && !PWA.prompt) ? 'やり方' : '追加する';
    $('#instbar').classList.remove('hide');
    document.body.classList.add('instbar');       // FABを持ち上げる
  },
  hideBar: function () {
    $('#instbar').classList.add('hide');
    document.body.classList.remove('instbar');
  },

  install: function () {
    if (PWA.prompt) {
      var p = PWA.prompt;
      PWA.prompt = null;
      p.prompt();
      p.userChoice.then(function (c) {
        if (c && c.outcome === 'accepted') { PWA.hideBar(); }
        else { LS.set('instHide', Date.now()); PWA.hideBar(); }
        try { gtag('event', 'pwa_prompt', { outcome: (c && c.outcome) || 'unknown' }); } catch (e) { }
      }).catch(function () { });
      return;
    }
    PWA.howTo();
  },

  /** 手動で追加する手順（iOS／プロンプトが出ない端末） */
  howTo: function () {
    var ios = PWA.isIOS();
    var steps = ios
      ? ['画面下の「共有」ボタン（□に↑）を押す',
        'メニューを下にたどって「ホーム画面に追加」を押す',
        '右上の「追加」を押す']
      : ['ブラウザ右上の「⋮」を押す',

    var body = el('div', null, [
      el('div', { style: 'font-size:14px;line-height:1.8;margin-bottom:10px', text: 'ホーム画面に追加すると、アドレスバーが消えて全画面になり、起動も速くなります。' }),
      el('div', null, steps.map(function (s, i) {

          style: 'display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:14px'
        }, [
          el('span', {
            style: 'flex:0 0 22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;'
              + 'display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700',
            text: String(i + 1)
          }),

    ]);
    modal({ title: '📲 アプリとして使う', body: body, buttons: [{ label: '閉じる', cls: 'p' }] });
  },

  /* ---------- 通知 ---------- */
  askPermission: function () {
    if (!PWA.canNotify()) return Promise.reject(new Error('この端末は通知に対応していません'));
    if (Notification.permission === 'granted') return Promise.resolve('granted');
    if (Notification.permission === 'denied') {
      return Promise.reject(new Error('通知がブロックされています。ブラウザの設定（サイトの設定→通知）で許可してください'));
    }
    return Notification.requestPermission().then(function (p) {
      if (p !== 'granted') throw new Error('通知が許可されませんでした');
      return p;
    });
  },

  /** ローカル通知（サーバを使わないテスト） */
  localNotify: function (title, body) {
    return PWA.askPermission().then(function () {
      if (PWA.reg && PWA.reg.showNotification) {
        return PWA.reg.showNotification(title, {
          body: body, icon: 'img/icon-192.png', badge: 'img/icon-192.png',
          tag: 'hs-local', data: { url: './' }, vibrate: [80, 40, 80]
        });
      }
      new Notification(title, { body: body, icon: 'img/icon-192.png' });
    });
  },

  getSubscription: function () {
    if (!PWA.reg || !PWA.reg.pushManager) return Promise.resolve(null);
    return PWA.reg.pushManager.getSubscription().catch(function () { return null; });
  },

  subscribe: function () {
    if (!PWA.canPush()) return Promise.reject(new Error('この端末はプッシュ通知に対応していません'));
    if (!PWA.reg) return Promise.reject(new Error('準備中です。少し待ってからもう一度お試しください'));
    if (!S.vapidPublicKey) {
      return Promise.reject(new Error('サーバ側の通知キーが未設定です（GASで generateVapidKeys() を実行してください）'));
    }
    return PWA.askPermission().then(function () {
      return PWA.getSubscription();
    }).then(function (cur) {
      if (cur) return cur;
      return PWA.reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToU8(S.vapidPublicKey)
      });
    }).then(function (sub) {
      return api('push.subscribe', { sub: sub.toJSON(), ua: navigator.userAgent }).then(function () {
        try { gtag('event', 'push_subscribe'); } catch (e) { }
        return sub;
      });
    });
  },

  unsubscribe: function () {
    return PWA.getSubscription().then(function (sub) {
      if (!sub) return false;
      var ep = sub.endpoint;
      return sub.unsubscribe().then(function () {
        return api('push.unsubscribe', { endpoint: ep }, true).catch(function () { });
      }).then(function () { return true; });
    });
  },

  /** ショートカット（?a=…）や通知からの起動に対応する */
  handleLaunchAction: function () {
    var m = /[?&]a=([a-z]+)/.exec(location.search || '');
    if (!m) return;
    history.replaceState({ hs: 1 }, '', location.pathname);
    var a = m[1];
    setTimeout(function () {
      if (a === 'fax') navFromMenu('fax');
      else if (a === 'pending') showPending();
      else if (a === 'new') askNewKind(null);
    }, 300);
  }
};

/** base64url の公開鍵を Uint8Array にする（pushManager.subscribe が要求する形） */
function b64ToU8(b64) {
  var pad = '='.repeat((4 - (b64.length % 4)) % 4);
  var s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(s);
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

/* ==========================================================================
 *  Googleカレンダー連携（閲覧のみ）  仕様書 p4
 * ========================================================================== */
var GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
var gcalClient = null;

/**
 * 起動時の復元。
 *
 * ★「起動のたびにGoogleのアカウント選択画面が出る」対策：
 *   Google Identity Services のアクセストークンは1時間で切れ、
 *   リフレッシュトークンをブラウザに保存できない仕組みなので、
 *   起動のたびに取り直す＝そのつど画面が出る、というのが素の挙動。
 *   そこで
 *     ・予定は端末にキャッシュしておき、起動直後はキャッシュだけで描画する
 *     ・起動時の自動認証は既定でオフ（連携画面のスイッチで変えられる）
 *     ・認証するときは前回のアカウント(hint)を渡してアカウント選択を省く
 *   の3点にした。既定では起動時に認証画面は出ない。
 */
function restoreGcal() {
  try {
    var sel = JSON.parse(localStorage.getItem('hs_gcal_sel') || '[]');
    S.gcal.selected = Array.isArray(sel) ? sel : [];
    S.gcal.connected = localStorage.getItem('hs_gcal_on') === '1';
    S.gcal.auto = localStorage.getItem('hs_gcal_auto') === '1';
    S.gcal.account = localStorage.getItem('hs_gcal_acct') || '';
  } catch (e) { }
  if (!S.gcal.connected) return;

  // ①端末キャッシュの予定をそのまま出す（通信も認証もしない）
  var c = LS.get('gcal');
  if (c && c.events) { S.gcal.events = c.events; S.gcal.__lastKey = c.key || ''; }

  // ②「起動時に自動更新」がオンのときだけ、静かに取り直す
  if (S.gcal.auto) {
    requestGcalToken(true).then(function () {
      var r = calcRange();
      return loadGcalEvents(r.from, r.to, true);
    }).then(function (ch) { if (ch) refreshCalendar(); }).catch(function () { });
  }
}

function gcalReady() {
  return !!(window.google && google.accounts && google.accounts.oauth2);
}
function hasGcalToken() {
  return !!(S.gcal.token && S.gcal.expires > Date.now() + 60000);
}
function saveGcalAccount(email) {
  if (!email || email.indexOf('@') < 0) return;
  S.gcal.account = email;
  try { localStorage.setItem('hs_gcal_acct', email); } catch (e) { }
}

function requestGcalToken(silent) {
  return new Promise(function (res, rej) {
    if (hasGcalToken()) { res(S.gcal.token); return; }
    if (!gcalReady()) { rej(new Error('Googleライブラリの読み込み待ちです')); return; }
    if (!gcalClient) {
      gcalClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        scope: GCAL_SCOPE,
        callback: function (r) {
          if (r && r.access_token) {
            S.gcal.token = r.access_token;
            S.gcal.expires = Date.now() + (Number(r.expires_in || 3600) - 60) * 1000;
            S.gcal.connected = true;
            localStorage.setItem('hs_gcal_on', '1');
            if (gcalClient.__res) { gcalClient.__res(r.access_token); gcalClient.__res = null; gcalClient.__rej = null; }
          } else if (gcalClient.__rej) {
            gcalClient.__rej(new Error('認証がキャンセルされました'));
            gcalClient.__res = null; gcalClient.__rej = null;
          }
        },
        error_callback: function (e) {
          if (gcalClient.__rej) { gcalClient.__rej(new Error((e && e.type) || '認証エラー')); gcalClient.__res = null; gcalClient.__rej = null; }
        }
      });
    }
    gcalClient.__res = res; gcalClient.__rej = rej;
    // 前回使ったアカウントを hint で渡すと、アカウント選択画面を飛ばせる
    var o = {};
    if (silent) o.prompt = '';
    if (S.gcal.account) { o.hint = S.gcal.account; o.login_hint = S.gcal.account; }
    try {
      gcalClient.requestAccessToken(o);
    } catch (e) { rej(e); }
  });
}

function gfetch(url) {
  return fetch(url, { headers: { Authorization: 'Bearer ' + S.gcal.token } })
    .then(function (r) {
      if (r.status === 401) { S.gcal.token = ''; throw new Error('再認証が必要です'); }
      if (!r.ok) throw new Error('Googleカレンダー: HTTP ' + r.status);
      return r.json();
    });
}

function loadGcalCalendars() {
  return requestGcalToken(true).catch(function () { return requestGcalToken(false); })
    .then(function () {
      return gfetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250');
    }).then(function (d) {
      S.gcal.calendars = (d.items || []).map(function (c) {
        return { id: c.id, name: c.summary, color: c.backgroundColor, primary: !!c.primary };
      });
      // 主カレンダーのIDはそのアカウントのメールアドレス。次回の hint に使う
      var pri = S.gcal.calendars.filter(function (c) { return c.primary; })[0];
      if (pri) saveGcalAccount(pri.id);
      if (!S.gcal.selected.length) {
        S.gcal.selected = S.gcal.calendars.filter(function (c) { return c.primary; }).map(function (c) { return c.id; });
        saveGcalSel();
      }
      return S.gcal.calendars;
    });
}
function saveGcalSel() { localStorage.setItem('hs_gcal_sel', JSON.stringify(S.gcal.selected)); }

/**
 * 指定期間のイベントを取得。変更があれば true を返す。
 *  ★force を付けない限り、有効なトークンが手元に無ければ何もしない。
 *    （画面遷移のたびに勝手にGoogleの認証画面が出るのを防ぐため）
 */
function loadGcalEvents(from, to, force) {
  if (!S.gcal.connected || !S.gcal.selected.length) return Promise.resolve(false);
  var key = from + '_' + to + '_' + S.gcal.selected.join(',');
  if (S.gcal.__lastKey === key && !force) return Promise.resolve(false);
  if (!hasGcalToken() && !force) return Promise.resolve(false);
  return requestGcalToken(true).then(function () {
    var tmin = new Date(from + 'T00:00:00+09:00').toISOString();
    var tmax = new Date(to + 'T23:59:59+09:00').toISOString();
    var names = {};
    S.gcal.calendars.forEach(function (c) { names[c.id] = c.name; });
    return Promise.all(S.gcal.selected.map(function (cid) {
      var u = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(cid) +
        '/events?singleEvents=true&orderBy=startTime&maxResults=2500' +
        '&timeMin=' + encodeURIComponent(tmin) + '&timeMax=' + encodeURIComponent(tmax) +
        '&timeZone=Asia%2FTokyo';
      return gfetch(u).then(function (d) {
        return (d.items || []).map(function (ev) {
          var allDay = !!(ev.start && ev.start.date);
          return {
            summary: ev.summary || '(無題)',
            start: allDay ? ev.start.date + 'T00:00:00' : (ev.start && ev.start.dateTime) || '',
            end: allDay ? (ev.end && ev.end.date) + 'T00:00:00' : (ev.end && ev.end.dateTime) || '',
            allDay: allDay, calId: cid, calName: names[cid] || cid,
            location: ev.location || '', description: ev.description || '', link: ev.htmlLink || ''
          };
        });
      }).catch(function () { return []; });
    })).then(function (lists) {
      var map = {};
      lists.forEach(function (evs) {
        evs.forEach(function (ev) {
          var d0 = (ev.start || '').slice(0, 10);
          if (!d0) return;
          if (ev.allDay && ev.end) {
            // 終日イベントは終了日の前日まで展開
            var s = parseYmd(d0), e = parseYmd((ev.end || '').slice(0, 10));
            for (var d = s; d < e; d = addDays(d, 1)) {
              (map[ymd(d)] = map[ymd(d)] || []).push(ev);
            }
          } else {
            (map[d0] = map[d0] || []).push(ev);
          }
        });
      });
      Object.keys(map).forEach(function (k) {
        map[k].sort(function (a, b) { return (a.start || '') < (b.start || '') ? -1 : 1; });
      });
      S.gcal.events = map;
      S.gcal.__lastKey = key;
      LS.set('gcal', { key: key, events: map });   // 次の起動は認証なしでこれを描く
      return true;
    });
  }).catch(function () { return false; });
}

function renderGcal() {
  setHeader('Googleカレンダー連携', { back: true });
  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);
  var host = el('div.in');
  sc.appendChild(el('div.sec', null, [el('h3', { text: 'Googleカレンダー連携（閲覧のみ）' }), host]));
  draw();

  function draw() {
    clear(host);
    if (!S.gcal.connected) {
      host.appendChild(el('div.hint', {
        text: 'Googleアカウントで認証すると、カレンダーの予定をこのカレンダー画面に重ねて表示できます（閲覧のみ。将来的に編集も対応予定）。'
      }));
      host.appendChild(el('button.btn.n', {
        style: 'width:100%;margin-top:10px', text: '🔐 Google認証してカレンダーを連携',
        onclick: function () {
          requestGcalToken(false).then(loadGcalCalendars).then(function () {
            toast('Googleカレンダー認証が完了しました');
            draw();
            var r = calcRange();
            S.gcal.__lastKey = '';
            return loadGcalEvents(r.from, r.to, true);
          }).catch(function (e) { toast(e.message || '認証に失敗しました', 'err'); });
        }
      }));
      return;
    }

    /* ---- 更新のしかた（起動時の認証画面をどうするか） ---- */
    host.appendChild(el('div.hint', {
      text: '連携中のアカウント：' + (S.gcal.account || '（次回の更新時に記録されます）')
    }));
    host.appendChild(el('button.btn.n', {
      style: 'width:100%;margin-top:8px', text: '🔄 いま予定を取り直す',
      onclick: function () {
        var r = calcRange();
        S.gcal.__lastKey = '';
        loadGcalEvents(r.from, r.to, true).then(function (ok) {
          toast(ok ? 'Googleカレンダーを更新しました' : '更新できませんでした', ok ? 'info' : 'warn');
          refreshCalendar();
        });
      }
    }));
    var autoCb = el('input', { type: 'checkbox' });
    autoCb.checked = !!S.gcal.auto;
    autoCb.onchange = function () {
      S.gcal.auto = autoCb.checked;
      try { localStorage.setItem('hs_gcal_auto', autoCb.checked ? '1' : '0'); } catch (e) { }
    };
    host.appendChild(el('label.li', { style: 'gap:10px;cursor:pointer;margin-top:8px' }, [
      autoCb,
      el('div.body', null, [el('div.t1', { text: 'アプリ起動時に自動で取り直す' })])
    ]));
    host.appendChild(el('div.hint', {
      style: 'white-space:normal;line-height:1.6',
      text: 'オフ（推奨）＝起動やリロードのたびにGoogleの確認画面が出ません。前回取得した予定をそのまま表示し、'
        + '上の「いま予定を取り直す」を押したときだけ更新します。'
        + 'オンにすると起動時に静かに取り直しますが、Googleのアクセス許可は1時間で切れる仕組みのため、'
        + '確認画面が出ることがあります。'
    }));

    host.appendChild(el('div.hint', {
      style: 'margin-top:12px;border-top:1px solid var(--line);padding-top:10px',
      text: '表示するカレンダーにチェックを入れてください'
    }));
    var listHost = el('div', { style: 'margin-top:8px' });
    host.appendChild(listHost);
    if (!S.gcal.calendars.length) {
      listHost.appendChild(el('div.empty', null, [el('span.spin.dk'), ' 取得中…']));
      loadGcalCalendars().then(function () { draw(); })
        .catch(function (e) { clear(listHost).appendChild(el('div.empty', { text: e.message })); });
    } else {
      S.gcal.calendars.forEach(function (c) {
        var cb = el('input', { type: 'checkbox' });
        cb.checked = S.gcal.selected.indexOf(c.id) >= 0;
        cb.onchange = function () {
          var i = S.gcal.selected.indexOf(c.id);
          if (cb.checked && i < 0) S.gcal.selected.push(c.id);
          if (!cb.checked && i >= 0) S.gcal.selected.splice(i, 1);
          saveGcalSel();
          S.gcal.__lastKey = '';
          var r = calcRange();
          loadGcalEvents(r.from, r.to, true).then(function (ok) { if (ok) refreshCalendar(); });
        };
        listHost.appendChild(el('label.li', { style: 'gap:10px;cursor:pointer' }, [
          cb,
          el('span', { style: 'width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:' + (c.color || '#4285f4') }),
          el('div.body', null, [el('div.t1', { text: c.name }), el('div.t2', { text: c.id })])
        ]));
      });
    }
    host.appendChild(el('button.btn.d', {
      style: 'width:100%;margin-top:12px', text: '🔓 Googleカレンダー連携を解除',
      onclick: function () {
        confirmModal('連携解除', 'Googleカレンダー連携を解除しますか？', '解除する', 'd').then(function (ok) {
          if (!ok) return;
          if (S.gcal.token && gcalReady()) {
            try { google.accounts.oauth2.revoke(S.gcal.token, function () { }); } catch (e) { }
          }
          S.gcal = {
            token: '', expires: 0, calendars: [], selected: [], events: {},
            connected: false, auto: false, account: ''
          };
          localStorage.removeItem('hs_gcal_on');
          localStorage.removeItem('hs_gcal_sel');
          localStorage.removeItem('hs_gcal_auto');
          localStorage.removeItem('hs_gcal_acct');
          LS.del('gcal');
          toast('連携を解除しました', 'info');
          draw();
          refreshCalendar();
        });
      }
    }));
  }
  main.appendChild(el('div.fabrow', null, [el('button.fab.gray', { text: '←', onclick: back })]));
}

/* ==========================================================================
 *  FAX写真 → 自動で依頼／発注の下書きを生成（Gemini）
 * ========================================================================== */
function renderFax() {
  setHeader('FAX写真から自動登録', { back: true });
  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  var type = '依頼';
  var b64 = '', mime = 'image/jpeg';
  var prev = el('img.photo.hide');
  var file = el('input', { type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none' });
  var hintTa = el('input', { type: 'text', placeholder: '補足（例: 保育園の発注書です）' });
  var host = el('div');

  var tabs = el('div.tabs');
  ['依頼', '発注'].forEach(function (k) {
    tabs.appendChild(el('button' + (type === k ? '.on' : ''), {
      text: k === '依頼' ? '顧客からの依頼' : '仲卸へ発注', onclick: function () {
        type = k;
        $$('button', tabs).forEach(function (b, i) { b.classList.toggle('on', (i === 0) === (k === '依頼')); });
      }
    }));
  });

  sc.appendChild(el('div.sec', null, [
    el('h3', { text: 'FAX写真から自動登録（AI読み取り）' }),
    el('div.in', null, [
      el('div.hint', { text: 'FAX原稿や手書きメモを撮影すると、品名・数量・単位・日付を自動で読み取って登録画面の下書きを作ります。読み取り結果は必ず目で確認してください。' }),
      el('div.fld', { style: 'margin-top:10px' }, [el('label', { text: 'どちらとして登録しますか' }), tabs]),
      prev,
      el('div.btnrow', null, [
        el('button.btn.n', { style: 'flex:1', text: '📷 撮影 / 画像を選択', onclick: function () { file.click(); } })
      ]),
      el('div.fld', { style: 'margin-top:10px' }, [el('label', { text: '補足（任意）' }), hintTa]),
      el('button.btn.p', { style: 'width:100%;margin-top:6px', text: '🤖 AIで読み取る', onclick: run }),
      file
    ])
  ]));
  sc.appendChild(host);

  // 撮影／画像選択が終わったら、そのまま自動で読み取りを始める
  file.onchange = function () {
    var f = file.files && file.files[0];
    if (!f) return;
    resizeImage(f, 1600, 0.82).then(function (r) {
      b64 = r.base64; mime = r.mime;
      prev.src = 'data:' + mime + ';base64,' + b64;
      prev.classList.remove('hide');
      toast('画像を読み込みました（' + Math.round(b64.length * 0.75 / 1024) + 'KB）。AIで読み取ります…', 'info');
      run();
    }).catch(function (e) { toast('画像の処理に失敗: ' + e.message, 'err'); });
  };

  function run() {
    if (!b64) { toast('先に画像を撮影／選択してください', 'err'); return; }
    clear(host).appendChild(el('div.sec', null, [
      el('div.empty', null, [el('span.spin.dk'), ' AIが読み取っています…（10〜30秒）'])
    ]));
    api('ocr.fax', { imageBase64: b64, mimeType: mime, type: type, hint: hintTa.value }, true)
      .then(function (d) { showDraft(d); })
      .catch(function (e) { showError(e); });
  }

  /** 読み取り失敗の表示（Gemini混雑時は待って再試行を促す） */
  function showError(e) {
    var busy = /混雑|503|overload/i.test(e.message || '');
    var rate = /レート|429/.test(e.message || '');
    clear(host);
    var box = el('div.in');
    box.appendChild(el('div.wbox' + (busy || rate ? '' : '.other'), null, [
      el('div.wt', { text: busy ? '⚠ Gemini側が混み合っています' : (rate ? '⚠ 無料枠の上限に達しました' : '⚠ 読み取りに失敗しました') }),
      el('div.wl', { style: 'white-space:pre-wrap', text: e.message || '' })
    ]));
    if (busy || rate) {
      box.appendChild(el('div.hint', {
        text: 'Geminiの無料枠は時間帯によって混み合います。1〜2分待ってから下のボタンでもう一度お試しください。'
      }));
    }
    box.appendChild(el('button.btn.p', {
      style: 'width:100%;margin-top:8px', text: '🔁 もう一度読み取る', onclick: run
    }));
    box.appendChild(el('button.btn', {
      style: 'width:100%;margin-top:6px', text: '手入力で登録画面へ進む',
      onclick: function () { openOrderForm(type, { 日付: todayYmd() }); }
    }));
    host.appendChild(el('div.sec', null, [el('h3', { text: '読み取り結果' }), box]));
  }

  function showDraft(d) {
    clear(host);
    var dr = d.draft;
    var box = el('div.in');
    box.appendChild(el('div.hint', {
      text: 'モデル: ' + d.model + '　信頼度: ' + (d.confidence === null ? '—' : Math.round(d.confidence * 100) + '%') +
        (d.docType ? '　種別判定: ' + d.docType : '')
    }));
    if (d.confidence !== null && d.confidence < 0.6) {
      box.appendChild(el('div.wbox', null, [
        el('div.wt', { text: '⚠ 読み取り精度が低い可能性があります' }),
        el('div.wl', { text: '明るい場所で、伝票全体が入るように正面から撮り直すと精度が上がります。' })
      ]));
    }
    // 取引先候補
    var pSel = el('select');
    pSel.appendChild(el('option', { value: '', text: '（選択してください）' }));
    (dr.取引先候補 || []).forEach(function (c) {
      pSel.appendChild(el('option', { value: c.id, text: c.name + '（一致度 ' + Math.round(c.score * 100) + '%）' }));
    });
    var listAll = (dr.type === '発注') ? S.brokers : S.customers;
    var idc = (dr.type === '発注') ? '仲卸ID' : '顧客ID', nc = (dr.type === '発注') ? '仲卸名' : '顧客名';
    listAll.forEach(function (r) {
      if ((dr.取引先候補 || []).some(function (c) { return String(c.id) === String(r[idc]); })) return;
      pSel.appendChild(el('option', { value: String(r[idc]), text: r[nc] }));
    });
    pSel.value = dr.取引先ID || '';
    box.appendChild(el('div.fld', null, [
      el('label', { text: (dr.type === '発注' ? '仲卸' : '顧客') + '（読み取り: ' + (dr.取引先名 || '—') + '）' }), pSel
    ]));
    box.appendChild(el('div.row', null, [
      roFld('日付', mdw(dr.日付)),
      roFld(dr.type === '発注' ? '市場開場日' : '希望納品日', mdw(dr.市場開場日 || dr.希望納品日) || '—'),
      roFld('使用日', mdw(dr.使用日) || '—')
    ]));

    var t = el('table.tbl');
    t.appendChild(el('tr', null, [
      el('th', { text: '読取' }), el('th', { text: 'マスタ候補' }),
      el('th', { style: 'width:56px', text: '数量' }), el('th', { style: 'width:56px', text: '単位' })
    ]));
    // ★マスタ候補には産地を出さない（品名だけ）。
    //   依頼・発注の時点で産地の指定は無く、産地は入荷した時点で確定するため。
    dr.items.forEach(function (it) {
      var cs = el('select');
      cs.appendChild(el('option', { value: '', text: '（手入力のまま）' }));
      (it.候補 || []).forEach(function (c, ci) {
        cs.appendChild(el('option', {
          value: String(ci),
          text: c.品名 + ' ' + Math.round(c.score * 100) + '%'
        }));
      });
      if (it.候補 && it.候補.length) cs.value = '0';
      cs.onchange = function () {
        var c = it.候補[Number(cs.value)];
        if (c) { it.品名 = c.品名; it.マスタ区分 = c.種別; it.分類 = c.分類; it.マスタID = c.マスタID; }
        it.産地 = '';
      };
      if (it.候補 && it.候補.length) {
        var c0 = it.候補[0];
        it.品名 = c0.品名; it.マスタ区分 = c0.種別; it.分類 = c0.分類; it.マスタID = c0.マスタID;
      }
      it.産地 = '';
      t.appendChild(el('tr', null, [
        el('td', { text: it.品名 }),
        el('td', null, [cs]),
        el('td.n', { text: qty(it.数量) }),
        el('td', { text: it.単位 })
      ]));
    });
    box.appendChild(el('div.fld', null, [el('label', { text: '品名（' + dr.items.length + '件）' }), t]));

    if (d.warnings && d.warnings.length) {
      var wb = el('div.wbox.other');
      wb.appendChild(el('div.wt', { text: '⚠ 同じ品名の注文が既に登録されています（' + d.warnings.length + '件）' }));
      wb.appendChild(el('div.wl', {
        text: d.warnings.slice(0, 6).map(function (w) {
          return w.種別 + ' ' + w.品名 + ' ' + qty(w.数量) + (w.単位 || '') + '／' + w.取引先名 + '／' + w.担当名 + '（' + md(w.使用日 || w.日付) + '）';
        }).join('\n')
      }));
      box.appendChild(wb);
    }

    box.appendChild(el('button.btn.p', {
      style: 'width:100%;margin-top:8px', text: '▶ この内容で登録画面へ', 'data-t': 'toForm',
      onclick: function () {
        dr.取引先ID = pSel.value;
        // 台帳に無い取引先だったときは、その場で新規登録できるようにする
        if (!dr.取引先ID) {
          askRegisterPartner(dr.type, dr.取引先名).then(function (id) {
            if (id === null) return;                 // 「戻る」
            if (id) { dr.取引先ID = String(id); }
            go();
          });
          return;
        }
        go();
      }
    }));

    function go() {
      openOrderForm(dr.type, {
        日付: dr.日付, 連絡形態: dr.連絡形態, 取引先ID: dr.取引先ID, 概要: dr.概要,
        希望納品日: dr.希望納品日, 使用日: dr.使用日,
        市場開場日: dr.市場開場日, 補足事項: dr.補足事項,
        items: dr.items.map(function (i) {
          return {
            マスタ区分: i.マスタ区分 || '青果', 分類: i.分類 || '', 品名: i.品名,
            産地: i.産地 || '', メモ: i.メモ || '', 数量: i.数量, 単位: i.単位 || 'kg',
            マスタID: i.マスタID || ''
          };
        })
      });
    }
    host.appendChild(el('div.sec', null, [el('h3', { text: '読み取り結果（確認・修正してください）' }), box]));
  }

  function roFld(label, val) {
    return el('div.fld', null, [el('label', { text: label }), el('div.ro', { text: val })]);
  }
  main.appendChild(el('div.fabrow', null, [el('button.fab.gray', { text: '←', onclick: back })]));
}

/**
 * FAXから読み取った取引先が台帳に無かったときの新規登録。
 *   戻り値: 新しいID（登録した） / ''（登録せずに進む） / null（戻る）
 *   IDはスプレッドシートの最大値＋1で自動採番されます（GAS の Repo.nextNumId）。
 */
function askRegisterPartner(type, readName) {
  var kind = (type === '発注') ? '仲卸' : '顧客';
  var nameCol = (kind === '仲卸') ? '仲卸名' : '顧客名';
  return new Promise(function (res) {
    var nameIn = autoScroll(el('input', {
      type: 'text', value: readName || '', 'data-t': 'newPartnerName',
      placeholder: kind + '名',
      style: 'width:100%;padding:12px;border:1px solid var(--navy);border-radius:8px;font-size:16px'
    }));
    var msg = el('div.hint', { style: 'margin-top:8px;color:var(--err)' });
    modal({
      title: kind + '登録', closable: false,
      body: el('div', null, [
        el('div', {
          style: 'font-size:14px;line-height:1.8;margin-bottom:10px;white-space:pre-wrap',
          text: '読み取った' + kind + '「' + (readName || '（読み取れませんでした）') + '」は'
            + kind + '台帳にありません。\n新しく登録しますか？'
        }),
        nameIn,
        el('div.hint', {
          style: 'margin-top:6px',
          text: kind + 'IDは自動で採番されます。担当は自分になります。'
            + '住所・電話番号などは、あとから' + kind + '台帳で追記できます。'
        }),
        msg
      ]),
      buttons: [
        { label: '戻る', fn: function () { res(null); } },
        { label: '登録せずに進む', fn: function () { res(''); } },
        {
          label: '登録する', cls: 'p', keep: true, fn: function (mm) {
            var nm = String(nameIn.value || '').trim();
            if (!nm) { msg.textContent = kind + '名を入力してください'; return; }
            msg.style.color = 'var(--sub)';
            msg.textContent = '登録しています…';
            var data = {};
            data[nameCol] = nm;
            api('partner.save', { kind: kind, data: data }, true).then(function (d) {
              return api('partner.list', { kind: kind }, true).then(function (l) {
                if (kind === '仲卸') S.brokers = l.list; else S.customers = l.list;
                var cached = LS.get('boot');
                if (cached) {                       // 端末キャッシュにも反映しておく
                  cached.customers = S.customers;
                  cached.brokers = S.brokers;
                  LS.set('boot', cached);
                }
                mm.close();
                toast(kind + '「' + nm + '」を登録しました（' + kind + 'ID: ' + d.id + '）');
                res(String(d.id));
              });
            }).catch(function (e) {
              msg.style.color = 'var(--err)';
              msg.textContent = '登録に失敗しました: ' + (e.message || '通信エラー');
            });
          }
        }
      ]
    });
  });
}

/** 画像を縮小して Base64 にする（通信量とAPI負荷を抑える） */
function resizeImage(file, maxSide, quality) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var sc = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.round(w * sc), ch = Math.round(h * sc);
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var url = cv.toDataURL('image/jpeg', quality || 0.82);
        res({ base64: url.split(',')[1], mime: 'image/jpeg', w: cw, h: ch });
      };
      img.onerror = function () { rej(new Error('画像を読み込めません')); };
      img.src = fr.result;
    };
    fr.onerror = function () { rej(new Error('ファイルを読み込めません')); };
    fr.readAsDataURL(file);
  });
}

/* ==========================================================================

function boot() {
  FS.init();

    b.addEventListener('click', function () {
      var n = b.getAttribute('data-nav');
      closeDrawer();

        case 'payment': navFromMenu('billing', { mode: 'payment' }); break;
        case 'gcal': navFromMenu('gcal'); break;
        case 'fax': navFromMenu('fax'); break;
        case 'log': navFromMenu('log'); break;
        case 'notify': navFromMenu('notify'); break;
        case 'fullscreen': toggleFullscreen(); break;
      }
    });
  });
  $('#btnBack').addEventListener('click', back);
  $('#btnView').addEventListener('click', function () {
    S.view = (S.view === 'calm') ? 'cal2' : 'calm';
    localStorage.setItem('hs_view', S.view);
    renderCalendar();
    ensureVisibleData();
  });
  $('#lgBtn').addEventListener('click', doLogin);
  $('#lgPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('#lgTanto').addEventListener('change', function () { $('#lgPw').focus(); });
  $('#lgReload').addEventListener('click', function () {
    S.tantoLoaded = false;
    $('#lgMsg').textContent = '';
    loadTantoOptions();
  });
  $('#lgDiag').addEventListener('click', diagnoseConnection);

  // POSTが通らない端末では前回の判定（JSONP）を引き継ぐ
  try {
    if (localStorage.getItem('hs_transport') === 'jsonp') CONFIG.TRANSPORT = 'jsonp';
  } catch (e) { }

  // 画面リサイズ・回転でカレンダーを組み直す
  var rzT = null;
  window.addEventListener('resize', function () {
    if (curView() !== 'cal') return;
    clearTimeout(rzT);
    rzT = setTimeout(refreshCalendar, 150);
  });

  // Android の戻るボタン／ブラウザ戻る（アプリ内の「戻る」として扱う）
  history.replaceState({ hs: 0 }, '');
  history.pushState({ hs: 1 }, '');
  window.addEventListener('popstate', function () {
    history.pushState({ hs: 1 }, '');
    if ($('#modals').firstChild) {
      $('#modals').removeChild($('#modals').lastChild);
      return;
    }
    if (S.nav.length > 1) back();
  });

  S.view = localStorage.getItem('hs_view') || 'cal2';
  S.anchor = new Date();
  S.nav = ['cal']; S.navP = [{}];

  if (/★ここにデプロイIDを貼る★/.test(CONFIG.API_URL)) {
    modal({
      title: '設定が未完了です', closable: false,
      body: el('div', { style: 'font-size:14px;line-height:1.8' }, [
        'index.html の先頭にある ',
        el('code', { text: 'CONFIG.API_URL' }),
        ' に、GASウェブアプリのデプロイURL（末尾 /exec）を設定してください。'
      ])
    });
    return;
  }

  var tk = sessionStorage.getItem('hs_token');
  if (tk) {
    S.token = tk;
    hideLogin();
    API.call('me.get', {}).then(function (d) {
      S.me = d.me;
      return bootstrap();
    }).catch(function () { showLogin(); });
  } else {
    showLogin();
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>

<!-- ==========================================================================
     読み込み失敗の保険（別のスクリプトブロックにしてあります）
       上のスクリプトは1つの塊なので、CONFIG の引用符を1つ閉じ忘れただけでも
       「文法エラー → 全部動かない → ログイン画面のまま無反応」になります。
       それが起きたことを画面で分かるようにするためのブロックです。
     ========================================================================== -->
<script>
(function () {
  setTimeout(function () {
    if (typeof window.boot === 'function') return;      // 正常に読み込めていれば何もしない
    var box = document.querySelector('#vLogin .loginbox');
    if (!box || document.getElementById('lgFatal')) return;
    var q = String.fromCharCode(39);                    // シングルクォート
    var d = document.createElement('div');
    d.id = 'lgFatal';
    d.style.cssText = 'margin-top:12px;padding:10px 12px;border:2px solid #c62828;border-radius:8px;'
      + 'color:#c62828;font-size:12.5px;line-height:1.8;text-align:left;background:#fff5f5';
    d.textContent = '⚠ アプリを読み込めませんでした（index.html の JavaScript に文法エラーがあります）。'
      + 'よくある原因は、CONFIG の API_URL を貼り替えたときに、'
      + '終わりの引用符 ' + q + ' や 行末のカンマ , を消してしまうことです。'
      + 'ブラウザのメニュー →「PC版サイト」→ F12 → Console に、何行目かが表示されます。';
    box.appendChild(d);
  }, 800);
})();
</script>
