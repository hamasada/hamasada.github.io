<style>
/* ==========================================================================
   濵貞アプリ  ver1.0   -   GitHub Pages 用 単一ファイルフロントエンド
   色: 顧客依頼=黄土色 #b8860b / 仲卸発注=紺色 #1f3864
   ========================================================================== */
:root{
  --navy:#1f3864; --navy-d:#152744; --ocher:#b8860b; --ocher-d:#8f6a09;
  --bg:#eef2f7; --card:#fff; --line:#dde3ec; --txt:#1a2334; --sub:#6b7787;
  --sun:#fdeaea; --sat:#eaf1fd; --sun-t:#d2413c; --sat-t:#2f6fd0;
  --ok:#27884a; --warn:#e08600; --err:#c62828; --today:#1f6fe0;
  --h:52px; --fab:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--today);text-decoration:none}
.hide{display:none !important}

/* ---------- App shell ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.hdr{
  height:var(--h); min-height:var(--h); background:var(--navy); color:#fff;
  display:flex; align-items:center; gap:8px; padding:0 10px;
  box-shadow:0 1px 4px rgba(0,0,0,.25); position:relative; z-index:20;
}
.hdr.req{background:var(--ocher)}
.hdr.ord{background:var(--navy)}
.hdr h1{font-size:18.5px;font-weight:700;margin:0;flex:0 0 auto;letter-spacing:.02em}
.hdr .sp{flex:1}
.hdr button{
  color:#fff;background:rgba(255,255,255,.16);border-radius:6px;
  padding:7px 11px;font-size:14px;font-weight:700;white-space:nowrap;
}
.hdr button:active{background:rgba(255,255,255,.32)}
.hdr .ico{font-size:21px;padding:5px 10px;line-height:1}
.hdr select{
  background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;
  padding:5px 6px;font-size:13px;max-width:38vw;
}
.hdr select option{color:#000}
main{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(104px + var(--safe-b))}

/* ---------- Toast (3秒で消える) ---------- */
#toast{
  position:fixed;left:50%;top:calc(var(--h) + 6px);transform:translateX(-50%);
  z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;
  pointer-events:none;width:92%;max-width:520px;
}
.toast{
  background:var(--ok);color:#fff;padding:7px 16px;border-radius:16px;
  font-size:13.5px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25);
  animation:tin .18s ease-out; text-align:center; white-space:pre-line; line-height:1.5;
}
.toast.err{background:var(--err)} .toast.warn{background:var(--warn)} .toast.info{background:#455a75}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- Login ---------- */
#vLogin{
  position:absolute;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:rgba(20,28,44,.72);backdrop-filter:blur(2px);padding:20px;
}
.loginbox{background:#fff;border-radius:12px;padding:22px 20px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.loginbox h2{margin:0 0 4px;text-align:center;font-size:19px;color:var(--navy)}
.loginbox p{margin:0 0 16px;text-align:center;font-size:12px;color:var(--sub)}
.loginbox select,.loginbox input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff;
}
.loginbox button{
  width:100%;padding:12px;background:var(--ok);color:#fff;border-radius:8px;font-weight:700;font-size:16px;
}
.loginbox button:disabled{opacity:.5}
.syncbar{
  position:absolute;top:calc(var(--h) + 8px);left:50%;transform:translateX(-50%);
  background:#c8a13a;color:#fff;padding:5px 14px;border-radius:14px;font-size:12px;font-weight:700;z-index:310;
}

/* ---------- Calendar ---------- */
.calwrap{flex:1;overflow:hidden;position:relative;touch-action:none;overscroll-behavior:contain}
.caltrack{display:flex;width:300%;height:100%;transition:transform .26s cubic-bezier(.25,.8,.3,1)}
.caltrack.nt{transition:none}
.calpane{width:33.3333%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.calbar{
  display:flex;align-items:center;justify-content:space-between;background:#dfe6f0;
  padding:4px 6px;font-weight:700;font-size:16.5px;color:var(--navy);border-bottom:1px solid var(--line);
}
.calbar button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--navy)}

/* 2週表示: 縦に曜日、横に2週 */
.g2{flex:1;min-height:0;display:grid;grid-template-columns:26px 1fr 1fr;
     grid-template-rows:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;overflow:hidden}
.g2 .dw{background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--sub);writing-mode:vertical-rl}
/* 月表示 */
.gm{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.gmhead{display:grid;grid-template-columns:repeat(7,1fr);background:#eef2f7;border-bottom:1px solid var(--line)}
.gmhead div{text-align:center;font-size:13.5px;font-weight:700;color:var(--sub);padding:3px 0}
.gmhead div:nth-child(6){color:var(--sat-t)} .gmhead div:nth-child(7){color:var(--sun-t)}
.gmbody{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);
        grid-auto-rows:minmax(0,1fr);background:var(--line);gap:1px;overflow:hidden}

.cell{background:#fff;padding:2px 3px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative;touch-action:none}
.cell.sun{background:var(--sun)} .cell.sat{background:var(--sat)}
.cell.hol{background:var(--sun)} .cell.off{background:var(--sun)}
.cell.out{background:#f4f6f9;opacity:.5}
.cell.sel{box-shadow:inset 0 0 0 2px var(--today);z-index:2}
.cell.today .dn{background:var(--today);color:#fff;border-radius:5px;padding:0 4px}
.crow{display:flex;align-items:baseline;justify-content:space-between;gap:2px;line-height:1.1}
.dn{font-weight:700;color:var(--navy);white-space:nowrap}
.cell.sun .dn,.cell.hol .dn{color:var(--sun-t)} .cell.sat .dn{color:var(--sat-t)}
.rk{color:#7d8796;white-space:nowrap;font-weight:600}
.hn{color:var(--sun-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hn.inl{flex:1 1 auto;min-width:0;margin-left:6px}
.ev{color:#245fbe;background:#e6effc;border-radius:3px;padding:0 3px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;font-weight:600}
.chips{display:flex;flex-wrap:wrap;padding-top:2px;flex:0 0 auto}
.evs{flex:1 1 auto;min-height:0;overflow:hidden;padding-top:1px}
.chip{
  border-radius:50%;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;
}

/* --- 2週表示はセルが広いので最大サイズ --- */
.g2 .dn{font-size:21px}
.g2 .rk{font-size:13.5px}
.g2 .hn{font-size:13px}
.g2 .ev{font-size:13.5px}
.g2 .chips{gap:4px}
.g2 .chip{width:28px;height:28px;font-size:16.5px}

/* --- 月表示はセルが狭いので控えめに --- */
.gmbody .dn{font-size:18px}
.gmbody .rk{font-size:11px}
.gmbody .hn{font-size:10.5px}
.gmbody .ev{font-size:10.5px;padding:0 2px;margin-top:1px}
.gmbody .chips{gap:2px}
.gmbody .chip{width:20px;height:20px;font-size:12.5px}
.gmbody .cell.out .rk{display:none}          /* 前後月は六曜を省いて日付を大きく見せる */
.chip.req{background:var(--ocher)} .chip.ord{background:var(--navy)}
.chip.mkt{background:#3d9a5f} .chip.mkt2{background:#7ab894}
.chip.off{background:#a0a8b4}
.chip.est{opacity:.55}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:14px;bottom:calc(16px + var(--safe-b));width:var(--fab);height:var(--fab);
  border-radius:50%;background:var(--today);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:30;overflow:hidden;
}
.fab.l{left:14px;right:auto;background:#7e57c2;font-size:22px}
.fab.g{background:var(--ok)} .fab.r{background:#c62828} .fab.gray{background:#78849b}
.fab.s2{right:82px} .fab.s3{right:150px}
.fab:active{transform:scale(.94)}
/* カレンダー画面のFABは日曜の行に重なるので、小さめ＋半透明にして下の内容が見えるようにする */
.calfab{width:48px;height:48px;font-size:24px;opacity:.9;bottom:calc(10px + var(--safe-b))}
.calfab.l{left:10px;font-size:19px}
.calfab.s2{right:72px}                       /* ＋ の左隣（14+48+10） */
.calfab.cam{background:#00838f;font-size:21px}
.calfab:active{opacity:1}
.fabrow{position:absolute;right:14px;bottom:calc(16px + var(--safe-b));display:flex;gap:12px;z-index:30}
.fabrow .fab{position:static;right:auto;bottom:auto}

/* ---------- ホーム画面に追加の案内バー ---------- */
#instbar{
  position:absolute;left:8px;right:8px;bottom:calc(8px + var(--safe-b));z-index:180;
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
  background:var(--navy);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.3);
  animation:ibin .25s ease-out;
}
@keyframes ibin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#instbar .ib-ico{font-size:24px;flex:0 0 auto}
#instbar .ib-body{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
#instbar .ib-body b{font-size:14px}
#instbar .ib-body span{font-size:11.5px;opacity:.85}
#instbar .ib-go{
  flex:0 0 auto;background:#fff;color:var(--navy);font-weight:700;font-size:13.5px;
  padding:9px 14px;border-radius:9px;
}
#instbar .ib-no{flex:0 0 auto;color:#fff;opacity:.7;font-size:15px;padding:6px 4px}
body.standalone #instbar{display:none!important}
/* 案内バーが出ている間は、下のボタンが隠れないように持ち上げる */
body.instbar .calfab{bottom:calc(80px + var(--safe-b))}
body.instbar .fabrow{bottom:calc(86px + var(--safe-b))}

/* PDFボタンなど、FAB内に画像を入れるとき */
/* FAB内の画像は、読込み前でも縮まないように実寸(calc)で指定する */
.fab img{
  width:calc(var(--fab) * .90);height:calc(var(--fab) * .90);
  flex:0 0 auto;object-fit:contain;display:block;pointer-events:none;
}
.calfab img{width:44px;height:44px}

/* ---------- Drawer ---------- */
#drawer{position:absolute;inset:0;z-index:200;display:none}
#drawer.on{display:block}
#drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#drawer .panel{
  position:absolute;top:0;right:0;bottom:0;width:74%;max-width:300px;background:#fff;
  box-shadow:-3px 0 14px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease-out;
  display:flex;flex-direction:column;
}
#drawer.on .panel{transform:none}
#drawer h3{margin:0;padding:16px 16px 10px;font-size:16px;border-bottom:2px solid var(--navy);color:var(--navy)}
#drawer .mi{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left;
}
#drawer .mi:active{background:#eef2f7}
#drawer .mi .em{font-size:18px;width:24px;text-align:center}
#drawer .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}

/* ---------- Sheets / modal ---------- */
/* ログイン画面(#vLogin z-index:300)の上にも出せるようにしておく（接続診断など） */
.modal{position:fixed;inset:0;z-index:350;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.mbox{
  position:relative;background:#fff;border-radius:12px;width:100%;max-width:440px;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.35);animation:min .16s ease-out;
}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy)}
.mhd .sp{flex:1}
.mhd button{background:#eef2f7;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.mbd{padding:14px;overflow-y:auto;flex:1}
.mft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mft button{padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;background:#eef2f7;color:var(--txt)}
.mft button.p{background:var(--ok);color:#fff} .mft button.d{background:var(--err);color:#fff}
.mft button.n{background:var(--navy);color:#fff} .mft button.w{background:var(--warn);color:#fff}

/* ---------- Cards / forms ---------- */
.sec{background:#fff;margin:8px;border-radius:10px;box-shadow:0 1px 3px rgba(20,40,80,.09);overflow:hidden}
.sec>h3{margin:0;padding:9px 12px;font-size:14px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line);background:#f7f9fc}
.sec>.in{padding:10px 11px}
.sec>.in.tight{padding:8px 11px}
.fld{margin-bottom:8px}
.fld:last-child{margin-bottom:0}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:3px}
.fld>label .rq{color:var(--err)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.fld textarea{min-height:52px;resize:vertical}
.fld input:disabled,.fld textarea:disabled{background:#f4f6f9;color:#61708a}
.fld input::placeholder,.fld textarea::placeholder{color:#9aa5b4}
/* 欄内に項目名を入れたボタン（日付など） */
.fldbtn{width:100%;text-align:left;padding:9px 10px !important;font-weight:600}
.ro{padding:9px 11px;background:#f4f6f9;border:1px solid var(--line);border-radius:8px;min-height:40px;font-size:15px;white-space:pre-wrap;word-break:break-all}
/* ラベル＋値の1行表示（テキスト欄より縦に詰まる） */
.kv{display:flex;align-items:baseline;gap:6px;padding:3px 0;min-width:0}
.kv>b{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.kv>span{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv.w>span{white-space:normal}
.kvrow{display:flex;gap:12px}
.kvrow>.kv{flex:1 1 0;min-width:0}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.row.a{align-items:flex-end}
.w90{flex:0 0 96px} .w110{flex:0 0 112px} .w70{flex:0 0 74px}
.w3{flex:0 0 33%}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;font-size:14px;background:#eef2f7;color:var(--txt);white-space:nowrap}
.btn.p{background:var(--ok);color:#fff} .btn.n{background:var(--navy);color:#fff}
.btn.o{background:var(--ocher);color:#fff} .btn.d{background:var(--err);color:#fff}
.btn.s{padding:6px 10px;font-size:12px}
.btn.gh{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.on.sk{background:var(--ok);border-color:var(--ok)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}

/* ---------- List ---------- */
.list{background:#fff;margin:8px;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.09)}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff}
.li:last-child{border-bottom:none}
.li:active{background:#f2f6fb}
.li .body{flex:1;min-width:0}
.li .t1{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:4px;flex:0 0 auto}
.li .acts a,.li .acts button{
  width:32px;height:32px;border-radius:6px;background:#f0f3f8;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;color:#fff;vertical-align:middle}
.badge.req{background:var(--ocher)} .badge.ord{background:var(--navy)}
.badge.g{background:var(--ok)} .badge.x{background:#98a2b2} .badge.w{background:var(--warn)}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- 品名情報 ---------- */
.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fbfcfe}
.item .ih{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.item .ih .no{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:4px;padding:1px 6px}
.item .ih .sp{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:5px}
.tabs button{flex:1;padding:6px;border-radius:7px;background:#eef2f7;font-weight:700;font-size:13.5px;color:var(--sub)}
.tabs button.on{background:var(--navy);color:#fff}
.cats{display:flex;gap:4px;margin-bottom:5px;overflow-x:auto;padding-bottom:2px}

        e.code = 'NOT_PUBLIC';
      } else if (/承認|authoriz/i.test(s)) {
        e = new Error('GASの承認が必要です。GASエディタで setup() を1回実行して承認し直してください');
        e.code = 'NEED_AUTH';
      } else {
        e = new Error('GASからHTMLが返りました。デプロイURL（末尾 /exec）と公開設定を確認してください');
        e.code = 'HTML_RESPONSE';
      }
      return e;
    }
    e = new Error('応答を解釈できません: ' + s.slice(0, 80));
    e.code = 'BAD_RESPONSE';
    return e;
  }

  function jsonp(action, payload) {
    return new Promise(function (res, rej) {
      var cb = '__hcb' + (++seq) + '_' + Date.now();
      var sc = document.createElement('script');
      var to = setTimeout(function () { cleanup(); rej(new Error('タイムアウト')); }, 60000);
      function cleanup() {
        clearTimeout(to);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (sc.parentNode) sc.parentNode.removeChild(sc);
      }
      window[cb] = function (d) { cleanup(); res(d); };
      sc.onerror = function () { cleanup(); rej(new Error('通信に失敗しました')); };
      sc.src = CONFIG.API_URL + '?action=' + encodeURIComponent(action) +
        '&token=' + encodeURIComponent(S.token || '') +
        '&callback=' + cb +
        '&payload=' + encodeURIComponent(JSON.stringify(payload || {}));
      document.body.appendChild(sc);
    });
  }

  /** 呼び出し本体。ok:false は例外にして呼び出し側で catch させる */
  function call(action, payload, opt) {
    opt = opt || {};
    var p = (CONFIG.TRANSPORT === 'jsonp') ? jsonp(action, payload) : post(action, payload);
    return p.then(function (r) {
      if (!r) throw new Error('空の応答');
      if (!r.ok) {
        var e = new Error(r.error || 'エラー');
        e.code = r.code;
        throw e;
      }
      return r.data;
    }).catch(function (err) {
      if (CONFIG.TRANSPORT === 'post' && !opt._retried && /Failed to fetch|NetworkError|CORS/i.test(err.message || '')) {
        // POST が通らない環境では JSONP に自動フォールバック。
        // ただし JSONP で実際に通ったときだけ端末に覚えさせる
        //（一時的な通信断でJSONPに固定されてしまわないようにするため）
        CONFIG.TRANSPORT = 'jsonp';
        return call(action, payload, { _retried: true }).then(function (d) {
          try { localStorage.setItem('hs_transport', 'jsonp'); } catch (e2) { }
          return d;
        }, function (e2) {
          CONFIG.TRANSPORT = 'post';
          throw e2;
        });
      }
      if (err.code === 'UNAUTHORIZED') {
        S.token = ''; sessionStorage.removeItem('hs_token');
        showLogin('セッションが切れました。再ログインしてください');
      }
      throw err;
    });
  }

  return { call: call };
})();

/** ローディング付き API 呼び出し */
function api(action, payload, silentErr) {
  return API.call(action, payload).catch(function (e) {
    if (!silentErr) toast(e.message || '通信エラー', 'err', 4200);
    throw e;
  });
}

/* ==========================================================================
 *  接続診断
 * --------------------------------------------------------------------------
 *  「担当者が読み込めない」ときの原因はほぼ次のどれかなので、
 *  GET(JSONP) と POST を別々に叩いて切り分け、直し方まで表示する。
 *    ①API_URL が違う（/dev のまま・古いデプロイ）
 *    ②GASの「アクセスできるユーザー」が『全員』になっていない
 *    ③GAS側で例外（スクリプトプロパティ未設定など）
 *    ④POSTだけ通らない環境（この場合はJSONPに自動で切り替える）
 * ========================================================================== */
function pingGet(ms) {
  return new Promise(function (res) {
    var cb = '__hping' + Date.now();
    var sc = document.createElement('script');
    var done = false;
    var to = setTimeout(function () { finish({ ok: false, reason: 'タイムアウト' }); }, ms || 20000);
    function finish(r) {
      if (done) return;
      done = true;
      clearTimeout(to);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (sc.parentNode) sc.parentNode.removeChild(sc);
      res(r);
    }
    window[cb] = function (d) { finish({ ok: true, data: d }); };
    sc.onerror = function () { finish({ ok: false, reason: 'スクリプトとして読めない応答' }); };
    sc.src = CONFIG.API_URL + '?action=tantoList&callback=' + cb + '&payload=%7B%7D';
    document.body.appendChild(sc);
  });
}
function pingPost() {
  return fetch(CONFIG.API_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'tantoList', token: '', payload: {} })
  }).then(function (r) {
    return r.text().then(function (t) {
      return { ok: true, status: r.status, finalUrl: r.url || '', body: t };
    });
  }).catch(function (e) { return { ok: false, message: e.message || '通信に失敗' }; });
}

function diagnoseConnection() {
  var host = el('div', { style: 'font-size:13px;line-height:1.7' }, [
    el('div', null, [el('span.spin.dk'), ' 診断しています…（最大20秒）'])
  ]);
  var m = modal({ title: '接続を診断', body: host, closable: true });

  var url = String(CONFIG.API_URL || '');
  var isDev = /\/dev\/?$/.test(url);
  var urlOk = /\/exec$/.test(url);                       // 末尾が /exec なら形としてはOK
  var gasHost = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url);

  Promise.all([pingPost(), pingGet()]).then(function (r) {
    var post = r[0], get = r[1];
    var lines = [], cause = '', fix = [];

    lines.push(['接続先', url]);
    lines.push(['URLの形式', isDev ? '⚠ /dev になっています'
      : (!urlOk ? '⚠ 末尾が /exec ではありません'
        : (gasHost ? '正しい（/exec）' : '末尾は /exec（GAS以外のURLです）'))]);

    var postJson = null, postHtml = false;
    if (post.ok) {
      postHtml = /^\s*<(!doctype|html)/i.test(post.body);
      try { postJson = JSON.parse(post.body); } catch (e) { }
      lines.push(['POST', 'HTTP ' + post.status + (postJson ? '（JSON応答）' : (postHtml ? '（HTMLが返りました）' : '（不明な応答）'))]);
      if (post.finalUrl && post.finalUrl.indexOf('accounts.google.com') >= 0) {
        lines.push(['転送先', 'Googleのログイン画面']);
      }
    } else {
      lines.push(['POST', '✕ ' + post.message]);
    }
    lines.push(['GET（JSONP）', get.ok ? '○ 応答あり' : '✕ ' + get.reason]);

    /* ---- 原因の切り分け（応答から分かることを優先し、URLの形はその次に見る） ---- */
    if (isDev || !urlOk) {
      cause = 'API_URL が正しくありません';
      fix = [
        isDev
          ? 'GASの「デプロイ」→「デプロイを管理」→ ウェブアプリのURL（末尾が /exec）をコピーしてください。/dev は開発用で、自分しか開けません。'
          : 'GASの「デプロイ」→「デプロイを管理」→ ウェブアプリのURL（https://script.google.com/macros/s/……/exec）をコピーしてください。',
        'index.html 先頭の CONFIG.API_URL に貼り付けて、GitHubに push し直してください。'
      ];
    } else if (postJson && postJson.ok === true) {
      cause = '通信は正常です（一時的な失敗だった可能性があります）';
      fix = ['「もう一度読み込む」を押してください。'];
      S.tantoLoaded = false;
    } else if (postJson && postJson.ok === false) {
      cause = 'GAS側でエラーが返っています：' + (postJson.error || '') + '（' + (postJson.code || '') + '）';
      fix = [
        'GASエディタで setup() を1回実行し、スクリプトプロパティ SPREADSHEET_ID が入っているか確認してください。',
        'GASエディタの「実行数」でエラー内容も確認できます。'
      ];
    } else if (postHtml || (post.ok && post.status !== 200)) {
      cause = 'GASのウェブアプリに誰でもアクセスできる状態になっていない可能性が高いです';
      fix = [
        'GASエディタ →「デプロイ」→「デプロイを管理」→ 鉛筆マーク',
        '「次のユーザーとして実行」＝ 自分（スプレッドシートの所有者）',
        '「アクセスできるユーザー」＝ 全員　★ここが「自分のみ」だとこの症状になります',
        '直したら バージョン「新バージョン」→「デプロイ」で反映してください（URLは変わりません）'
      ];
    } else if (get.ok) {
      cause = 'POSTだけが通らない環境です。JSONP方式に切り替えます';
      fix = ['この端末では以後 JSONP で通信します（設定は保存しました）。「もう一度読み込む」を押してください。'];
      CONFIG.TRANSPORT = 'jsonp';
      try { localStorage.setItem('hs_transport', 'jsonp'); } catch (e) { }
      S.tantoLoaded = false;
    } else {
      cause = 'GASのウェブアプリに誰でもアクセスできる状態になっていない可能性が高いです';
      fix = [
        'GASエディタ →「デプロイ」→「デプロイを管理」→ 鉛筆マーク',
        '「次のユーザーとして実行」＝ 自分（' + 'スプレッドシートの所有者' + '）',
        '「アクセスできるユーザー」＝ 全員　★ここが「自分のみ」だとこの症状になります',
        '直したら バージョン「新バージョン」→「デプロイ」で反映してください（URLは変わりません）'
      ];
    }

    clear(host);
    host.appendChild(el('div', {
      style: 'font-weight:700;color:var(--navy);margin-bottom:6px', text: '診断結果：' + cause
    }));
    var tbl = el('table.tbl');
    lines.forEach(function (kv2) {
      tbl.appendChild(el('tr', null, [
        el('th', { style: 'width:96px;text-align:left', text: kv2[0] }),
        el('td', { style: 'word-break:break-all;font-size:12px', text: kv2[1] })
      ]));
    });
    host.appendChild(tbl);
    host.appendChild(el('div', { style: 'font-weight:700;margin-top:10px', text: '直し方' }));
    var ul = el('div', { style: 'margin-top:4px' });
    fix.forEach(function (f, i) {
      ul.appendChild(el('div', { style: 'margin-bottom:4px', text: (i + 1) + '. ' + f }));
    });
    host.appendChild(ul);
    if (post.ok && !postJson) {
      host.appendChild(el('div.hint', {
        style: 'margin-top:10px;white-space:pre-wrap;word-break:break-all',
        text: '応答の先頭:\n' + String(post.body).slice(0, 300)
      }));
    }
    void m;
  });
}

function doLogin() {
  var id = $('#lgTanto').value, pw = $('#lgPw').value;
  if (!id) { $('#lgMsg').textContent = '担当者を選択してください'; return; }
  if (!pw) { $('#lgMsg').textContent = 'パスワードを入力してください'; return; }
  // ★ユーザー操作の直後でなければブラウザが拒否するので、通信前にここで要求する。
  //   FS.set(true) で「全画面でいたい」意思を残し、以後は解除されても次のタップで戻す
  FS.set(true);
  goFullscreen();
  var btn = $('#lgBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 認証中…';
  API.call('login', { tantoId: id, password: pw }).then(function (d) {
    S.token = d.token; S.me = d.me;
    localStorage.setItem('hs_tanto', id);
    sessionStorage.setItem('hs_token', d.token);
    hideLogin();
    return bootstrap();
  }).catch(function (e) {
    $('#lgMsg').textContent = e.message || 'ログインに失敗しました';
  }).then(function () {
    btn.disabled = false; btn.textContent = 'ログイン';
  });
}

/**
 * 起動時同期。
 *  ・端末キャッシュ（localStorage）があれば先に画面を出してしまう
 *  ・サーバ取得は sync.boot の1回だけ（旧方式は8回だったので体感が大きく変わる）
 *  ・重い品名マスタは sync.items でバージョン差分だけ取り、必要になるまで待たない
 */
function bootstrap() {
  var t0 = Date.now();
  var bar = el('div.syncbar', { text: '読込み中…' });
  document.body.appendChild(bar);
  function done(msg) {
    bar.textContent = msg;
    setTimeout(function () { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 600);
  }

  S.anchor = S.anchor || new Date();
  var r = calcRange();
  S.range = r;

  // ① まず端末キャッシュで即描画（2回目以降の起動は待ち時間ほぼゼロ）
  var cached = LS.get('boot');
  var shown = false;
  if (cached && cached.tantos && cached.tantos.length) {
    applyBoot(cached);
    loadItemsFromCache();
    restoreGcal();
    navRoot();
    shown = true;
    bar.textContent = '最新データを確認中…';
  }

  // ② サーバから最新を1回で取得（GASが古い場合は旧方式に自動フォールバック）
  return API.call('sync.boot', { from: r.from, to: r.to }).catch(function (e) {
    if (e.code === 'NO_ACTION') {
      toast('GASの再デプロイがまだのようです。旧方式で読み込みます', 'warn', 5000);
      return legacyBoot(r);
    }
    throw e;
  }).then(function (d) {
    applyBoot(d);
    LS.set('boot', {
      me: d.me, tantos: d.tantos, customers: d.customers, brokers: d.brokers,
      market: d.market, offDays: d.offDays, itemsVersion: d.itemsVersion,
      vapidPublicKey: d.vapidPublicKey
    });
    if (!shown) { restoreGcal(); navRoot(); } else { refreshCalendar(); }
    PWA.handleLaunchAction();          // ?a=fax などのショートカット
    done('最新です（' + Math.round((Date.now() - t0) / 100) / 10 + '秒）');
    if (!shown) toast('ようこそ ' + (S.me ? S.me.担当名 : '') + ' さん', 'info');
    if (S.marketEstimated) {
      toast('市場カレンダーは推定値です（GASで refreshMarketNow を実行してください）', 'warn', 5000);
    }
    // ③ 品名マスタは裏で取得（バージョンが変わっていなければ本体は流れない）
    return syncItems(d.itemsVersion);
  }).catch(function (e) {
    done('');
    if (!shown) {
      toast('同期に失敗しました: ' + (e.message || ''), 'err', 5000);
      restoreGcal();
      navRoot();
    }
  });
}

function applyBoot(d) {
  if (d.me) S.me = d.me;
  if (typeof d.vapidPublicKey === 'string') S.vapidPublicKey = d.vapidPublicKey;
  S.tantos = d.tantos || [];
  S.customers = d.customers || [];
  S.brokers = d.brokers || [];
  if (d.market) {
    S.market = d.market.days || {};
    S.marketEstimated = !!d.market.estimated;
  }
  S.offDays = {};
  (d.offDays || []).forEach(function (x) { S.offDays[x] = true; });
  if (d.orders) applyOrders(d.orders);
}

/** 品名マスタを端末キャッシュから読む */
function loadItemsFromCache() {
  var c = LS.get('items');
  if (c && c.seika) { S.seika = c.seika; S.suisan = c.suisan; S.itemsVersion = c.version; }
  return !!(c && c.seika);
}

/**
 * 旧方式（sync.manifest ＋ sync.chunk）での起動データ取得。
 *  GAS を再デプロイする前に index.html を更新してしまっても動くようにするための保険。
 */
function legacyBoot(r) {
  var out = { tantos: [], customers: [], brokers: [], offDays: [] };
  return API.call('sync.manifest', {}).then(function (mf) {
    out.me = mf.me;
    var names = (mf.chunks || []).filter(function (n) { return n !== 'seika' && n !== 'suisan'; });
    return names.reduce(function (pr, name) {
      return pr.then(function () {
        return API.call('sync.chunk', { name: name, from: r.from, to: r.to }).then(function (d) {
          if (d.tantos) out.tantos = d.tantos;
          if (d.customers) out.customers = d.customers;
          if (d.brokers) out.brokers = d.brokers;
          if (d.market) out.market = d.market;
          if (d.orders) out.orders = d.orders;
        }).catch(function () { });
      });
    }, Promise.resolve());
  }).then(function () {
    return API.call('off.list', {}).then(function (d) { out.offDays = d.days || []; }).catch(function () { });
  }).then(function () { return out; });
}

/**
 * 品名マスタの同期（バージョンが同じならサーバは本体を返さない）。
 *  sync.items が無い古いデプロイでは master.items にフォールバックする。
 */
function syncItems(serverVersion) {
  var have = loadItemsFromCache();
  if (have && serverVersion && S.itemsVersion === serverVersion) return Promise.resolve(false);
  return API.call('sync.items', { version: S.itemsVersion || '' }).then(function (d) {
    if (d.unchanged) return false;
    applyItems(d.version, d.seika, d.suisan);
    return true;
  }).catch(function (e) {
    if (e.code !== 'NO_ACTION') return false;
    // 旧デプロイ向けフォールバック
    return API.call('master.items', {}).then(function (d) {
      applyItems('legacy', d.master['青果'], d.master['水産']);
      return true;
    }).catch(function () { return false; });
  });
}
function applyItems(version, seika, suisan) {
  if (!seika || !suisan) return;
  S.seika = seika; S.suisan = suisan; S.itemsVersion = version || '';
  LS.set('items', { version: S.itemsVersion, seika: seika, suisan: suisan });
}

/** 品名マスタが必要な画面に入る前に、確実に読み込んでおく */
function ensureItems() {
  if (S.seika && S.suisan) return Promise.resolve();
  if (loadItemsFromCache()) return Promise.resolve();
  return syncItems(null).then(function () { });
}

function applyOrders(o) {
  if (!o) return;
  S.marks = o.marks || {};
  S.requests = o.requests || [];
  S.orders = o.orders || [];
  S.loadedRange = { from: o.from, to: o.to };
  S.lastOrderSync = Date.now();
}

/** 案件データの再取得（前後2か月ぶん余裕を持って取り、ページ送りごとの通信を減らす） */
function reloadOrders(from, to) {
  var r = (from && to) ? { from: from, to: to } : calcRange();
  var f = ymd(addDays(parseYmd(r.from), -62));
  var t = ymd(addDays(parseYmd(r.to), 62));
  return api('order.calendar', { from: f, to: t }).then(function (o) {
    applyOrders(o);
    return o;
  });
}

/** 市場カレンダーの年をまたいだら取り直す */
function ensureMarketYear(year) {
  var y = String(year);
  var any = Object.keys(S.market).some(function (k) { return k.slice(0, 4) === y; });
  if (any) return Promise.resolve();
  return api('market.days', { year: Number(y) }, true).then(function (d) {
    Object.keys(d.days || {}).forEach(function (k) { S.market[k] = d.days[k]; });
    if (d.estimated) S.marketEstimated = true;
  }).catch(function () { });
}

/* ==========================================================================
 *  カレンダー画面（既定＝フルスクリーン・月曜始まりの2週表示）
 *   仕様書 p1,p5
 * ========================================================================== */

/** 表示中の期間（データ取得用に前後を少し広くとる） */
function calcRange() {
  var a = S.anchor || new Date();
  var from, to;
  if (S.view === 'calm') {
    from = new Date(a.getFullYear(), a.getMonth() - 1, 1);
    to = new Date(a.getFullYear(), a.getMonth() + 2, 0);
  } else {
    var m = twoWeekStart(a);
    from = addDays(m, -21);
    to = addDays(m, 41);
  }
  return { from: ymd(from), to: ymd(to) };
}

/**
 * 2週表示の開始月曜。
 *  CONFIG.TWO_WEEK_BACK = 0 … 今週＋来週（既定）
 *                       = 1 … 先週＋今週（仕様書のモック画面と同じ並び）
 */
function twoWeekStart(d) {
  return addDays(monday(d), -7 * (CONFIG.TWO_WEEK_BACK || 0));
}

function renderCalendar() {
  var main = clear($('#main'));
  setHeader('濵貞アプリ', { menu: true });          // ハンバーガーはこの画面だけ
  $('#btnView').classList.remove('hide');
  $('#btnView').textContent = (S.view === 'calm') ? '2週表示' : '月表示';

  var wrap = el('div.calwrap');
  var track = el('div.caltrack');
  wrap.appendChild(track);
  main.appendChild(wrap);

  // FAB（左＝未完了リスト／右＝新規登録／その左隣＝FAX写真から自動登録）
  main.appendChild(el('button.fab.l.calfab', {
    text: '📝', title: '未完了リスト', 'data-t': 'fabPending', onclick: showPending
  }));
  main.appendChild(el('button.fab.calfab.s2.cam', {
    text: '📷', title: 'FAX写真から自動登録', 'data-t': 'fabFax',
    onclick: function () { navFromMenu('fax'); }
  }));
  main.appendChild(el('button.fab.calfab', {
    text: '＋', title: '新規登録', 'data-t': 'fabNew',
    onclick: function () { askNewKind(null); }
  }));

  layoutPanes(wrap, track);
  bindSwipe(wrap, track);
  ensureVisibleData();
}

function layoutPanes(wrap, track) {
  var w = wrap.clientWidth || window.innerWidth;
  clear(track);
  track.classList.add('nt');
  track.style.width = (w * 3) + 'px';
  paneAnchors().forEach(function (a) {
    var p = buildPane(a);
    p.style.width = w + 'px';
    track.appendChild(p);
  });
  track.__w = w;
  track.__busy = false;
  setX(track, -w);
  // 1フレーム後にトランジションを戻す（初期描画でアニメーションさせない）
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { track.classList.remove('nt'); });
  });
}

/** transform をピクセルで設定（サブピクセルのブレを防ぐため整数に丸める） */
function setX(track, px) {
  track.style.transform = 'translate3d(' + Math.round(px) + 'px,0,0)';
}

function paneAnchors() {
  var a = S.anchor || new Date();
  if (S.view === 'calm') {
    return [
      new Date(a.getFullYear(), a.getMonth() - 1, 1),
      new Date(a.getFullYear(), a.getMonth(), 1),
      new Date(a.getFullYear(), a.getMonth() + 1, 1)
    ];
  }
  var m = twoWeekStart(a);
  return [addDays(m, -14), m, addDays(m, 14)];
}

/** 基準日を dir ページぶん進める */
function shiftAnchor(dir) {
  var a = S.anchor || new Date();
  if (S.view === 'calm') {
    var last = new Date(a.getFullYear(), a.getMonth() + dir + 1, 0).getDate();
    return new Date(a.getFullYear(), a.getMonth() + dir, Math.min(a.getDate(), last));
  }
  return addDays(a, dir * 14);
}

/**
 * 前後ページへ移動。
 *  ①目的位置までスライド → ②アニメーション後に「反対側の1枚を捨てて進行方向に1枚足す」
 *  だけにして、3枚を作り直さない。これで改ページ時のちらつき／巻き戻りが起きない。
 */
function movePage(dir) {
  var wrap = $('.calwrap'), track = $('.caltrack');
  if (!wrap || !track) return;
  if (track.__busy) return;                       // 連打・多重アニメーション防止
  var w = track.__w || wrap.clientWidth;
  track.__busy = true;

  track.classList.remove('nt');
  setX(track, -w - dir * w);                      // ①スライド

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    track.removeEventListener('transitionend', onEnd);

    S.anchor = shiftAnchor(dir);                  // ②並べ替え（無音）
    var anchors = paneAnchors();
    track.classList.add('nt');
    if (dir > 0) {
      if (track.firstChild) track.removeChild(track.firstChild);
      var np = buildPane(anchors[2]);
      np.style.width = w + 'px';
      track.appendChild(np);
    } else {
      if (track.lastChild) track.removeChild(track.lastChild);
      var pp = buildPane(anchors[0]);
      pp.style.width = w + 'px';
      track.insertBefore(pp, track.firstChild);
    }
    setX(track, -w);
    void track.offsetWidth;                       // 強制リフロー（ここで確定させる）
    requestAnimationFrame(function () {
      track.classList.remove('nt');
      track.__busy = false;
    });
    ensureVisibleData();
  }
  function onEnd(e) { if (e.target === track && e.propertyName === 'transform') finish(); }
  track.addEventListener('transitionend', onEnd);
  setTimeout(finish, 420);                        // transitionend が来ない端末の保険
}

/** 横スワイプ（指の動きに追従して横に流し、離した時にページ送り） */
function bindSwipe(wrap, track) {
  var x0 = 0, y0 = 0, dx = 0, drag = false, lock = null, id = null;

  function start(e) {
    if (track.__busy) return;
    if (e.touches && e.touches.length !== 1) return;
    var t = e.touches ? e.touches[0] : e;
    id = (e.touches && e.touches[0]) ? e.touches[0].identifier : null;
    x0 = t.clientX; y0 = t.clientY;
    dx = 0; drag = true; lock = null;
    track.classList.add('nt');
  }
  function move(e) {
    if (!drag) return;
    var t = e.touches ? e.touches[0] : e;
    if (!t) return;
    var ax = t.clientX - x0, ay = t.clientY - y0;
    if (lock === null) {
      if (Math.abs(ax) < 10 && Math.abs(ay) < 10) return;
      lock = (Math.abs(ax) > Math.abs(ay)) ? 'x' : 'y';
      if (lock === 'y') { drag = false; track.classList.remove('nt'); return; }
    }
    if (lock !== 'x') return;
    var w = track.__w || wrap.clientWidth;
    // 端で引っぱりすぎないように減衰させる
    dx = Math.max(-w * 0.98, Math.min(w * 0.98, ax));
    setX(track, -w + dx);
  }
  function end() {
    if (!drag) { return; }
    drag = false;
    var w = track.__w || wrap.clientWidth;
    track.classList.remove('nt');
    var moved = dx;
    dx = 0;
    if (lock === 'x' && Math.abs(moved) > Math.min(64, w * 0.16)) {
      movePage(moved < 0 ? 1 : -1);
    } else {
      setX(track, -w);                            // 戻す
    }
    lock = null;
  }

  wrap.addEventListener('touchstart', start, { passive: true });
  wrap.addEventListener('touchmove', move, { passive: true });
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);
  void id;
}

/** 1ページ分を組み立てる */
function buildPane(anchor) {
  var pane = el('div.calpane');
  var label, cells = [];
  if (S.view === 'calm') {
    label = anchor.getFullYear() + '年' + (anchor.getMonth() + 1) + '月';
    pane.appendChild(calBar(label));
    var g = el('div.gm');
    var head = el('div.gmhead');
    DOW_MON.forEach(function (d) { head.appendChild(el('div', { text: d })); });
    g.appendChild(head);
    var body = el('div.gmbody');
    var start = monday(new Date(anchor.getFullYear(), anchor.getMonth(), 1));
    var last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
    var weeks = Math.ceil((((last - start) / 86400000) + 1) / 7);
    for (var i = 0; i < weeks * 7; i++) {
      var d = addDays(start, i);
      body.appendChild(buildCell(ymd(d), d.getMonth() !== anchor.getMonth(), true));
    }
    g.appendChild(body);
    pane.appendChild(g);
  } else {
    var m = twoWeekStart(anchor);
    var e = addDays(m, 13);
    label = md(ymd(m)) + ' 〜 ' + md(ymd(e));
    pane.appendChild(calBar(label));
    var g2 = el('div.g2');
    for (var r = 0; r < 7; r++) {
      g2.appendChild(el('div.dw', { text: DOW_MON[r] }));
      g2.appendChild(buildCell(ymd(addDays(m, r)), false, false));
      g2.appendChild(buildCell(ymd(addDays(m, r + 7)), false, false));
    }
    pane.appendChild(g2);
  }
  void cells;
  return pane;
}

function calBar(label) {
  return el('div.calbar', null, [
    el('button', { text: '◀前', onclick: function () { movePage(-1); } }),
    el('span', { text: label }),
    el('button', { text: '次▶', onclick: function () { movePage(1); } })
  ]);
}

/** 日付セル */
function buildCell(day, outside, compact) {
  var k = KOYOMI.info(day);
  var isSun = k.dow === 0, isSat = k.dow === 6;
  var isHol = !!k.holiday;
  var isOff = !!S.offDays[day];
  var cls = 'div.cell';
  if (outside) cls += '.out';
  if (isSun) cls += '.sun'; else if (isHol || isOff) cls += '.hol'; else if (isSat) cls += '.sat';
  if (day === todayYmd()) cls += '.today';
  if (day === S.selected) cls += '.sel';

  var cell = el(cls, { 'data-date': day });

  // 月表示は幅が狭いので「日」だけ（月初のみ m/d）にして文字を大きく見せる
  var dnum = Number(day.slice(8, 10));
  cell.appendChild(el('div.crow', null, [
    el('span.dn', { text: (compact && dnum !== 1) ? String(dnum) : md(day) }),
    // 2週表示は幅があるので祝日名を日付の横に置く（「8/11 山の日」）
    (isHol && !compact) ? el('span.hn.inl', { text: k.holiday }) : null,
    el('span.rk', { text: k.rokuyo || '' })
  ]));
  if (isHol && compact) cell.appendChild(el('div.hn', { text: k.holiday }));

  // ステータスアイコンを日付の直下に置く。
  // （右下・左下のFABが必ず居座るため、業務上いちばん重要なアイコンを上に、
  //   隠れても困らないGoogle予定を下に配置している）
  var chips = el('div.chips');
  var marks = (S.marks[day] || []).slice(0, 4);
  marks.forEach(function (mk) {
    chips.appendChild(el('div.chip.' + mk.kind, { text: mk.label, title: mk.type + ' ' + mk.id }));
  });
  var mkt = S.market[day];
  if (mkt && mkt.label && (!compact || marks.length < 4)) {
    chips.appendChild(el('div.chip.' + (mkt.label === '市' ? 'mkt' : 'mkt2') + (S.marketEstimated ? '.est' : ''),
      { text: mkt.label, title: '市場開場日' + (S.marketEstimated ? '（推定）' : '') }));
  }
  if (isOff) chips.appendChild(el('div.chip.off', { text: '休', title: '担当の休み' }));
  if (chips.childNodes.length) cell.appendChild(chips);

  // Googleカレンダー（最大2行 / 月表示は時間なし）
  var evs = (S.gcal.events[day] || []).slice(0, 2);
  if (evs.length) {
    var evBox = el('div.evs');
    evs.forEach(function (ev) {
      var t = '';
      if (!compact && !ev.allDay && ev.start) t = Number(ev.start.slice(11, 13)) + '時 ';
      evBox.appendChild(el('div.ev', { text: t + ev.summary, title: ev.summary }));
    });
    cell.appendChild(evBox);
  }

  bindCellTap(cell, day);
  return cell;
}

/**
 * タップ＝日付リスト / ロングタップ＝休日登録
 *  Pointer Events で実装（マウス・タッチ・ペンを同じコードで扱える）
 */
function bindCellTap(cell, day) {
  var timer = null, longed = false, x0 = 0, y0 = 0, down = false;
  function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
  cell.addEventListener('pointerdown', function (e) {
    down = true; longed = false;
    x0 = e.clientX; y0 = e.clientY;
    cancel();
    timer = setTimeout(function () {
      longed = true; down = false;
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (err) { } }
      askOffDay(day);
    }, 550);
  });
  cell.addEventListener('pointermove', function (e) {
    if (!down) return;
    if (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10) { down = false; cancel(); }
  });
  cell.addEventListener('pointercancel', function () { down = false; cancel(); });
  cell.addEventListener('pointerup', function () {
    cancel();
    if (!down || longed) { down = false; return; }
    down = false;
    openDateList(day);
  });
}

function askOffDay(day) {
  var on = !!S.offDays[day];
  confirmModal(mdw(day),
    on ? 'この日の休日登録を解除しますか？' : 'この日は休日ですか？',
    on ? '解除する' : '休日にする', on ? 'd' : 'p'
  ).then(function (ok) {
    if (!ok) return;
    api('off.toggle', { date: day }).then(function (d) {
      if (d.off) S.offDays[day] = true; else delete S.offDays[day];
      refreshCalendar();
      toast(mdw(day) + (d.off ? ' を休日にしました' : ' の休日を解除しました'));
    });
  });
}

/** 日付リスト（仕様書 p5：リストをタップで編集ページに遷移） */
function openDateList(day) {
  S.selected = day;
  refreshCalendar();
  var body = el('div');
  body.appendChild(el('div.hint', {
    text: wareki(day) + '（' + DOW[KOYOMI.info(day).dow] + '）　' + (KOYOMI.info(day).rokuyo || '') +
      (KOYOMI.info(day).holiday ? '　' + KOYOMI.info(day).holiday : '') +
      (S.market[day] ? '　市場:' + (S.market[day].label === '市' ? '水産・青果' : (S.market[day].label === '水' ? '水産のみ' : '青果のみ')) : '　市場:休市') +
      (S.offDays[day] ? '　【休日】' : '')
  }));
  var host = el('div', { style: 'margin-top:8px' });
  body.appendChild(host);
  host.appendChild(el('div.empty', null, [el('span.spin.dk'), ' 読み込み中…']));

  var m = modal({
    title: '📅 ' + day + ' の案件',
    body: body,
    buttons: [{
      label: '＋ この日付で新規登録', cls: 'p', fn: function () { askNewKind(day); }
    }]
  });

  // ★手元のデータから即描画（通信を待たない）。裏で最新を取り直して差分があれば再描画する
  function draw(bd) {
    clear(host);
    var any = false;
    (S.gcal.events[day] || []).forEach(function (ev) {
      any = true;
      host.appendChild(el('div.li', { style: 'border-radius:8px;margin-bottom:6px;border:1px solid #dbe6f7;background:#f7fbff' }, [
        el('div.body', null, [
          el('div.t1', null, [el('span.badge', { style: 'background:#4285f4', text: 'Google' }), ' ' + ev.summary]),
          el('div.t2', { text: (ev.allDay ? '終日' : (ev.start || '').slice(11, 16) + '〜' + (ev.end || '').slice(11, 16)) + '　' + (ev.calName || '') })
        ]),
        el('div.acts', null, [el('span', { text: '📅', title: '閲覧のみ' })])
      ]));
    });
    (bd.list || []).forEach(function (r) { any = true; host.appendChild(orderLi(r, m)); });
    if (bd.refs && bd.refs.length) {
      host.appendChild(el('div.hint', { style: 'margin-top:8px;font-weight:700', text: '── 参考：この日が納品/使用/市場開場日の案件 ──' }));
      bd.refs.forEach(function (r) { host.appendChild(orderLi(r, m)); });
    }
    if (!any) host.appendChild(el('div.empty', { text: 'この日の案件はありません' }));
  }

  draw(localByDate(day));

  // 裏で最新を取り直す（他の担当が登録した分を反映）。
  // ★GASは同じユーザーからのリクエストを直列に処理するため、ここで毎回フル取得すると
  //   直後にタップした案件の order.get がその後ろに並んでしまい待たされる。
  //   30秒以内に取り直していれば省略する。
  if (Date.now() - (S.lastOrderSync || 0) > 30000) {
    S.lastOrderSync = Date.now();
    reloadOrders().then(function () {
      if (!m.box.parentNode) return;          // 既に閉じられていたら何もしない
      draw(localByDate(day));
      refreshCalendar();
    }).catch(function () { });
  }
}

/**
 * 手元の S.requests / S.orders から、その日の案件リストを組み立てる。
 *  （サーバの order.byDate と同じ判定。通信を挟まないので瞬時に開く）
 */
function localByDate(day) {
  var list = [], refs = [];
  S.requests.concat(S.orders).forEach(function (r) {
    if (r.ステータス === 'X') {
      if (r.キャンセル日 === day) list.push(withPhase(r, 'キャンセル'));
      return;
    }
    var hit = false;
    if (r.日付 === day) { list.push(withPhase(r, r.type === '依頼' ? '依頼' : '発注')); hit = true; }
    if (r.確定日 === day) { list.push(withPhase(r, r.type === '依頼' ? '納品' : '入荷')); hit = true; }
    if (hit) return;
    if (r.type === '依頼') {
      if (r.希望納品日 === day) refs.push(withPhase(r, '希望納品'));
      else if (r.使用日 === day) refs.push(withPhase(r, '使用'));
    } else if (r.市場開場日 === day) {
      refs.push(withPhase(r, '市場開場'));
    }
  });
  return { date: day, list: list, refs: refs };
}
function withPhase(r, phase) {
  var o = {};
  Object.keys(r).forEach(function (k) { o[k] = r[k]; });
  o.phase = phase;
  return o;
}

/** 案件1件の行（タップで編集画面へ） */
function orderLi(r, closeMe) {
  var kind = (r.type === '依頼') ? 'req' : 'ord';
  var st = statusLabel(r);
  var mine = !!(S.me && String(r.担当ID) === String(S.me.担当ID));
  return el('button.li', {
    onclick: function () { if (closeMe) closeMe.close(); openOrderEdit(r.type, r.id); }
  }, [
    el('div.body', null, [
      el('div.t1', null, [
        el('span.badge.' + kind, { text: (r.phase || r.type) }),
        ' ' + (r.取引先名 || '(取引先未設定)'),
        // 全スタッフ分を出すので、誰の案件かは必ず見えるようにする
        el('span', {
          style: 'font-weight:400;font-size:11.5px;color:' + (mine ? '#6b7787' : '#b8860b'),
          text: '　/ ' + (r.担当名 || tantoName(r.担当ID) || '担当未設定') + (mine ? '' : '（他担当）')
        })
      ]),
      // 依頼時・発注時は金額が決まっていないのが普通なので「¥0」ではなく「金額指定無し」と出す
      el('div.t2', { text: r.明細要約 + '　/　' + (num(r.合計金額) ? yen(r.合計金額) : '金額指定無し') + '　/　' + st }),
      el('div.t2', { text: r.概要 || '' })
    ]),
    el('div.acts', null, [el('span', { text: '✏️' })])
  ]);
}

function statusLabel(r) {
  var s = String(r.ステータス);
  if (s === 'X') return 'キャンセル';
  if (r.type === '依頼') {
    return { '1': '依頼済', '4': '納品確定', '5': '請求完了' }[s] || s;
  }
  return { '2': '発注済', '3': '入荷確定', '6': '支払確認済' }[s] || s;
}

/** カレンダー再描画（データはそのまま。位置は動かさない） */
function refreshCalendar() {
  if (S.nav[S.nav.length - 1] !== 'cal') return;
  var wrap = $('.calwrap'), track = $('.caltrack');
  if (!wrap || !track) return;
  if (track.__busy) {                     // 改ページ中は終わってから
    setTimeout(refreshCalendar, 260);
    return;
  }
  layoutPanes(wrap, track);
}

/** 表示範囲のデータが無ければ取得 */
function ensureVisibleData() {
  var r = calcRange();
  var need = (!S.loadedRange.from || r.from < S.loadedRange.from || r.to > S.loadedRange.to);
  var year = (S.anchor || new Date()).getFullYear();
  var p = ensureMarketYear(year);
  if (need) {
    p = p.then(function () {
      return reloadOrders(r.from, r.to).then(function () { refreshCalendar(); });
    });
  }
  p.then(function () { return loadGcalEvents(r.from, r.to); })
    .then(function (changed) { if (changed) refreshCalendar(); })
    .catch(function () { });
}

/** ＋ボタン：どちらを登録しますか？（仕様書 p6-1） */
function askNewKind(day) {
  choiceModal('新規登録', 'どちらを登録しますか？', [
    { label: 'キャンセル', value: null },
    { label: '仲卸へ発注', cls: 'n', value: '発注' },
    { label: '顧客からの依頼', cls: 'w', value: '依頼' }
  ]).then(function (v) {

/**
 * 未完了ステータスリスト（完了は非表示）
 *  ★既定は「全スタッフ」。
 *    他の担当の仕事を部下が代わりに行うことがあるため、自分の担当だけに絞ると仕事が見えなくなる。
 */
function showPending() {
  var body = el('div');
  var host = el('div');
  var mineOnly = false;
  var sw = el('div.btnrow', { style: 'margin-bottom:8px' }, [
    el('button.btn.s', {
      text: '全スタッフを表示中', onclick: function () {
        mineOnly = !mineOnly;
        this.classList.toggle('on', mineOnly);
        this.textContent = mineOnly ? '自分の担当のみ' : '全スタッフを表示中';
        load();
      }
    })
  ]);
  body.appendChild(sw); body.appendChild(host);
  var m = modal({ title: '📝 未完了リスト', body: body });
  function load() {
    // まず手元のデータで即表示（表示範囲内の分）→ 裏で全期間をサーバから取得
    render(localPending(mineOnly), true);
    api('order.pending', { mineOnly: mineOnly }, true).then(function (d) {
      render(d, false);
    }).catch(function () { });
  }
  function render(d, partial) {
      // 表示範囲の外にある案件も、タップしたときすぐ確定日ウィンドウを出せるよう控えておく
      if (!partial) S.pendingList = d.list || [];
      clear(host);
      if (!d.list.length) {
        host.appendChild(el('div.empty', { text: partial ? '読み込み中…' : '未完了の案件はありません 🎉' }));
        return;
      }
      host.appendChild(el('div.hint', { text: d.count + ' 件' + (partial ? '（表示範囲のみ／全期間を確認中…）' : '') }));
      d.list.forEach(function (r) {
        r.phase = statusLabel(r);
        host.appendChild(el('div', { style: 'margin-bottom:6px' }, [
          el('div.hint', { style: 'margin:2px 0 0 2px', text: mdw(r.日付) }),
          orderLi(r, m)
        ]));
      });
  }
  load();
}

/** 手元のデータから未完了リストを作る（完了・キャンセルは除外） */
function localPending(mineOnly) {
  var list = S.requests.concat(S.orders).filter(function (r) {
    if (r.ステータス === 'X') return false;
    if (r.type === '依頼' && r.ステータス === '5') return false;
    if (r.type === '発注' && r.ステータス === '6') return false;
    if (mineOnly && r.担当ID && S.me && r.担当ID !== S.me.担当ID) return false;
    return true;
  }).sort(function (a, b) { return (a.日付 < b.日付) ? 1 : (a.日付 > b.日付 ? -1 : 0); });
  return { list: list, count: list.length };
}

/* ==========================================================================
 *  画面遷移（簡易ルータ）＋ ドロワー ＋ アカウント ＋ 顧客/仲卸台帳
 * ========================================================================== */
S.navP = [];

function navTo(v, p) {
  S.nav.push(v); S.navP.push(p || {});
  render();
}
function navReplace(v, p) {
  if (S.nav.length) { S.nav.pop(); S.navP.pop(); }
  navTo(v, p);
}
function back() {
  if (S.nav.length <= 1) { navRoot(); return; }
  S.nav.pop(); S.navP.pop();
  render();
}
/** カレンダーへ戻る（履歴スタックをリセット） */
function navRoot() { S.nav = ['cal']; S.navP = [{}]; render(); }
/** メニューからの遷移：履歴を [カレンダー, 目的の画面] にする */
function navFromMenu(v, p) { S.nav = ['cal']; S.navP = [{}]; navTo(v, p); }
function curView() { return S.nav[S.nav.length - 1]; }
function curParams() { return S.navP[S.navP.length - 1] || {}; }

function render() {
  var v = curView(), p = curParams();
  closeDrawer();
  window.scrollTo(0, 0);
  switch (v) {
    case 'cal': renderCalendar(); break;
    case 'account': renderAccount(); break;
    case 'partner': renderPartnerList(p.kind); break;
    case 'partnerEdit': renderPartnerEdit(p.kind, p.data, p.after); break;
    case 'orderForm': renderOrderForm(p); break;
    case 'orderEdit': renderOrderEdit(p); break;
    case 'billing': renderBilling(p.mode); break;
    case 'gcal': renderGcal(); break;
    case 'fax': renderFax(); break;
    case 'log': renderLog(); break;
    case 'notify': renderNotify(); break;
    default: renderCalendar();
  }
}

function setHeader(title, opt) {
  opt = opt || {};
  $('#hTitle').textContent = title;
  $('#hdr').className = 'hdr' + (opt.kind ? ' ' + opt.kind : '');
  $('#btnBack').classList.toggle('hide', !opt.back);
  $('#btnView').classList.add('hide');
  // ハンバーガーメニューはカレンダー画面のみ（他画面は「←」で戻る）
  $('#btnMenu').classList.toggle('hide', !opt.menu);
  $('#hTanto').classList.toggle('hide', !opt.tanto);
  if (opt.tanto) buildTantoSelect(opt.tanto, opt.onTanto);
}

function buildTantoSelect(cur, onChange) {
  var sel = $('#hTanto');
  clear(sel);
  S.tantos.forEach(function (t) {
    sel.appendChild(el('option', { value: t.担当ID, text: t.担当名 }));
  });
  sel.value = cur || (S.me ? S.me.担当ID : '');
  sel.onchange = function () { if (onChange) onChange(sel.value); };
}

/* ==========================================================================
 *  顧客台帳 / 仲卸台帳
 *   仕様書 p3: (＋)で新規登録、リストタップで編集、削除は物理削除
 *              リストのアイコンで電話発信・メーラー・HP・地図
 * ========================================================================== */
function partnerMeta(kind) {
  var isB = (kind === '仲卸');
  var pre = isB ? '仲卸' : '顧客';
  return {
    kind: isB ? '仲卸' : '顧客',
    title: isB ? '仲卸台帳' : '顧客台帳',
    idCol: pre + 'ID', nameCol: pre + '名',
    keys: [pre + '名', '役職', '担当者', pre + '携帯', pre + 'TEL', pre + 'FAX',
      pre + 'メール', pre + 'HP', pre + '〒', pre + '住所', 'メモ'],
    tel: pre + '携帯', tel2: pre + 'TEL', mail: pre + 'メール',
    hp: pre + 'HP', addr: pre + '住所', zip: pre + '〒',
    ph: {
      name: isB ? '仲卸名（必須）' : '顧客名（必須）',
      post: isB ? '役職（例: 代表取締役）' : '役職（例: 店長）'
    }
  };
}

function renderPartnerList(kind) {
  var M = partnerMeta(kind);
  setHeader(M.title, { back: true });
  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);
  var host = el('div.list', { style: 'margin-top:8px' });
  sc.appendChild(host);

  draw(M.kind === '仲卸' ? S.brokers : S.customers);      // まず手元のデータで即表示
  api('partner.list', { kind: M.kind }, true).then(function (d) {
    if (M.kind === '仲卸') S.brokers = d.list; else S.customers = d.list;
    LS.del('boot');
    draw(d.list);
  }).catch(function () { });

  function draw(list) {
    clear(host);
    list = list || [];
    if (!list.length) {
      host.appendChild(el('div.empty', { text: '登録がありません。右下の＋から追加してください' }));
      return;
    }
    list.forEach(function (r) {
      var acts = el('div.acts');
      if (has(r[M.tel]) || has(r[M.tel2])) {
        acts.appendChild(el('a', { href: 'tel:' + (r[M.tel] || r[M.tel2]).replace(/[^0-9+]/g, ''), text: '📱', title: '電話', onclick: stop }));
      }
      if (has(r[M.mail])) acts.appendChild(el('a', { href: 'mailto:' + r[M.mail], text: '✉️', title: 'メール', onclick: stop }));
      if (has(r[M.hp])) acts.appendChild(el('a', { href: r[M.hp], target: '_blank', rel: 'noopener', text: '🌐', title: 'HP', onclick: stop }));
      if (has(r[M.addr])) {
        acts.appendChild(el('a', {
          href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r[M.addr]),
          target: '_blank', rel: 'noopener', text: '🗺️', title: '地図', onclick: stop
        }));
      }
      host.appendChild(el('div.li', null, [
        el('button', {
          style: 'flex:1;min-width:0;text-align:left;background:none;padding:0',
          onclick: function () { navTo('partnerEdit', { kind: M.kind, data: r }); }
        }, [
          el('div.t1', null, [r[M.nameCol], r.mine ? el('span.badge.g', { style: 'margin-left:6px', text: '担当' }) : null]),
          el('div.t2', { text: [r['役職'], r['担当者']].filter(has).join(' / ') + (r['担当ID'] ? '　担当:' + tantoName(r['担当ID']) : '') })
        ]),
        acts
      ]));
    });
  }

  main.appendChild(el('div.fabrow', null, [
    el('button.fab.gray', { text: '←', onclick: back }),
    el('button.fab', { text: '＋', onclick: function () { navTo('partnerEdit', { kind: M.kind, data: null }); } })
  ]));

  function stop(e) { e.stopPropagation(); }
}

/**
 * 台帳の編集画面。
 *  ・ラベルは置かず、欄内の説明（placeholder）で分かるようにして縦を詰める
 *  ・役職＋担当者、TEL＋FAX は1行。郵便番号は1/3幅
 *  ・濵貞担当はヘッダー右上のコンボボックス（他画面と統一）
 */
function renderPartnerEdit(kind, data, after) {
  var M = partnerMeta(kind);
  var isNew = !data;
  var tantoId = (data && data['担当ID']) || (S.me ? S.me.担当ID : '');

  setHeader(M.kind + (isNew ? ' 新規登録' : ' 情報編集'), {
    back: true, tanto: tantoId, onTanto: function (v) { tantoId = v; }
  });
  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  var f = {};
  function inp(key, type, ph, cls) {
    var i = el('input', { type: type || 'text', placeholder: ph || key, value: data ? (data[key] || '') : '' });
    f[key] = i;
    return el('div.fld' + (cls || ''), null, [i]);
  }
  var memo = el('textarea', { placeholder: 'メモ' });
  memo.value = data ? (data['メモ'] || '') : '';
  f['メモ'] = memo;

  var pre = M.kind === '仲卸' ? '仲卸' : '顧客';
  sc.appendChild(el('div.sec', null, [
    autoScrollAll(el('div.in', null, [
      inp(M.nameCol, 'text', M.ph.name),
      el('div.row', null, [inp('役職', 'text', M.ph.post), inp('担当者', 'text', '担当者名')]),
      inp(pre + '携帯', 'tel', '携帯番号'),
      el('div.row', null, [inp(pre + 'TEL', 'tel', 'TEL'), inp(pre + 'FAX', 'tel', 'FAX')]),
      inp(pre + 'メール', 'email', 'メールアドレス'),
      inp(pre + 'HP', 'url', 'ホームページURL'),
      el('div.row', null, [
        inp(pre + '〒', 'text', '〒000-0000', '.w3'),
        inp(pre + '住所', 'text', '住所')
      ]),
      el('div.fld', null, [memo])
    ]))
  ]));

  var fabs = el('div.fabrow');
  fabs.appendChild(el('button.fab.gray', { text: '←', onclick: back }));
  if (!isNew) fabs.appendChild(el('button.fab.r', { text: '🗑', title: '削除', onclick: doDelete }));
  fabs.appendChild(el('button.fab.g', { text: '💾', onclick: doSave }));
  main.appendChild(fabs);

  function collect() {
    var o = {};
    M.keys.forEach(function (k) { o[k] = f[k] ? f[k].value : ''; });
    o['担当ID'] = tantoId;
    if (!isNew) o[M.idCol] = data[M.idCol];
    return o;
  }
  function doSave() {
    var o = collect();
    if (!has(o[M.nameCol])) { toast('名称は必須です', 'err'); return; }
    api('partner.save', { kind: M.kind, data: o }).then(function (d) {
      toast(isNew ? M.kind + 'を登録しました' : '更新しました');
      LS.del('boot');
      return api('partner.list', { kind: M.kind }).then(function (l) {
        if (M.kind === '仲卸') S.brokers = l.list; else S.customers = l.list;
        if (after) after(d.id, o[M.nameCol]);
        back();
      });
    });
  }
  function doDelete() {
    confirmModal('削除', M.kind + '「' + data[M.nameCol] + '」を削除します。\n（物理削除のため元に戻せません）', '削除する', 'd')
      .then(function (ok) {
        if (!ok) return;
        return api('partner.delete', { kind: M.kind, id: data[M.idCol] }).then(function (d) {
          if (d.needConfirm) {
            return confirmModal('確認', d.message, '強制削除', 'd').then(function (ok2) {
              if (!ok2) return;
              return api('partner.delete', { kind: M.kind, id: data[M.idCol], force: true }).then(fin);
            });
          }
          fin();
        });
      });
    function fin() {
      toast('削除しました');
      LS.del('boot');
      api('partner.list', { kind: M.kind }).then(function (l) {
        if (M.kind === '仲卸') S.brokers = l.list; else S.customers = l.list;
        back();
      });
    }
  }
}
