<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3864">
<meta name="format-detection" content="telephone=no">
<title>濵貞アプリ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3864'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E濵%3C/text%3E%3C/svg%3E">
<style>
/* ==========================================================================
   濵貞アプリ  ver1.0   -   GitHub Pages 用 単一ファイルフロントエンド
   色: 顧客依頼=黄土色 #b8860b / 仲卸発注=紺色 #1f3864
   ========================================================================== */
:root{
  --navy:#1f3864; --navy-d:#152744; --ocher:#b8860b; --ocher-d:#8f6a09;
  --bg:#eef2f7; --card:#fff; --line:#dde3ec; --txt:#1a2334; --sub:#6b7787;
  --sun:#fdeaea; --sat:#eaf1fd; --sun-t:#d2413c; --sat-t:#2f6fd0;
  --ok:#27884a; --warn:#e08600; --err:#c62828; --today:#1f6fe0;
  --h:52px; --fab:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--today);text-decoration:none}
.hide{display:none !important}

/* ---------- App shell ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.hdr{
  height:var(--h); min-height:var(--h); background:var(--navy); color:#fff;
  display:flex; align-items:center; gap:8px; padding:0 10px;
  box-shadow:0 1px 4px rgba(0,0,0,.25); position:relative; z-index:20;
}
.hdr.req{background:var(--ocher)}
.hdr.ord{background:var(--navy)}
.hdr h1{font-size:17px;font-weight:700;margin:0;flex:0 0 auto;letter-spacing:.02em}
.hdr .sp{flex:1}
.hdr button{
  color:#fff;background:rgba(255,255,255,.16);border-radius:6px;
  padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap;
}
.hdr button:active{background:rgba(255,255,255,.32)}
.hdr .ico{font-size:19px;padding:5px 9px;line-height:1}
.hdr select{
  background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;
  padding:5px 6px;font-size:13px;max-width:38vw;
}
.hdr select option{color:#000}
main{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(104px + var(--safe-b))}

/* ---------- Toast (3秒で消える) ---------- */
#toast{
  position:fixed;left:50%;top:calc(var(--h) + 6px);transform:translateX(-50%);
  z-index:400;display:flex;flex-direction:column;gap:6px;align-items:center;
  pointer-events:none;width:92%;max-width:520px;
}
.toast{
  background:var(--ok);color:#fff;padding:7px 16px;border-radius:16px;
  font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25);
  animation:tin .18s ease-out; text-align:center;
}
.toast.err{background:var(--err)} .toast.warn{background:var(--warn)} .toast.info{background:#455a75}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- Login ---------- */
#vLogin{
  position:absolute;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:rgba(20,28,44,.72);backdrop-filter:blur(2px);padding:20px;
}
.loginbox{background:#fff;border-radius:12px;padding:22px 20px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.loginbox h2{margin:0 0 4px;text-align:center;font-size:19px;color:var(--navy)}
.loginbox p{margin:0 0 16px;text-align:center;font-size:12px;color:var(--sub)}
.loginbox select,.loginbox input{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fff;
}
.loginbox button{
  width:100%;padding:12px;background:var(--ok);color:#fff;border-radius:8px;font-weight:700;font-size:16px;
}
.loginbox button:disabled{opacity:.5}
.syncbar{
  position:absolute;top:calc(var(--h) + 8px);left:50%;transform:translateX(-50%);
  background:#c8a13a;color:#fff;padding:5px 14px;border-radius:14px;font-size:12px;font-weight:700;z-index:310;
}

/* ---------- Calendar ---------- */
.calwrap{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
.caltrack{display:flex;width:300%;height:100%;transition:transform .26s cubic-bezier(.25,.8,.3,1)}
.caltrack.nt{transition:none}
.calpane{width:33.3333%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.calbar{
  display:flex;align-items:center;justify-content:space-between;background:#dfe6f0;
  padding:3px 6px;font-weight:700;font-size:14px;color:var(--navy);border-bottom:1px solid var(--line);
}
.calbar button{background:#fff;border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--navy)}

/* 2週表示: 縦に曜日、横に2週 */
.g2{flex:1;display:grid;grid-template-columns:22px 1fr 1fr;grid-auto-rows:1fr;background:var(--line);gap:1px;overflow:hidden}
.g2 .dw{background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);writing-mode:vertical-rl}
/* 月表示 */
.gm{flex:1;display:flex;flex-direction:column;overflow:hidden}
.gmhead{display:grid;grid-template-columns:repeat(7,1fr);background:#eef2f7;border-bottom:1px solid var(--line)}
.gmhead div{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:2px 0}
.gmhead div:nth-child(6){color:var(--sat-t)} .gmhead div:nth-child(7){color:var(--sun-t)}
.gmbody{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;background:var(--line);gap:1px;overflow:hidden}

.cell{background:#fff;padding:1px 2px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative;touch-action:manipulation}
.cell.sun{background:var(--sun)} .cell.sat{background:var(--sat)}
.cell.hol{background:var(--sun)} .cell.off{background:var(--sun)}
.cell.out{background:#f4f6f9;opacity:.5}
.cell.sel{box-shadow:inset 0 0 0 2px var(--today);z-index:2}
.cell.today .dn{background:var(--today);color:#fff;border-radius:4px;padding:0 3px}
.crow{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;line-height:1.15}
.dn{font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.cell.sun .dn,.cell.hol .dn{color:var(--sun-t)} .cell.sat .dn{color:var(--sat-t)}
.rk{font-size:9px;color:#8d97a6;white-space:nowrap;transform:scale(.92);transform-origin:right top}
.hn{font-size:9px;color:var(--sun-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ev{font-size:9.5px;color:#2f6fd0;background:#eaf1fd;border-radius:2px;padding:0 2px;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.chips{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;padding-top:1px}
.chip{
  width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;flex:0 0 auto;
}
.chip.req{background:var(--ocher)} .chip.ord{background:var(--navy)}
.chip.mkt{background:#3d9a5f} .chip.mkt2{background:#7ab894}
.chip.off{background:#a0a8b4}
.chip.est{opacity:.55}

/* ---------- FAB ---------- */
.fab{
  position:absolute;right:14px;bottom:calc(16px + var(--safe-b));width:var(--fab);height:var(--fab);
  border-radius:50%;background:var(--today);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.28);z-index:30;
}
.fab.l{left:14px;right:auto;background:#7e57c2;font-size:22px}
.fab.g{background:var(--ok)} .fab.r{background:#c62828} .fab.gray{background:#78849b}
.fab.s2{right:82px} .fab.s3{right:150px}
.fab:active{transform:scale(.94)}
.fabrow{position:absolute;right:14px;bottom:calc(16px + var(--safe-b));display:flex;gap:12px;z-index:30}
.fabrow .fab{position:static;right:auto;bottom:auto}

/* ---------- Drawer ---------- */
#drawer{position:absolute;inset:0;z-index:200;display:none}
#drawer.on{display:block}
#drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#drawer .panel{
  position:absolute;top:0;right:0;bottom:0;width:74%;max-width:300px;background:#fff;
  box-shadow:-3px 0 14px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease-out;
  display:flex;flex-direction:column;
}
#drawer.on .panel{transform:none}
#drawer h3{margin:0;padding:16px 16px 10px;font-size:16px;border-bottom:2px solid var(--navy);color:var(--navy)}
#drawer .mi{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;width:100%;text-align:left;
}
#drawer .mi:active{background:#eef2f7}
#drawer .mi .em{font-size:18px;width:24px;text-align:center}
#drawer .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}

/* ---------- Sheets / modal ---------- */
.modal{position:fixed;inset:0;z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.mbox{
  position:relative;background:#fff;border-radius:12px;width:100%;max-width:440px;max-height:86vh;
  display:flex;flex-direction:column;box-shadow:0 10px 34px rgba(0,0,0,.35);animation:min .16s ease-out;
}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mhd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy)}
.mhd .sp{flex:1}
.mhd button{background:#eef2f7;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.mbd{padding:14px;overflow-y:auto;flex:1}
.mft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mft button{padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;background:#eef2f7;color:var(--txt)}
.mft button.p{background:var(--ok);color:#fff} .mft button.d{background:var(--err);color:#fff}
.mft button.n{background:var(--navy);color:#fff} .mft button.w{background:var(--warn);color:#fff}

/* ---------- Cards / forms ---------- */
.sec{background:#fff;margin:8px;border-radius:10px;box-shadow:0 1px 3px rgba(20,40,80,.09);overflow:hidden}
.sec>h3{margin:0;padding:11px 13px;font-size:14px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line);background:#f7f9fc}
.sec>.in{padding:12px 13px}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.fld>label .rq{color:var(--err)}
.fld input,.fld select,.fld textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
}
.fld textarea{min-height:64px;resize:vertical}
.fld input:disabled,.fld textarea:disabled{background:#f4f6f9;color:#61708a}
.ro{padding:9px 11px;background:#f4f6f9;border:1px solid var(--line);border-radius:8px;min-height:40px;font-size:15px;white-space:pre-wrap;word-break:break-all}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.row.a{align-items:flex-end}
.w90{flex:0 0 96px} .w110{flex:0 0 112px} .w70{flex:0 0 74px}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;font-size:14px;background:#eef2f7;color:var(--txt);white-space:nowrap}
.btn.p{background:var(--ok);color:#fff} .btn.n{background:var(--navy);color:#fff}
.btn.o{background:var(--ocher);color:#fff} .btn.d{background:var(--err);color:#fff}
.btn.s{padding:6px 10px;font-size:12px}
.btn.gh{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.on.sk{background:var(--ok);border-color:var(--ok)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}

/* ---------- List ---------- */
.list{background:#fff;margin:8px;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.09)}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff}
.li:last-child{border-bottom:none}
.li:active{background:#f2f6fb}
.li .body{flex:1;min-width:0}
.li .t1{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .acts{display:flex;gap:4px;flex:0 0 auto}
.li .acts a,.li .acts button{
  width:32px;height:32px;border-radius:6px;background:#f0f3f8;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;color:#fff;vertical-align:middle}
.badge.req{background:var(--ocher)} .badge.ord{background:var(--navy)}
.badge.g{background:var(--ok)} .badge.x{background:#98a2b2} .badge.w{background:var(--warn)}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:13px}

/* ---------- 品名情報 ---------- */
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfe}
.item .ih{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.item .ih .no{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:4px;padding:1px 6px}
.item .ih .sp{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:7px;border-radius:7px;background:#eef2f7;font-weight:700;font-size:13px;color:var(--sub)}
.tabs button.on{background:var(--navy);color:#fff}
.cats{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;padding-bottom:2px}
.cats button{flex:0 0 auto;padding:5px 9px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--navy)}
.cats button.on{background:var(--ocher);color:#fff;border-color:var(--ocher)}
.dsum{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:2px solid var(--navy);background:#f7f9fc;font-weight:700}
.amt{text-align:right !important;font-variant-numeric:tabular-nums}
.neg{color:var(--err)}

/* ---------- warn box ---------- */
.wbox{border:1px solid #f0c36d;background:#fff8e6;border-radius:8px;padding:10px;margin-bottom:10px}
.wbox.other{border-color:#e39191;background:#fdeeee}
.wbox .wt{font-weight:700;font-size:13px;margin-bottom:4px;color:#8a5b00}
.wbox.other .wt{color:#a52020}
.wbox .wl{font-size:12px;line-height:1.6}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 6px;text-align:left}
.tbl th{background:#f0f3f8;font-size:11.5px;color:var(--sub);white-space:nowrap}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
.spin.dk{border-color:rgba(31,56,100,.25);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.cover{position:absolute;inset:0;background:rgba(255,255,255,.6);z-index:100;display:flex;align-items:center;justify-content:center}
.photo{width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px}
</style>
</head>
<body>

<div id="app">
  <!-- ========== ヘッダー ========== -->
  <div class="hdr" id="hdr">
    <button class="ico hide" id="btnBack">←</button>
    <h1 id="hTitle">濵貞アプリ</h1>
    <div class="sp"></div>
    <select id="hTanto" class="hide"></select>
    <button id="btnView" class="hide">月表示</button>
    <button class="ico" id="btnMenu">☰</button>
  </div>

  <!-- ========== メイン ========== -->
  <main id="main"></main>

  <!-- ========== ドロワー ========== -->
  <div id="drawer">
    <div class="mask" data-close="1"></div>
    <div class="panel">
      <h3>メニュー</h3>
      <button class="mi" data-nav="account"><span class="em">👤</span>アカウント</button>
      <button class="mi" data-nav="cust"><span class="em">👥</span>顧客台帳</button>
      <button class="mi" data-nav="brok"><span class="em">🏢</span>仲卸台帳</button>
      <button class="mi" data-nav="invoice"><span class="em">💰</span>請求処理</button>
      <button class="mi" data-nav="payment"><span class="em">🧾</span>支払い確認</button>
      <button class="mi" data-nav="gcal"><span class="em">📅</span>Googleカレンダー連携</button>
      <button class="mi" data-nav="fax"><span class="em">📷</span>FAX写真から自動登録</button>
      <button class="mi" data-nav="log"><span class="em">📋</span>操作履歴（監査ログ）</button>
      <div class="foot">
        <div id="drwMe"></div>
        <div id="drwVer" style="margin-top:4px"></div>
      </div>
    </div>
  </div>

  <!-- ========== ログイン ========== -->
  <div id="vLogin">
    <div class="loginbox">
      <h2>ログイン</h2>
      <p>担当者を選択し、パスワードを入力してください</p>
      <select id="lgTanto"><option value="">担当者を選択…</option></select>
      <input id="lgPw" type="password" inputmode="numeric" placeholder="パスワード" autocomplete="off">
      <button id="lgBtn">ログイン</button>
      <div id="lgMsg" class="hint" style="text-align:center;color:#c62828;min-height:18px"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modals"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>

/* ---- 旧暦・六曜（検証済み: 天体暦リファレンスと2024-2040で完全一致） ---- */
/* ============================================================
 * 旧暦・六曜 計算モジュール（高野英明氏の旧暦計算アルゴリズム準拠）
 *  - タイムゾーンは日本時間(JST=UT+9h)固定
 *  - 六曜 = (旧暦月 + 旧暦日) mod 6
 *      0:大安 1:赤口 2:先勝 3:友引 4:先負 5:仏滅
 * ============================================================ */
(function (root) {
  'use strict';

  var ROKUYO = ['大安', '赤口', '先勝', '友引', '先負', '仏滅'];
  var TZ = 9 / 24;                 // JST
  var K = Math.PI / 180;           // deg -> rad

  function norm360(a) { a = a % 360; return a < 0 ? a + 360 : a; }
  function cosd(a) { return Math.cos(a * K); }

  /* ユリウス日(TT基準の通日)。y/m/d は JST の暦日、t は日の端数(0-1) */
  function toJD(y, m, d) {
    if (m < 3) { y -= 1; m += 12; }
    return Math.floor(365.25 * y) + Math.floor(y / 400) - Math.floor(y / 100) +
      Math.floor(30.59 * (m - 2)) + 1721088 + d;
  }

  /* JD -> {y,m,d} */
  function fromJD(jd) {
    var x0 = Math.floor(jd + 68570);
    var x1 = Math.floor(x0 / 36524.25);
    var x2 = x0 - Math.floor(36524.25 * x1 + 0.75);
    var x3 = Math.floor((x2 + 1) / 365.2425);
    var x4 = x2 - Math.floor(365.25 * x3) + 31;
    var x5 = Math.floor(Math.floor(x4) / 30.59);
    var x6 = Math.floor(Math.floor(x5) / 11);
    var d = x4 - Math.floor(30.59 * x5);

  return Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) + '(' + DOW[d.getDay()] + ')';
}
/** 月曜始まりの週頭 */
function monday(d) {
  var x = new Date(d.getTime());
  var w = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - w);
  x.setHours(0, 0, 0, 0);
  return x;
}
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  var s = String(v).replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[,\s円¥￥]/g, '');
  var neg = /^[▲△-]/.test(s);
  s = s.replace(/^[▲△-]/, '');
  var n = parseFloat(s);
  if (isNaN(n)) return 0;
  return neg ? -n : n;
}
function yen(n) {
  n = num(n);
  return (n < 0 ? '▲' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}
function qty(v) {
  if (v === '' || v === null || v === undefined) return '';
  var n = num(v);
  return String(Math.round(n * 1000) / 1000);
}
function kana(v) {
  return String(v || '').replace(/[ァ-ン]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); })
    .replace(/[\s　（）()【】\[\]・,、。]/g, '');
}
function has(v) { return v !== null && v !== undefined && String(v).trim() !== ''; }
function wareki(s) {
  if (!s) return '';
  var p = String(s).split('-'), y = Number(p[0]);
  return (y >= 2019 ? '令和' + (y - 2018) : y) + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}

/* ==========================================================================
 *  API クライアント
 * ========================================================================== */
var API = (function () {
  var seq = 0;

  function post(action, payload) {
    return fetch(CONFIG.API_URL, {
      method: 'POST',
      redirect: 'follow',
      /* text/plain にすることで CORS プリフライトを回避（GASはOPTIONSを返せない） */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, token: S.token, payload: payload || {} })
    }).then(function (r) { return r.json(); });
  }

  function jsonp(action, payload) {
    return new Promise(function (res, rej) {
      var cb = '__hcb' + (++seq) + '_' + Date.now();
      var sc = document.createElement('script');
      var to = setTimeout(function () { cleanup(); rej(new Error('タイムアウト')); }, 60000);
      function cleanup() {
        clearTimeout(to);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (sc.parentNode) sc.parentNode.removeChild(sc);
      }
      window[cb] = function (d) { cleanup(); res(d); };
      sc.onerror = function () { cleanup(); rej(new Error('通信に失敗しました')); };
      sc.src = CONFIG.API_URL + '?action=' + encodeURIComponent(action) +
        '&token=' + encodeURIComponent(S.token || '') +
        '&callback=' + cb +
        '&payload=' + encodeURIComponent(JSON.stringify(payload || {}));
      document.body.appendChild(sc);
    });
  }

  /** 呼び出し本体。ok:false は例外にして呼び出し側で catch させる */
  function call(action, payload, opt) {
    opt = opt || {};
    var p = (CONFIG.TRANSPORT === 'jsonp') ? jsonp(action, payload) : post(action, payload);
    return p.then(function (r) {
      if (!r) throw new Error('空の応答');
      if (!r.ok) {
        var e = new Error(r.error || 'エラー');
        e.code = r.code;
        throw e;
      }
      return r.data;
    }).catch(function (err) {
      if (CONFIG.TRANSPORT === 'post' && !opt._retried && /Failed to fetch|NetworkError|CORS/i.test(err.message || '')) {
        // POST が通らない環境では JSONP に自動フォールバック
        CONFIG.TRANSPORT = 'jsonp';
        return call(action, payload, { _retried: true });
      }
      if (err.code === 'UNAUTHORIZED') {
        S.token = ''; sessionStorage.removeItem('hs_token');
        showLogin('セッションが切れました。再ログインしてください');
      }
      throw err;
    });
  }

  return { call: call };
})();

/** ローディング付き API 呼び出し */
function api(action, payload, silentErr) {
  return API.call(action, payload).catch(function (e) {
    if (!silentErr) toast(e.message || '通信エラー', 'err', 4200);
    throw e;
  });
}

/** 起動時同期（進捗表示つき） */
function bootstrap() {
  var bar = el('div.syncbar', { text: 'データ同期中 (0%)' });
  document.body.appendChild(bar);
  function prog(p) { bar.textContent = 'データ同期中 (' + p + '%)'; }

  // 表示範囲（前後2か月）を先に決めておく
  S.anchor = S.anchor || new Date();
  var r = calcRange();
  S.range = r;

  var chunks = [];
  return API.call('sync.manifest', {}).then(function (mf) {
    S.me = mf.me || S.me;
    chunks = mf.chunks || [];
    var done = 0;
    // 直列に取得（GAS の同時実行制限を避ける）
    return chunks.reduce(function (pr, name) {
      return pr.then(function () {
        return API.call('sync.chunk', { name: name, from: r.from, to: r.to })
          .then(function (d) { applyChunk(name, d); })
          .catch(function (e) { console.warn('sync ' + name + ': ' + e.message); })
          .then(function () { done++; prog(Math.round(done / chunks.length * 100)); });
      });
    }, Promise.resolve());
  }).then(function () {
    return API.call('off.list', {}).then(function (d) {
      S.offDays = {};
      (d.days || []).forEach(function (x) { S.offDays[x] = true; });
    }).catch(function () { });
  }).then(function () {
    prog(100);
    setTimeout(function () { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 700);
    restoreGcal();
    navRoot();
    toast('ようこそ ' + (S.me ? S.me.担当名 : '') + ' さん', 'info');
    if (S.marketEstimated) {
      toast('市場カレンダーは推定値です（都のCSVを取得できませんでした）', 'warn', 5000);
    }
  }).catch(function (e) {
    if (bar.parentNode) bar.parentNode.removeChild(bar);
    toast('同期に失敗しました: ' + (e.message || ''), 'err', 5000);
    navRoot();
  });
}

function applyChunk(name, d) {
  if (!d) return;
  switch (name) {
    case 'tanto': S.tantos = d.tantos || []; break;
    case 'customer': S.customers = d.customers || []; break;
    case 'broker': S.brokers = d.brokers || []; break;
    case 'seika': S.seika = d.seika || { byCat: {} }; break;
    case 'suisan': S.suisan = d.suisan || { byCat: {} }; break;
    case 'market':
      S.market = (d.market && d.market.days) || {};
      S.marketEstimated = !!(d.market && d.market.estimated);
      break;
    case 'orders': applyOrders(d.orders); break;
  }
}

function applyOrders(o) {
  if (!o) return;
  S.marks = o.marks || {};
  S.requests = o.requests || [];
  S.orders = o.orders || [];
  S.loadedRange = { from: o.from, to: o.to };
}

/** 表示中の期間（データ取得用に前後を少し広くとる） */
function calcRange() {
  var a = S.anchor || new Date();
  var from, to;
  if (S.view === 'calm') {
    from = new Date(a.getFullYear(), a.getMonth() - 1, 1);
    to = new Date(a.getFullYear(), a.getMonth() + 2, 0);
  } else {
    var m = twoWeekStart(a);
    from = addDays(m, -21);
    to = addDays(m, 41);
  }
  return { from: ymd(from), to: ymd(to) };
}

/**
 * 2週表示の開始月曜。
 *  CONFIG.TWO_WEEK_BACK = 0 … 今週＋来週（既定）
 *                       = 1 … 先週＋今週（仕様書のモック画面と同じ並び）
 */
function twoWeekStart(d) {
  return addDays(monday(d), -7 * (CONFIG.TWO_WEEK_BACK || 0));
}

function renderCalendar() {

function layoutPanes(wrap, track) {
  var w = wrap.clientWidth || window.innerWidth;
  clear(track);
  track.classList.add('nt');
  track.style.width = (w * 3) + 'px';
  var anchors = paneAnchors();
  anchors.forEach(function (a) {
    var p = buildPane(a);
    p.style.width = w + 'px';
    track.appendChild(p);
  });
  track.style.transform = 'translateX(' + (-w) + 'px)';
  requestAnimationFrame(function () { track.classList.remove('nt'); });
  track.__w = w;
}

function paneAnchors() {
  var a = S.anchor || new Date();
  if (S.view === 'calm') {
    return [
      new Date(a.getFullYear(), a.getMonth() - 1, 1),
      new Date(a.getFullYear(), a.getMonth(), 1),
      new Date(a.getFullYear(), a.getMonth() + 1, 1)
    ];
  }
  var m = twoWeekStart(a);
  return [addDays(m, -14), m, addDays(m, 14)];
}

/** 前後ページへ移動 */
function movePage(dir) {
  var a = S.anchor || new Date();
  if (S.view === 'calm') {
    var last = new Date(a.getFullYear(), a.getMonth() + dir + 1, 0).getDate();
    S.anchor = new Date(a.getFullYear(), a.getMonth() + dir, Math.min(a.getDate(), last));
  } else {
    S.anchor = addDays(a, dir * 14);
  }
  var wrap = $('.calwrap'), track = $('.caltrack');
  if (!wrap || !track) return;
  var w = track.__w || wrap.clientWidth;
  track.style.transform = 'translateX(' + (-w - dir * w) + 'px)';
  setTimeout(function () { layoutPanes(wrap, track); ensureVisibleData(); }, 270);
}

/** 横スワイプ（横に流れて次頁が次第に表示される） */
function bindSwipe(wrap, track) {
  var x0 = 0, y0 = 0, dx = 0, drag = false, lock = null;
  wrap.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dx = 0; drag = true; lock = null;
    track.classList.add('nt');
  }, { passive: true });
  wrap.addEventListener('touchmove', function (e) {
    if (!drag) return;
    var cx = e.touches[0].clientX, cy = e.touches[0].clientY;
    var ax = cx - x0, ay = cy - y0;
    if (lock === null) {
      if (Math.abs(ax) < 8 && Math.abs(ay) < 8) return;
      lock = (Math.abs(ax) > Math.abs(ay) * 1.2) ? 'x' : 'y';
    }
    if (lock !== 'x') return;
    dx = ax;
    var w = track.__w || wrap.clientWidth;
    track.style.transform = 'translateX(' + (-w + dx) + 'px)';
  }, { passive: true });
  function end() {
    if (!drag) return;
    drag = false;
    track.classList.remove('nt');
    var w = track.__w || wrap.clientWidth;
    if (lock === 'x' && Math.abs(dx) > Math.min(70, w * 0.18)) {
      movePage(dx < 0 ? 1 : -1);
    } else {
      track.style.transform = 'translateX(' + (-w) + 'px)';
    }
    dx = 0;
  }
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);
}

/** 1ページ分を組み立てる */
function buildPane(anchor) {
  var pane = el('div.calpane');
  var label, cells = [];
  if (S.view === 'calm') {
    label = anchor.getFullYear() + '年' + (anchor.getMonth() + 1) + '月';
    pane.appendChild(calBar(label));
    var g = el('div.gm');
    var head = el('div.gmhead');
    DOW_MON.forEach(function (d) { head.appendChild(el('div', { text: d })); });
    g.appendChild(head);
    var body = el('div.gmbody');
    var start = monday(new Date(anchor.getFullYear(), anchor.getMonth(), 1));
    var last = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
    var weeks = Math.ceil((((last - start) / 86400000) + 1) / 7);
    for (var i = 0; i < weeks * 7; i++) {
      var d = addDays(start, i);
      body.appendChild(buildCell(ymd(d), d.getMonth() !== anchor.getMonth(), true));
    }
    g.appendChild(body);
    pane.appendChild(g);
  } else {
    var m = twoWeekStart(anchor);
    var e = addDays(m, 13);
    label = md(ymd(m)) + ' 〜 ' + md(ymd(e));
    pane.appendChild(calBar(label));
    var g2 = el('div.g2');
    for (var r = 0; r < 7; r++) {
      g2.appendChild(el('div.dw', { text: DOW_MON[r] }));
      g2.appendChild(buildCell(ymd(addDays(m, r)), false, false));
      g2.appendChild(buildCell(ymd(addDays(m, r + 7)), false, false));
    }
    pane.appendChild(g2);
  }
  void cells;
  return pane;
}

function calBar(label) {
  return el('div.calbar', null, [
    el('button', { text: '◀前', onclick: function () { movePage(-1); } }),
    el('span', { text: label }),
    el('button', { text: '次▶', onclick: function () { movePage(1); } })
  ]);
}

/** 日付セル */
function buildCell(day, outside, compact) {
  var k = KOYOMI.info(day);
  var isSun = k.dow === 0, isSat = k.dow === 6;
  var isHol = !!k.holiday;
  var isOff = !!S.offDays[day];
  var cls = 'div.cell';
  if (outside) cls += '.out';
  if (isSun) cls += '.sun'; else if (isHol || isOff) cls += '.hol'; else if (isSat) cls += '.sat';
  if (day === todayYmd()) cls += '.today';
  if (day === S.selected) cls += '.sel';

  var cell = el(cls, { 'data-date': day });

  cell.appendChild(el('div.crow', null, [
    el('span.dn', { text: md(day) }),
    el('span.rk', { text: k.rokuyo || '' })
  ]));
  if (isHol && !compact) cell.appendChild(el('div.hn', { text: k.holiday }));
  else if (isHol && compact) cell.appendChild(el('div.hn', { text: k.holiday }));

  // Googleカレンダー（最大2行 / 月表示は時間なし）
  var evs = (S.gcal.events[day] || []).slice(0, 2);
  evs.forEach(function (ev) {
    var t = '';
    if (!compact && !ev.allDay && ev.start) t = Number(ev.start.slice(11, 13)) + '時 ';
    cell.appendChild(el('div.ev', { text: t + ev.summary, title: ev.summary }));
  });

  // ステータスアイコン
  var chips = el('div.chips');
  var marks = (S.marks[day] || []).slice(0, 4);
  marks.forEach(function (mk) {
    chips.appendChild(el('div.chip.' + mk.kind, { text: mk.label, title: mk.type + ' ' + mk.id }));
  });
  var mkt = S.market[day];
  if (mkt && mkt.label && (!compact || marks.length < 4)) {
    chips.appendChild(el('div.chip.' + (mkt.label === '市' ? 'mkt' : 'mkt2') + (S.marketEstimated ? '.est' : ''),
      { text: mkt.label, title: '市場開場日' + (S.marketEstimated ? '（推定）' : '') }));
  }
  if (isOff) chips.appendChild(el('div.chip.off', { text: '休', title: '担当の休み' }));
  cell.appendChild(chips);

  bindCellTap(cell, day);
  return cell;
}

/**
 * タップ＝日付リスト / ロングタップ＝休日登録
 *  Pointer Events で実装（マウス・タッチ・ペンを同じコードで扱える）
 */
function bindCellTap(cell, day) {
  var timer = null, longed = false, x0 = 0, y0 = 0, down = false;
  function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
  cell.addEventListener('pointerdown', function (e) {
    down = true; longed = false;
    x0 = e.clientX; y0 = e.clientY;
    cancel();
    timer = setTimeout(function () {
      longed = true; down = false;
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch (err) { } }
      askOffDay(day);
    }, 550);
  });
  cell.addEventListener('pointermove', function (e) {
    if (!down) return;
    if (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10) { down = false; cancel(); }
  });
  cell.addEventListener('pointercancel', function () { down = false; cancel(); });
  cell.addEventListener('pointerup', function () {
    cancel();
    if (!down || longed) { down = false; return; }
    down = false;
    openDateList(day);
  });
}

function askOffDay(day) {

/** 表示範囲のデータが無ければ取得 */
function ensureVisibleData() {
  var r = calcRange();
  var need = (!S.loadedRange.from || r.from < S.loadedRange.from || r.to > S.loadedRange.to);
  var year = (S.anchor || new Date()).getFullYear();
  var p = ensureMarketYear(year);
  if (need) {
    p = p.then(function () {
      return reloadOrders(r.from, r.to).then(function () { refreshCalendar(); });
    });
  }
  p.then(function () { return loadGcalEvents(r.from, r.to); })
    .then(function (changed) { if (changed) refreshCalendar(); })
    .catch(function () { });
}

/* ==========================================================================
 *  画面遷移（簡易ルータ）＋ ドロワー ＋ アカウント ＋ 顧客/仲卸台帳
 * ========================================================================== */
S.navP = [];

function navTo(v, p) {
  S.nav.push(v); S.navP.push(p || {});
  render();
}
function navReplace(v, p) {
  if (S.nav.length) { S.nav.pop(); S.navP.pop(); }
  navTo(v, p);
}
function back() {
  if (S.nav.length <= 1) { navRoot(); return; }
  S.nav.pop(); S.navP.pop();
  render();
}
/** カレンダーへ戻る（履歴スタックをリセット） */
function navRoot() { S.nav = ['cal']; S.navP = [{}]; render(); }
/** メニューからの遷移：履歴を [カレンダー, 目的の画面] にする */
function navFromMenu(v, p) { S.nav = ['cal']; S.navP = [{}]; navTo(v, p); }
function curView() { return S.nav[S.nav.length - 1]; }
function curParams() { return S.navP[S.navP.length - 1] || {}; }

function render() {
  var v = curView(), p = curParams();
  closeDrawer();
  window.scrollTo(0, 0);
  switch (v) {
    case 'cal': renderCalendar(); break;
    case 'account': renderAccount(); break;
    case 'partner': renderPartnerList(p.kind); break;
    case 'partnerEdit': renderPartnerEdit(p.kind, p.data, p.after); break;
    case 'orderForm': renderOrderForm(p); break;
    case 'orderEdit': renderOrderEdit(p); break;
    case 'billing': renderBilling(p.mode); break;
    case 'gcal': renderGcal(); break;
    case 'fax': renderFax(); break;
    case 'log': renderLog(); break;
    default: renderCalendar();
  }
}

      if (has(r[M.mail])) acts.appendChild(el('a', { href: 'mailto:' + r[M.mail], text: '✉️', title: 'メール', onclick: stop }));
      if (has(r[M.hp])) acts.appendChild(el('a', { href: r[M.hp], target: '_blank', rel: 'noopener', text: '🌐', title: 'HP', onclick: stop }));
      if (has(r[M.addr])) {
        acts.appendChild(el('a', {
          href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r[M.addr]),
          target: '_blank', rel: 'noopener', text: '🗺️', title: '地図', onclick: stop
        }));
      }
      host.appendChild(el('div.li', null, [
        el('button', {
          style: 'flex:1;min-width:0;text-align:left;background:none;padding:0',
          onclick: function () { navTo('partnerEdit', { kind: M.kind, data: r }); }
        }, [
          el('div.t1', null, [r[M.nameCol], r.mine ? el('span.badge.g', { style: 'margin-left:6px', text: '担当' }) : null]),
          el('div.t2', { text: [r['役職'], r['担当者']].filter(has).join(' / ') + (r['担当ID'] ? '　担当:' + tantoName(r['担当ID']) : '') })
        ]),
        acts
      ]));
    });
  }).catch(function () { clear(host).appendChild(el('div.empty', { text: '読み込み失敗' })); });

  main.appendChild(el('div.fabrow', null, [
    el('button.fab.gray', { text: '←', onclick: back }),
    el('button.fab', { text: '＋', onclick: function () { navTo('partnerEdit', { kind: M.kind, data: null }); } })
  ]));

  function stop(e) { e.stopPropagation(); }
}

function renderPartnerEdit(kind, data, after) {
  var M = partnerMeta(kind);
  var isNew = !data;
  setHeader('濵貞アプリ', { back: true });
  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  var f = {};
  var inner = el('div.in');
  M.cols.forEach(function (c) {
    var key = c[0], label = c[1], type = c[2], ph = c[3], req = c[4];
    var i = (type === 'textarea')
      ? el('textarea', { placeholder: ph || '' })
      : el('input', { type: type, placeholder: ph || '' });
    i.value = data ? (data[key] || '') : '';
    f[key] = i;
    inner.appendChild(el('div.fld', null, [
      el('label', { html: esc(label) + (req ? ' <span class="rq">*</span>' : '') }), i
    ]));
  });
  var tsel = el('select');
  S.tantos.forEach(function (t) { tsel.appendChild(el('option', { value: t.担当ID, text: t.担当名 })); });
  tsel.value = (data && data['担当ID']) || (S.me ? S.me.担当ID : '');
  inner.appendChild(el('div.fld', null, [el('label', { text: '担当（濵貞スタッフ）' }), tsel]));

  sc.appendChild(el('div.sec', null, [
    el('h3', { text: M.kind + (isNew ? ' 新規登録' : ' 情報編集') }),
    inner
  ]));
  if (!isNew) {
    sc.appendChild(el('div.sec', null, [el('div.in', null, [
      el('div.hint', { text: M.kind + 'ID: ' + data[M.idCol] })
    ])]));
  }

  var fabs = el('div.fabrow');
  fabs.appendChild(el('button.fab.gray', { text: '←', onclick: back }));
  if (!isNew) {
    fabs.appendChild(el('button.fab.r', {
      text: '🗑', title: '削除', onclick: function () { doDelete(); }
    }));
  }
  fabs.appendChild(el('button.fab.g', { text: '💾', onclick: doSave }));
  main.appendChild(fabs);

  function collect() {
    var o = {};
    M.cols.forEach(function (c) { o[c[0]] = f[c[0]].value; });
    o['担当ID'] = tsel.value;
    if (!isNew) o[M.idCol] = data[M.idCol];
    return o;
  }
  function doSave() {
    var o = collect();
    if (!has(o[M.nameCol])) { toast('名称は必須です', 'err'); return; }
    api('partner.save', { kind: M.kind, data: o }).then(function (d) {
      toast(isNew ? M.kind + 'を登録しました' : '更新しました');
      return api('partner.list', { kind: M.kind }).then(function (l) {
        if (M.kind === '仲卸') S.brokers = l.list; else S.customers = l.list;
        // 登録後は呼び出し元の画面に名前を張り付ける（仕様書 p6-6）
        if (after) { after(d.id, o[M.nameCol]); back(); }
        else back();
      });
    });
  }
  function doDelete() {
    confirmModal('削除', M.kind + '「' + data[M.nameCol] + '」を削除します。\n（物理削除のため元に戻せません）', '削除する', 'd')
      .then(function (ok) {
        if (!ok) return;
        return api('partner.delete', { kind: M.kind, id: data[M.idCol] }).then(function (d) {
          if (d.needConfirm) {
            return confirmModal('確認', d.message, '強制削除', 'd').then(function (ok2) {
              if (!ok2) return;
              return api('partner.delete', { kind: M.kind, id: data[M.idCol], force: true }).then(done);
            });
          }
          done();
        });
      });
    function done() {
      toast('削除しました');
      api('partner.list', { kind: M.kind }).then(function (l) {
        if (M.kind === '仲卸') S.brokers = l.list; else S.customers = l.list;
        back();
      });
    }
  }
}

/* ==========================================================================
 *  依頼登録 / 発注登録（新規）  仕様書 p6 の 1〜12
 * ========================================================================== */

var UNIT_LIST = ['kg', '箱', 'パック', '束', '本', '個', '-'];
var CONTACTS = ['FAX', '電話', '口頭', 'メール', 'LINE', 'その他'];

function openOrderForm(type, init) {
  navTo('orderForm', { type: type, init: init || {}, draft: null });
}

function renderOrderForm(P) {
  var type = P.type;
  var isReq = (type === '依頼');
  var kind = isReq ? 'req' : 'ord';
  var d = P.draft || Object.assign({
    日付: todayYmd(), 連絡形態: 'FAX', 取引先ID: '', 取引先名: '', 概要: '',
    希望納品日: '', 使用日: '', 市場開場日: isReq ? '' : todayYmd(), 補足事項: '',
    担当ID: (S.me ? S.me.担当ID : ''), 依頼ID: '', items: [newItem()]
  }, P.init || {});
  if (!d.items || !d.items.length) d.items = [newItem()];
  P.draft = d;

  setHeader(isReq ? '顧客依頼' : '仲卸発注', {
    back: true, kind: kind, tanto: d.担当ID,
    onTanto: function (v) { d.担当ID = v; }
  });

  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  /* ---- 日付 / 連絡形態 / キャンセル ---- */
  var dateBtn = el('button.btn.gh', {
    style: 'width:100%;text-align:left',
    text: dateLabel(d.日付),
    onclick: function () {
      pickDate('日付を選択', d.日付).then(function (v) {
        if (v === null) return;
        d.日付 = v; dateBtn.textContent = dateLabel(v);
      });
    }
  });
  var contactSel = sel(CONTACTS, d.連絡形態, function (v) { d.連絡形態 = v; });
  contactSel.setAttribute('data-t', 'contact');

  sc.appendChild(el('div.sec', null, [
    el('div.in', null, [
      el('div.row.a', null, [
        el('div.fld', { style: 'flex:1' }, [el('label', { text: '日付' }), dateBtn]),
        el('div.fld.w110', null, [el('label', { text: '連絡形態' }), contactSel])
      ]),
      el('button.btn.d', { style: 'width:100%', text: '✕ キャンセル（記録を残して取消）', onclick: doCancel })
    ])
  ]));

  /* ---- 取引先 ---- */
  var pSel = el('select', { 'data-t': 'partner' });
  function fillPartner() {
    clear(pSel);
    pSel.appendChild(el('option', { value: '', text: (isReq ? '顧客' : '仲卸') + 'を選択…' }));
    var list = isReq ? S.customers : S.brokers;
    var idc = isReq ? '顧客ID' : '仲卸ID', nc = isReq ? '顧客名' : '仲卸名';
    list.forEach(function (r) {
      pSel.appendChild(el('option', {
        value: String(r[idc]),
        text: r[nc] + (r.mine ? ' ★' : '') + (has(r['担当者']) ? '（' + r['担当者'] + '）' : '')
      }));
    });
    pSel.appendChild(el('option', { value: '__new__', text: '＋ 新規登録…' }));
    pSel.value = String(d.取引先ID || '');
  }
  fillPartner();
  pSel.onchange = function () {
    if (pSel.value === '__new__') {
      pSel.value = String(d.取引先ID || '');
      P.draft = collect();
      navTo('partnerEdit', {
        kind: isReq ? '顧客' : '仲卸', data: null,
        after: function (id, name) { P.draft.取引先ID = String(id); P.draft.取引先名 = name; }
      });
      return;
    }
    d.取引先ID = pSel.value;
  };

  var sum = el('textarea', { placeholder: isReq ? '依頼概要（例: さくらさくみらい勝どき 8/7使用分）' : '発注概要（顧客分を合算した発注内容）' });
  sum.value = d.概要 || '';
  sum.oninput = function () { d.概要 = sum.value; };

  sc.appendChild(el('div.sec', null, [
    el('h3', { text: isReq ? '顧客・依頼内容' : '仲卸・発注内容' }),
    el('div.in', null, [
      el('div.fld', null, [el('label', { html: (isReq ? '顧客' : '仲卸') + ' <span class="rq">*</span>' }), pSel]),
      el('div.fld', null, [el('label', { text: isReq ? '依頼概要' : '発注概要' }), sum])
    ])
  ]));

  /* ---- 日付欄（依頼: 希望納品日/使用日 ・ 発注: 市場開場日）＋ 補足事項 ---- */
  var extra = el('div.in');
  if (isReq) {
    extra.appendChild(el('div.row', null, [
      dateFld('希望納品日', '希望納品日'),
      dateFld('使用日', '使用日')
    ]));
  } else {
    extra.appendChild(dateFld('市場開場日', '市場開場日'));
  }
  var note = el('textarea', { placeholder: '補足事項（例: 大小込みで／小口分け希望 など）' });
  note.value = d.補足事項 || '';
  note.oninput = function () { d.補足事項 = note.value; };
  extra.appendChild(el('div.fld', null, [el('label', { text: '補足事項' }), note]));
  sc.appendChild(el('div.sec', null, [el('h3', { text: '日程・補足' }), extra]));

  function dateFld(label, key) {
    var b = el('button.btn.gh', {
      style: 'width:100%;text-align:left', text: d[key] ? dateLabel(d[key]) : '（未設定）',
      onclick: function () {
        pickDate(label, d[key] || d.日付).then(function (v) {
          if (v === null) return;
          d[key] = v; b.textContent = v ? dateLabel(v) : '（未設定）';
          if (key === '市場開場日' && v && !S.market[v]) {
            toast('この日は市場が休市の可能性があります', 'warn', 4000);
          }
        });
      }
    });
    return el('div.fld', null, [el('label', { text: label }), b]);
  }

  /* ---- 品名情報 ---- */
  var itemsHost = el('div.in');
  sc.appendChild(el('div.sec', null, [
    el('h3', { text: '品名情報' }),
    itemsHost
  ]));
  function drawItems() {
    clear(itemsHost);
    d.items.forEach(function (it, i) { itemsHost.appendChild(itemCard(it, i)); });
    itemsHost.appendChild(el('button.btn.n', {
      style: 'width:100%', text: '＋ 品名項目を追加', 'data-t': 'itemAdd',
      onclick: function () { d.items.push(newItem()); drawItems(); }
    }));
  }
  drawItems();

  function itemCard(it, idx) {
    var card = el('div.item');
    card.appendChild(el('div.ih', null, [
      el('span.no', { text: '#' + (idx + 1) }),
      el('div.sp'),
      el('button.btn.s.d', {
        text: '取消し', 'data-t': 'itemDel', onclick: function () {
          d.items.splice(idx, 1);
          if (!d.items.length) d.items.push(newItem());
          drawItems();
        }
      })
    ]));

    // 青果 / 水産 タブ
    var tabs = el('div.tabs');
    ['青果', '水産'].forEach(function (k) {
      tabs.appendChild(el('button' + (it.マスタ区分 === k ? '.on' : ''), {
        text: k, onclick: function () { it.マスタ区分 = k; it.分類 = ''; drawItems(); }
      }));
    });
    card.appendChild(tabs);

    // 分類ボタン
    if (it.マスタ区分) {
      var master = (it.マスタ区分 === '青果') ? S.seika : S.suisan;
      var cats = Object.keys((master && master.byCat) || {});
      var order = (it.マスタ区分 === '青果') ? ['野菜', '果物'] : ['大物', '鮮魚', '活魚', '冷凍', '塩干加工'];
      cats.sort(function (a, b) {
        var ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      var cbox = el('div.cats');
      cats.forEach(function (c) {
        cbox.appendChild(el('button' + (it.分類 === c ? '.on' : ''), {
          text: c, onclick: function () { it.分類 = (it.分類 === c ? '' : c); drawItems(); }
        }));
      });
      card.appendChild(cbox);

      // 品名コンボボックス（五十音順）
      if (it.分類) {
        var rows = ((master.byCat || {})[it.分類] || []);
        var msel = el('select');
        msel.appendChild(el('option', { value: '', text: '品名を選択…（' + rows.length + '件）' }));
        rows.forEach(function (r, ri) {
          msel.appendChild(el('option', {
            value: String(ri), text: r.name + (has(r.origin) ? '（' + r.origin + '）' : '')
          }));
        });
        msel.setAttribute('data-t', 'itemMaster');
        msel.onchange = function () {
          var r = rows[Number(msel.value)];
          if (!r) return;
          it.品名 = r.name; it.産地 = r.origin || ''; it.マスタID = r.id;
          drawItems();
        };
        card.appendChild(el('div.fld', null, [el('label', { text: '品名リスト（五十音順）' }), msel]));
      }
    }

    var nameIn = el('input', { type: 'text', placeholder: '品名（手入力も可）', value: it.品名 || '', 'data-t': 'itemName' });
    nameIn.oninput = function () { it.品名 = nameIn.value; };
    card.appendChild(el('div.fld', null, [el('label', { html: '品名 <span class="rq">*</span>' }), nameIn]));

    var qIn = el('input', { type: 'number', step: '0.01', inputmode: 'decimal', placeholder: '0.0', value: it.数量 === '' ? '' : it.数量, 'data-t': 'itemQty' });
    qIn.oninput = function () { it.数量 = qIn.value; };
    var uSel = sel(UNIT_LIST, it.単位 || 'kg', function (v) { it.単位 = v; });
    card.appendChild(el('div.row', null, [
      el('div.fld', { style: 'flex:1' }, [el('label', { text: '数量' }), qIn]),
      el('div.fld.w90', null, [el('label', { text: '単位' }), uSel])
    ]));

    var oIn = el('input', { type: 'text', placeholder: '産地', value: it.産地 || '' });
    oIn.oninput = function () { it.産地 = oIn.value; };
    var mIn = el('input', { type: 'text', placeholder: 'メモ', value: it.メモ || '' });
    mIn.oninput = function () { it.メモ = mIn.value; };
    card.appendChild(el('div.row', null, [
      el('div.fld', { style: 'flex:1' }, [el('label', { text: '産地' }), oIn]),
      el('div.fld', { style: 'flex:1' }, [el('label', { text: 'メモ' }), mIn])
    ]));
    return card;
  }

  /* ---- FAB ---- */
  main.appendChild(el('div.fabrow', null, [
    el('button.fab.gray', { text: '←', onclick: back }),
    el('button.fab.r', { text: '🗑', title: 'キャンセル', onclick: doCancel }),
    el('button.fab.g', { text: '💾', title: '確定登録', onclick: doSave })
  ]));

  /* ---- 収集 ---- */
  function collect() {
    return {
      日付: d.日付, 連絡形態: d.連絡形態, 取引先ID: d.取引先ID, 取引先名: d.取引先名,
      概要: sum.value, 希望納品日: d.希望納品日, 使用日: d.使用日,
      市場開場日: d.市場開場日, 補足事項: note.value,
      担当ID: $('#hTanto').value || d.担当ID, 依頼ID: d.依頼ID,
      items: d.items
    };
  }

  function validItems(o) {
    return (o.items || []).filter(function (i) { return has(i.品名); });
  }

  /* ---- 確定登録（仕様書 p6-12） ---- */
  function doSave() {
    var o = collect();
    if (!has(o.取引先ID)) { toast((isReq ? '顧客' : '仲卸') + 'を選択してください', 'err'); return; }
    var items = validItems(o);
    if (!items.length) { toast('品名を1件以上入力してください', 'err'); return; }

    confirmModal('確定登録',
      (isReq ? '顧客依頼' : '仲卸発注') + 'を確定登録しますか？\n\n' +
      '　' + dateLabel(o.日付) + '\n' +
      '　' + (partnerOf(type, o.取引先ID).name || o.取引先名) + '\n' +
      '　品名 ' + items.length + '件',
      '確定登録', 'p'
    ).then(function (ok) {
      if (!ok) return;
      submit(o, items, false);
    });
  }

  function submit(o, items, force) {
    api('order.create', {
      type: type, force: force,
      data: {
        日付: o.日付, 連絡形態: o.連絡形態, 取引先ID: o.取引先ID, 概要: o.概要,
        希望納品日: o.希望納品日, 使用日: o.使用日,
        市場開場日: o.市場開場日, 補足事項: o.補足事項,
        担当ID: o.担当ID, 依頼ID: o.依頼ID
      },
      items: items
    }).then(function (r) {
      if (r.needConfirm) { showDupWarning(r, function () { submit(o, items, true); }); return; }
      toast((isReq ? '依頼' : '発注') + ' ' + r.id + ' を登録しました');
      afterCreate(r.id, o, items);
    });
  }

  /** 登録後のモーダル連鎖 */
  function afterCreate(id, o, items) {
    reloadOrders().then(function () { /* カレンダー用データ更新 */ });
    if (isReq) {
      // 「この情報を仲卸発注にコピー編集しますか？」
      confirmModal('仲卸発注へコピー', 'この情報を仲卸発注にコピー編集しますか？', 'コピーする', 'n')
        .then(function (ok) {
          if (!ok) { back(); return; }
          navReplace('orderForm', {
            type: '発注',
            init: {
              日付: todayYmd(), 連絡形態: o.連絡形態, 概要: o.概要,
              市場開場日: o.希望納品日 || todayYmd(), 補足事項: o.補足事項,
              担当ID: o.担当ID, 依頼ID: id,
              items: items.map(function (i) {
                return {
                  品名: i.品名, 産地: i.産地, メモ: i.メモ, 数量: i.数量, 単位: i.単位,
                  マスタ区分: i.マスタ区分, マスタID: i.マスタID, 分類: i.分類
                };
              })
            }
          });
          toast('依頼内容をコピーしました。仲卸を選択して登録してください', 'info', 4200);
        });
    } else {
      // 「発注書PDFを発行しますか？」
      confirmModal('発注書PDF', '発注書PDFを発行しますか？\n（金額の入っていない仲卸業者向けPDFです）', '発行する', 'n')
        .then(function (ok) {
          if (ok) issuePdf('発注書', { id: id });
          back();
        });
    }
  }

  /** キャンセル（記録を残す：ステータス X で登録） */
  function doCancel() {
    var o = collect();
    var items = validItems(o);
    var dInp = el('input', { type: 'date', value: todayYmd(), style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px' });
    var rInp = el('textarea', { style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:70px' });
    rInp.value = o.概要 || (isReq ? '依頼概要' : '発注概要');
    var body = el('div', null, [
      el('div.fld', null, [el('label', { text: 'キャンセル日' }), dInp]),
      el('div.fld', null, [el('label', { text: 'キャンセル理由' }), rInp]),
      el('div.hint', { text: '※ステータス「X」で記録し、論理削除します（履歴は残ります）。' })
    ]);
    modal({
      title: 'キャンセル', body: body, closable: false,
      buttons: [
        { label: '戻る' },
        {
          label: 'キャンセル確定', cls: 'd', fn: function () {
            if (!has(o.取引先ID) || !items.length) {
              // 未入力なら入力破棄だけ
              toast('入力を破棄しました', 'info');
              back();
              return;
            }
            api('order.create', {
              type: type, force: true,
              data: {
                日付: o.日付, 連絡形態: o.連絡形態, 取引先ID: o.取引先ID, 概要: o.概要,
                希望納品日: o.希望納品日, 使用日: o.使用日,
                市場開場日: o.市場開場日, 補足事項: o.補足事項,
                担当ID: o.担当ID, 依頼ID: o.依頼ID
              },
              items: items
            }).then(function (r) {
              return api('order.cancel', {
                type: type, id: r.id,
                'キャンセル日': dInp.value, 'キャンセル理由': rInp.value
              });
            }).then(function () {
              toast('キャンセルとして記録しました', 'warn');
              return reloadOrders();
            }).then(back);
          }
        }
      ]
    });
  }
}

function newItem() {
  return { マスタ区分: '青果', 分類: '', 品名: '', 産地: '', メモ: '', 数量: '', 単位: 'kg', マスタID: '' };
}
function dateLabel(s) {
  if (!s) return '（未設定）';
  var k = KOYOMI.info(s);
  return mdw(s) + '　' + (k.rokuyo || '') + (k.holiday ? ' ' + k.holiday : '') +
    (S.market[s] ? ' [' + S.market[s].label + ']' : '');
}
function sel(list, cur, onChange) {
  var s = el('select');
  list.forEach(function (v) { s.appendChild(el('option', { value: v, text: v })); });
  s.value = cur;
  s.onchange = function () { onChange(s.value); };
  return s;
}

/* ==========================================================================
 *  重複注文の警告（濵貞スタッフ間の二重注文防止）
 * ========================================================================== */
function showDupWarning(r, onForce) {
  var body = el('div');
  var others = r.warnings.filter(function (w) { return w.level === 'other'; });
  var selfs = r.warnings.filter(function (w) { return w.level !== 'other'; });
  body.appendChild(el('div', {
    style: 'font-size:14px;font-weight:700;margin-bottom:8px',
    text: '同じ品名の注文が既に登録されています。二重注文でないか確認してください。'
  }));
  function box(title, list, cls) {
    if (!list.length) return null;
    var b = el('div.wbox' + (cls ? '.' + cls : ''));
    b.appendChild(el('div.wt', { text: title }));
    var t = el('table.tbl');
    t.appendChild(el('tr', null, [
      el('th', { text: '種別' }), el('th', { text: '品名' }), el('th', { text: '数量' }),
      el('th', { text: '取引先' }), el('th', { text: '担当' }), el('th', { text: '日付' })
    ]));
    list.forEach(function (w) {
      t.appendChild(el('tr', null, [
        el('td', null, [el('span.badge.' + (w.種別 === '依頼' ? 'req' : 'ord'), { text: w.種別 })]),
        el('td', { text: w.品名 }),
        el('td.n', { text: qty(w.数量) + (w.単位 || '') }),
        el('td', { text: w.取引先名 }),
        el('td', { text: w.担当名 }),
        el('td', { text: md(w.使用日 || w.日付) })
      ]));
    });
    b.appendChild(t);
    return b;
  }
  var o1 = box('⚠ 他の担当が既に手配しています', others, 'other');
  if (o1) body.appendChild(o1);
  var o2 = box('ℹ 自分が過去に登録した同一品名', selfs);
  if (o2) body.appendChild(o2);

  modal({
    title: '重複注文の確認', body: body, closable: false,
    buttons: [
      { label: '戻って修正' },
      { label: 'それでも登録する', cls: 'w', fn: onForce }
    ]
  });
}

/* ==========================================================================
 *  編集更新画面（納品確定 / 入荷確定）  仕様書 p7 の 1〜10
 * ========================================================================== */

function openOrderEdit(type, id) {
  api('order.get', { type: type, id: id }).then(function (got) {
    var h = got.head;
    var locked = (h.ステータス === 'X' || h.ステータス === '5' || h.ステータス === '6');
    if (locked) { navTo('orderEdit', { got: got, locked: true }); return; }
    // 「納品確定日（もしくは入荷確定日）を入力してください」
    askConfirmDate(h).then(function (v) {
      if (v === false) return;                       // 戻る
      h.確定日 = v || h.確定日 || '';
      navTo('orderEdit', { got: got, locked: false });
    });
  });
}

function askConfirmDate(h) {
  return new Promise(function (res) {
    var cur = h.確定日 || '';
    var btn = el('button.btn.gh', {
      style: 'width:100%;text-align:left;padding:14px',
      text: cur ? dateLabel(cur) : '（空欄）タップしてカレンダーから選択',
      onclick: function () {
        pickDate(h.確定日ラベル, cur || todayYmd()).then(function (v) {
          if (v === null) return;
          cur = v;
          btn.textContent = cur ? dateLabel(cur) : '（空欄）タップしてカレンダーから選択';
        });
      }
    });
    var body = el('div', null, [
      el('div', { style: 'font-size:14px;margin-bottom:10px', text: h.確定日ラベル + 'を入力してください' }),
      btn,
      el('div.hint', {
        text: (h.type === '依頼' ? '顧客' : '仲卸') + '：' + h.取引先名 + '　/　' +
          h.type + '日：' + mdw(h.日付)
      })
    ]);
    modal({
      title: h.確定日ラベル + 'の入力', body: body, closable: false,
      buttons: [
        { label: '戻る', fn: function () { res(false); } },
        { label: 'あとで入力', fn: function () { res(''); } },
        { label: '日付確定', cls: 'p', fn: function () { res(cur); } }
      ]
    });
  });
}

function renderOrderEdit(P) {
  var got = P.got, h = got.head;
  var isReq = (h.type === '依頼');
  var kind = isReq ? 'req' : 'ord';
  var locked = !!P.locked;

  var items = got.items.filter(function (i) { return i.区分 !== '値引き'; });
  var discounts = got.items.filter(function (i) { return i.区分 === '値引き'; })
    .map(function (i) { return { 金額: Math.abs(num(i.金額)), メモ: i.メモ }; });
  var manual = !!h.合計手入力;

  setHeader(isReq ? '顧客納品' : '仲卸入荷', {
    back: true, kind: kind, tanto: h.担当ID,
    onTanto: function (v) { h.担当ID = v; }
  });

  var main = clear($('#main'));
  var sc = el('div.scroll');
  main.appendChild(sc);

  /* ---- 概要（編集可）＋ その他は文字表示（仕様書 p7-5） ---- */
  var sumTa = el('textarea');
  sumTa.value = h.概要 || '';
  if (locked) sumTa.disabled = true;

  function ro(label, val) {
    return el('div.fld', null, [el('label', { text: label }), el('div.ro', { text: val || '－' })]);
  }

  sc.appendChild(el('div.sec', null, [
    el('h3', {
      text: h.type + ' ' + h.id + '　' +
        (locked ? '【' + statusLabel({ type: h.type, ステータス: h.ステータス }) + '／閲覧のみ】' : '')
    }),
    el('div.in', null, [
      el('div.row', null, [
        ro(h.type + '日', mdw(h.日付)),
        ro('連絡形態', h.連絡形態)
      ]),
      ro(isReq ? '顧客' : '仲卸', h.取引先名 + (h.取引先ID !== '' ? '（ID:' + h.取引先ID + '）' : '')),
      el('div.fld', null, [el('label', { text: isReq ? '依頼概要（編集可）' : '発注概要（編集可）' }), sumTa]),
      isReq
        ? el('div.row', null, [ro('希望納品日', mdw(h.希望納品日)), ro('使用日', mdw(h.使用日))])
        : el('div.row', null, [ro('市場開場日', mdw(h.市場開場日)), ro('補足事項', h.補足事項)]),
      confirmDateFld(),
      h.ステータス === 'X' ? el('div.row', null, [
        ro('キャンセル日', mdw(h.キャンセル日)), ro('キャンセル理由', h.キャンセル理由)
      ]) : null,
      h.請求日 ? ro('請求日', mdw(h.請求日)) : null,
      h.支払確認日 ? ro('支払確認日', mdw(h.支払確認日)) : null,
      h.依頼ID && !isReq ? ro('紐付く依頼ID', h.依頼ID) : null,
      h.発注ID && isReq ? ro('紐付く発注ID', h.発注ID) : null
    ])
  ]));

  var cdBtn;
  function confirmDateFld() {
    cdBtn = el('button.btn.gh', {
      style: 'width:100%;text-align:left',
      text: h.確定日 ? dateLabel(h.確定日) : '（未入力）',
      onclick: function () {
        if (locked) return;
        pickDate(h.確定日ラベル, h.確定日 || todayYmd()).then(function (v) {
          if (v === null) return;
          h.確定日 = v;
          cdBtn.textContent = v ? dateLabel(v) : '（未入力）';
        });
      }
    });
    return el('div.fld', null, [el('label', { text: h.確定日ラベル }), cdBtn]);
  }

  /* ---- 品名情報＋金額 ---- */
  var itemsHost = el('div.in');
  sc.appendChild(el('div.sec', null, [el('h3', { text: '品名情報・金額' }), itemsHost]));
  var totalIn, totalNote;

  function drawItems() {
    clear(itemsHost);
    var t = el('table.tbl');
    t.appendChild(el('tr', null, [
      el('th', { text: '品名' }), el('th', { style: 'width:64px', text: '数量' }),
      el('th', { style: 'width:46px', text: '単位' }), el('th', { style: 'width:104px', text: '金額' })
    ]));
    items.forEach(function (it, i) {
      var amtIn = el('input', {
        type: 'number', inputmode: 'numeric', step: '1', 'data-t': 'itemAmt',
        style: 'width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;text-align:right',
        value: (it.金額 === '' || it.金額 === null) ? '' : it.金額
      });
      if (locked || manual) amtIn.disabled = true;
      amtIn.oninput = function () { it.金額 = amtIn.value === '' ? '' : num(amtIn.value); recalc(); };
      it.__in = amtIn;
      t.appendChild(el('tr', null, [
        el('td', null, [
          el('div', { style: 'font-weight:700', text: it.品名 }),
          (has(it.産地) || has(it.メモ)) ? el('div', { style: 'font-size:11px;color:#6b7787', text: [it.産地, it.メモ].filter(has).join(' / ') }) : null
        ]),
        el('td.n', { text: qty(it.数量) }),
        el('td', { text: it.単位 }),
        el('td', null, [amtIn])
      ]));
      void i;
    });
    // 値引き行
    discounts.forEach(function (dc, i) {
      var dIn = el('input', {
        type: 'number', inputmode: 'numeric', 'data-t': 'discAmt',
        style: 'width:100%;padding:5px 6px;border:1px solid var(--err);border-radius:5px;text-align:right;color:var(--err)',
        value: dc.金額 || ''
      });
      if (locked) dIn.disabled = true;
      dIn.oninput = function () { dc.金額 = Math.abs(num(dIn.value)); recalc(); };
      var memoIn = el('input', {
        type: 'text', placeholder: '値引き理由',
        style: 'width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px',
        value: dc.メモ || ''
      });
      if (locked) memoIn.disabled = true;
      memoIn.oninput = function () { dc.メモ = memoIn.value; };
      t.appendChild(el('tr', null, [
        el('td', null, [el('div', { style: 'font-weight:700;color:var(--err)', text: '値引き' }), memoIn]),
        el('td', { text: '' }), el('td', { text: '' }),
        el('td', null, [
          el('div', { style: 'display:flex;gap:3px;align-items:center' }, [
            el('span', { style: 'color:var(--err);font-weight:700', text: '▲' }), dIn
          ]),
          locked ? null : el('button.btn.s.d', {
            style: 'margin-top:3px;width:100%;padding:2px', text: '削除',
            onclick: function () { discounts.splice(i, 1); drawItems(); }
          })
        ])
      ]));
    });
    itemsHost.appendChild(t);

    // 合計欄（値引きボタンは合計の左に小さく配置：仕様書 p7-7）
    totalIn = el('input', {
      type: 'number', inputmode: 'numeric', 'data-t': 'total',
      style: 'width:130px;padding:7px 8px;border:1px solid var(--navy);border-radius:6px;text-align:right;font-weight:700;font-size:16px',
      value: (h.合計金額 === '' || h.合計金額 === null) ? '' : h.合計金額
    });
    if (locked) totalIn.disabled = true;
    totalIn.oninput = function () {
      // 合計に直接入力 → 各品名の金額は空欄になる（仕様書 p7-6）
      manual = true;
      h.合計金額 = num(totalIn.value);
      items.forEach(function (it) { it.金額 = ''; if (it.__in) { it.__in.value = ''; it.__in.disabled = true; } });
      updNote();
    };
    totalNote = el('div.hint');
    itemsHost.appendChild(el('div.dsum', null, [
      el('div', { style: 'display:flex;gap:6px;align-items:center' }, [
        locked ? null : el('button.btn.s.d', {
          text: '値引き', 'data-t': 'addDisc', onclick: function () { discounts.push({ 金額: '', メモ: '' }); drawItems(); }
        }),
        locked || !manual ? null : el('button.btn.s', {
          text: '明細から再計算', onclick: function () { manual = false; recalc(); drawItems(); }
        }),
        el('span', { text: '合計' })
      ]),
      totalIn
    ]));
    itemsHost.appendChild(totalNote);
    updNote();
    if (!manual) recalc();
  }

  function recalc() {
    if (manual) { updNote(); return; }
    var s = 0;
    items.forEach(function (it) { s += num(it.金額); });
    discounts.forEach(function (dc) { s -= Math.abs(num(dc.金額)); });
    h.合計金額 = s;
    if (totalIn) totalIn.value = s ? s : '';
    updNote();
  }
  function updNote() {
    if (!totalNote) return;
    var s = 0;
    items.forEach(function (it) { s += num(it.金額); });
    var dsum = discounts.reduce(function (a, x) { return a + Math.abs(num(x.金額)); }, 0);
    totalNote.textContent = manual
      ? '合計を手入力中（各品名の金額は空欄になります）　表示: ' + yen(h.合計金額)
      : '明細計 ' + yen(s) + (dsum ? '　値引き ▲' + yen(dsum).replace('¥', '¥') : '') + '　→　合計 ' + yen(h.合計金額);
  }
  drawItems();

  /* ---- 発行済み伝票 ---- */
  if (got.slips && got.slips.length) {
    var sl = el('div.in');
    got.slips.forEach(function (s) {
      sl.appendChild(el('div', { style: 'font-size:12.5px;margin-bottom:4px' }, [
        el('span.badge.x', { text: s.伝票区分 }), ' ' + mdw(s.伝票発行日) + ' ',
        s.PDF_URL ? el('a', { href: s.PDF_URL, target: '_blank', rel: 'noopener', text: 'PDFを開く' }) : null
      ]));
    });
    sc.appendChild(el('div.sec', null, [el('h3', { text: '発行済み帳票' }), sl]));
  }

  /* ---- FAB（PDF / キャンセル / 保存） ---- */
  var fabs = el('div.fabrow');
  fabs.appendChild(el('button.fab.gray', { text: '←', onclick: back }));
  fabs.appendChild(el('button.fab.n', {
    text: '📄', title: 'PDF発行', onclick: function () {
      if (isReq) {
        choiceModal('納品書PDF', '納品書PDFを発行しますか？', [
          { label: 'キャンセル', value: null },
          { label: '金額無し', cls: 'n', value: '納品書(金額無)' },
          { label: '金額有り', cls: 'p', value: '納品書(金額有)' }
        ]).then(function (v) { if (v) issuePdf(v, { id: h.id }); });
      } else {
        confirmModal('発注書PDF', '発注書PDFを発行しますか？\n（入荷確定日・仕入金額が入力済みでも金額は載りません）', '発行する', 'n')
          .then(function (ok) { if (ok) issuePdf('発注書', { id: h.id }); });
      }
    }
  }));
  if (!locked) {
    fabs.appendChild(el('button.fab.r', { text: '🗑', title: 'キャンセル', onclick: doCancel }));
    fabs.appendChild(el('button.fab.g', { text: '💾', title: '確定登録', onclick: doSave }));
  }
  main.appendChild(fabs);

  /* ---- 保存（納品確定／入荷確定） ---- */
  function doSave() {
    if (!h.確定日) {
      toast(h.確定日ラベル + 'を入力してください', 'err');
      return;
    }
    confirmModal('確定登録',
      (isReq ? '顧客納品' : '仲卸入荷') + 'を確定登録しますか？\n\n' +
      '　' + h.確定日ラベル + '：' + mdw(h.確定日) + '\n' +
      '　合計：' + yen(h.合計金額),
      '確定登録', 'p'
    ).then(function (ok) {
      if (!ok) return;
      api('order.confirm', {
        type: h.type, id: h.id,
        data: { 概要: sumTa.value, 担当ID: $('#hTanto').value || h.担当ID, 確定日: h.確定日 },
        items: items.map(function (it) {
          return {
            品名: it.品名, 産地: it.産地, メモ: it.メモ, 数量: it.数量, 単位: it.単位,
            金額: it.金額, マスタ区分: it.マスタ区分, マスタID: it.マスタID
          };
        }),
        discounts: discounts.filter(function (d) { return num(d.金額) !== 0; }),
        '合計金額': h.合計金額,
        '合計手入力': manual
      }).then(function () {
        toast((isReq ? '納品' : '入荷') + 'を確定しました');
        return reloadOrders();
      }).then(function () {
        if (isReq) {
          choiceModal('納品書PDF', '納品書PDFを発行しますか？', [
            { label: 'キャンセル', value: null },
            { label: '金額無し', cls: 'n', value: '納品書(金額無)' },
            { label: '金額有り', cls: 'p', value: '納品書(金額有)' }
          ]).then(function (v) {
            if (v) issuePdf(v, { id: h.id }, back); else back();
          });
        } else {
          back();
        }
      });
    });
  }

  function doCancel() {
    var dInp = el('input', { type: 'date', value: todayYmd(), style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px' });
    var rInp = el('textarea', { style: 'width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:70px' });
    rInp.value = sumTa.value || h.概要 || '';
    modal({
      title: 'キャンセル', closable: false,
      body: el('div', null, [
        el('div.fld', null, [el('label', { text: 'キャンセル日' }), dInp]),
        el('div.fld', null, [el('label', { text: 'キャンセル理由' }), rInp]),
        el('div.hint', { text: '※ステータス「X」で論理削除します（履歴は残ります）' })
      ]),
      buttons: [
        { label: '戻る' },
        {
          label: 'キャンセル確定', cls: 'd', fn: function () {
            api('order.cancel', {
              type: h.type, id: h.id,
              'キャンセル日': dInp.value, 'キャンセル理由': rInp.value
            }).then(function () {
              toast('キャンセルしました', 'warn');
              return reloadOrders();
            }).then(back);
          }
        }
      ]
    });
  }
}

/* ==========================================================================
 *  PDF 発行（GASでDocs→PDF化 → Base64をダウンロード）
 * ========================================================================== */
function issuePdf(docType, params, done) {
  var m = modal({
    title: 'PDF発行', closable: false,
    body: el('div', { style: 'text-align:center;padding:16px' }, [
      el('span.spin.dk'), ' ', docType + ' を作成しています…'
    ])
  });
  api('pdf.issue', Object.assign({ docType: docType }, params)).then(function (d) {
    m.close();
    downloadBase64(d.base64, d.fileName, d.mimeType);
    toast(docType + ' を発行しました');
    if (d.driveUrl) {
      modal({
        title: 'PDF発行完了',
        body: el('div', null, [
          el('div', { style: 'font-size:14px;margin-bottom:8px', text: d.fileName }),
          el('div.hint', { text: 'ダウンロードが始まらない場合は下のリンクから開いてください。DriveにもPDFが保存されています。' }),
          el('div', { style: 'margin-top:8px' }, [
            el('a', { href: d.driveUrl, target: '_blank', rel: 'noopener', text: '📄 Driveで開く' })
          ])
        ]),
        buttons: [{ label: '閉じる', cls: 'p', fn: function () { if (done) done(); } }]
      });
    } else if (done) done();
  }).catch(function () { m.close(); if (done) done(); });
}

function downloadBase64(b64, name, mime) {
  try {
    var bin = atob(b64);
    var len = bin.length;
    var buf = new Uint8Array(len);
    for (var i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
    var blob = new Blob([buf], { type: mime || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
  } catch (e) {
    toast('ダウンロードに失敗しました: ' + e.message, 'err');
  }
}
